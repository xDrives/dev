<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Smart Virtual Mouse · Center Zone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: #0a0c14;
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .playground {
            max-width: 480px;
            width: 100%;
            color: #e2e8f0;
            text-align: center;
            padding: 2rem 1.5rem;
            background: #121624;
            border-radius: 2rem;
            border: 1px solid #2a2f42;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            pointer-events: none;
        }

        .playground h1 {
            font-size: 2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.25rem;
        }

        .playground p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
        }

        .demo-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
            pointer-events: auto;
        }

        .btn {
            background: #1e2438;
            border: 1px solid #334155;
            padding: 0.7rem 1.4rem;
            border-radius: 40px;
            color: #e2e8f0;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            pointer-events: auto;
        }
        .btn:active {
            transform: scale(0.94);
            background: #2a3048;
        }
        .btn-primary {
            background: #4f46e5;
            border-color: #6366f1;
            color: #fff;
        }
        .btn-success {
            background: #15803d;
            border-color: #22c55e;
            color: #fff;
        }

        #feedback {
            margin-top: 1.5rem;
            padding: 0.8rem;
            border-radius: 0.8rem;
            background: #0f121d;
            border: 1px dashed #334155;
            color: #94a3b8;
            font-size: 0.9rem;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            pointer-events: none;
        }
        #feedback.hit {
            border-color: #a78bfa;
            color: #c4b5fd;
            background: #1a1e30;
        }

        /* ─── Circle (main cursor) ─── */
        #circle {
            position: fixed;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #818cf8, #4338ca);
            border: 2.5px solid #a5b4fc;
            box-shadow: 0 8px 40px rgba(79, 70, 229, 0.5);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 10000;
            touch-action: none;
            transition: transform 0.12s ease, box-shadow 0.15s, border-color 0.15s;
            letter-spacing: 0.3px;
            will-change: transform;
            user-select: none;
        }
        #circle:active {
            transform: translate(-50%, -50%) scale(0.88);
            box-shadow: 0 4px 24px rgba(79, 70, 229, 0.7);
            border-color: #c7d2fe;
        }
        #circle .sub {
            font-size: 0.6rem;
            opacity: 0.7;
            display: block;
            margin-top: -2px;
        }

        /* ─── Arrow (target indicator) ─── */
        #arrow {
            position: fixed;
            width: 30px;
            height: 42px;
            background: #facc15;
            clip-path: polygon(50% 0%, 0% 100%, 50% 65%, 100% 100%);
            filter: drop-shadow(0 4px 16px rgba(250, 204, 21, 0.7));
            transform: translate(-50%, -100%);
            pointer-events: none;
            z-index: 9999;
            transition: opacity 0.4s ease;
            will-change: transform;
        }
        #arrow.idle {
            opacity: 0;
        }

        /* ─── Toast ─── */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e2438;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            border: 1px solid #4f46e5;
            color: #e2e8f0;
            font-size: 0.8rem;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transition: 0.25s ease;
            pointer-events: none;
            z-index: 99999;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            #circle {
                width: 60px;
                height: 60px;
                font-size: 0.85rem;
            }
            #arrow {
                width: 24px;
                height: 34px;
            }
        }
    </style>
</head>
<body>

    <!-- ─── Circle ─── -->
    <div id="circle">
        Click
        <span class="sub">▼ fires at arrow</span>
    </div>

    <!-- ─── Arrow ─── -->
    <div id="arrow" class="idle"></div>

    <!-- ─── Toast ─── -->
    <div id="toast">✨ ready</div>

    <!-- ─── Demo content ─── -->
    <div class="playground">
        <h1>✦ Smart Virtual Mouse</h1>
        <p>Circle follows your finger.<br />
        <strong>Arrow</strong> shifts left / center / right based on where you are.<br />
        Tap the <strong>circle</strong> to click at the arrow's tip.</p>

        <div class="demo-grid">
            <button class="btn btn-primary" id="btnA">Button A</button>
            <button class="btn btn-success" id="btnB">Button B</button>
            <button class="btn" id="btnC">Button C</button>
        </div>

        <div id="feedback">✨ tap the circle to click</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ───
            const circle = document.getElementById('circle');
            const arrow = document.getElementById('arrow');
            const toast = document.getElementById('toast');
            const feedback = document.getElementById('feedback');

            // ─── state ───
            let posX = window.innerWidth / 2;
            let posY = window.innerHeight / 2;

            // ─── smart offset ───
            const OFFSET_X = 80;   // horizontal distance from circle to arrow tip
            const OFFSET_Y = 80;   // vertical distance (arrow above circle)
            const DEAD_ZONE = 0.30; // 30% of screen width on each side = 60% middle zone

            let idleTimer = null;
            let toastTimer = null;

            // ─── helpers ───
            function showToast(msg, duration = 1000) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
            }

            function clamp(value, min, max) {
                return Math.min(Math.max(value, min), max);
            }

            function updatePositions(x, y) {
                posX = x;
                posY = y;

                // circle follows finger
                circle.style.left = x + 'px';
                circle.style.top = y + 'px';

                // ── smart arrow positioning ──
                const screenWidth = window.innerWidth;
                const leftThreshold = screenWidth * DEAD_ZONE;
                const rightThreshold = screenWidth * (1 - DEAD_ZONE);

                let tipX;
                if (x < leftThreshold) {
                    // LEFT side → arrow top‑left
                    tipX = x - OFFSET_X;
                } else if (x > rightThreshold) {
                    // RIGHT side → arrow top‑right
                    tipX = x + OFFSET_X;
                } else {
                    // MIDDLE → arrow directly above
                    tipX = x;
                }

                let tipY = y - OFFSET_Y;

                // clamp to screen bounds so arrow doesn't go off‑edge
                tipX = clamp(tipX, 10, window.innerWidth - 10);
                tipY = clamp(tipY, 20, window.innerHeight - 20);

                // place arrow's tip (the bottom point of the polygon)
                arrow.style.left = tipX + 'px';
                arrow.style.top = tipY + 'px';

                // show and reset idle timer
                arrow.classList.remove('idle');
                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => {
                    arrow.classList.add('idle');
                }, 2000);
            }

            // ─── fire click at arrow tip ───
            function fireClickAtArrow() {
                // get current arrow tip position from DOM
                const tipX = parseFloat(arrow.style.left);
                const tipY = parseFloat(arrow.style.top);

                // visual feedback on circle
                circle.style.transform = 'translate(-50%, -50%) scale(0.85)';
                setTimeout(() => {
                    circle.style.transform = 'translate(-50%, -50%) scale(1)';
                }, 150);

                // hide arrow temporarily for elementFromPoint
                const wasIdle = arrow.classList.contains('idle');
                arrow.style.display = 'none';
                const target = document.elementFromPoint(tipX, tipY);
                arrow.style.display = '';
                if (!wasIdle) arrow.classList.remove('idle');

                if (!target) {
                    showToast('⚠️ nothing under arrow', 800);
                    feedback.textContent = '⚠️ nothing to click';
                    feedback.classList.add('hit');
                    setTimeout(() => feedback.classList.remove('hit'), 1000);
                    return;
                }

                // dispatch click events
                const events = [
                    new MouseEvent('mousedown', { view: window, bubbles: true, cancelable: true, clientX: tipX,
                        clientY: tipY, button: 0 }),
                    new MouseEvent('mouseup', { view: window, bubbles: true, cancelable: true, clientX: tipX,
                        clientY: tipY, button: 0 }),
                    new MouseEvent('click', { view: window, bubbles: true, cancelable: true, clientX: tipX,
                        clientY: tipY, button: 0 })
                ];

                let fired = false;
                for (const ev of events) {
                    const canceled = !target.dispatchEvent(ev);
                    if (ev.type === 'click' && !canceled) fired = true;
                }

                if (fired) {
                    const label = target.tagName.toLowerCase() === 'button' ?
                        (target.textContent.trim() || 'button') :
                        (target.id || target.tagName);
                    showToast(`✅ clicked "${label}"`, 1000);
                    feedback.textContent = `✅ Clicked: ${label}`;
                    feedback.classList.add('hit');
                    setTimeout(() => feedback.classList.remove('hit'), 1200);
                } else {
                    showToast('⚠️ click blocked', 800);
                }
            }

            // ─── pointer / touch move ───
            function handleMove(clientX, clientY) {
                updatePositions(clientX, clientY);
            }

            // ─── Mouse events ───
            document.addEventListener('mousemove', (e) => {
                handleMove(e.clientX, e.clientY);
            });

            // ─── Touch events ───
            document.addEventListener('touchmove', (e) => {
                const t = e.touches[0];
                if (t) handleMove(t.clientX, t.clientY);
            }, { passive: true });

            document.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                if (t) handleMove(t.clientX, t.clientY);
            }, { passive: true });

            // ─── Circle click (trigger) ───
            circle.addEventListener('click', (e) => {
                e.stopPropagation();
                fireClickAtArrow();
            });

            circle.addEventListener('touchstart', (e) => {
                e.preventDefault();
            }, { passive: false });

            circle.addEventListener('touchend', (e) => {
                e.preventDefault();
                fireClickAtArrow();
            }, { passive: false });

            // ─── Demo buttons native feedback ───
            document.querySelectorAll('.btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    feedback.textContent = `✅ Button "${btn.textContent.trim()}" clicked natively!`;
                    feedback.classList.add('hit');
                    setTimeout(() => feedback.classList.remove('hit'), 1000);
                    showToast(`🖱️ ${btn.textContent.trim()}`, 800);
                });
            });

            // ─── init ───
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            updatePositions(cx, cy);
            setTimeout(() => {
                showToast('👆 move · tap circle to click', 1500);
            }, 400);

            window.addEventListener('resize', () => {
                updatePositions(posX, posY);
            });

            console.log('🖱️ Smart Virtual Mouse: left / center / right zones');
        })();
    </script>
</body>
</html>
