<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Simple Virtual Mouse</title>
    <style>
        /* ─── reset ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: #0a0c14;
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        /* ─── demo content ─── */
        .playground {
            max-width: 480px;
            width: 100%;
            color: #e2e8f0;
            text-align: center;
            padding: 2rem 1.5rem;
            background: #121624;
            border-radius: 2rem;
            border: 1px solid #2a2f42;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            /* let touches pass through to indicator */
        }

        .playground h1 {
            font-size: 2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.25rem;
        }

        .playground p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
        }

        .demo-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
            pointer-events: auto;
            /* buttons are clickable natively too */
        }

        .btn {
            background: #1e2438;
            border: 1px solid #334155;
            padding: 0.7rem 1.4rem;
            border-radius: 40px;
            color: #e2e8f0;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            pointer-events: auto;
        }
        .btn:active {
            transform: scale(0.94);
            background: #2a3048;
        }
        .btn-primary {
            background: #4f46e5;
            border-color: #6366f1;
            color: #fff;
        }
        .btn-primary:active {
            background: #4338ca;
        }
        .btn-success {
            background: #15803d;
            border-color: #22c55e;
            color: #fff;
        }

        #click-feedback {
            margin-top: 1.5rem;
            padding: 0.8rem;
            border-radius: 0.8rem;
            background: #0f121d;
            border: 1px dashed #334155;
            color: #94a3b8;
            font-size: 0.9rem;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            pointer-events: none;
        }
        #click-feedback.hit {
            border-color: #a78bfa;
            color: #c4b5fd;
            background: #1a1e30;
        }

        /* ─── arrow (cursor) ─── */
        #arrow {
            position: fixed;
            width: 32px;
            height: 44px;
            background: #a78bfa;
            clip-path: polygon(50% 0%, 0% 100%, 50% 70%, 100% 100%);
            filter: drop-shadow(0 4px 16px rgba(167, 139, 250, 0.50));
            transform: translate(-50%, -100%);
            pointer-events: none;
            z-index: 9999;
            transition: opacity 0.5s ease;
            will-change: transform;
        }
        #arrow.idle {
            opacity: 0;
        }

        /* ─── trigger circle ─── */
        #circle {
            position: fixed;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #818cf8, #4338ca);
            border: 2px solid #a5b4fc;
            box-shadow: 0 8px 40px rgba(79, 70, 229, 0.45);
            color: #fff;
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 10000;
            touch-action: none;
            user-select: none;
            transition: transform 0.12s ease, box-shadow 0.15s ease, border-color 0.15s;
            letter-spacing: 0.5px;
            will-change: transform;
        }
        #circle:active {
            transform: translate(-50%, -50%) scale(0.88);
            box-shadow: 0 4px 24px rgba(79, 70, 229, 0.7);
            border-color: #c7d2fe;
        }
        #circle .sub {
            font-size: 0.65rem;
            opacity: 0.7;
            display: block;
            margin-top: -2px;
        }

        /* ─── small toast ─── */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e2438;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            border: 1px solid #4f46e5;
            color: #e2e8f0;
            font-size: 0.8rem;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transition: 0.25s ease;
            pointer-events: none;
            z-index: 99999;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ─── responsive ─── */
        @media (max-width: 480px) {
            #arrow {
                width: 26px;
                height: 36px;
            }
            #circle {
                width: 60px;
                height: 60px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- ─── Arrow ─── -->
    <div id="arrow" class="idle"></div>

    <!-- ─── Trigger Circle ─── -->
    <div id="circle">
        Click
        <span class="sub">▼ fires at arrow</span>
    </div>

    <!-- ─── Toast ─── -->
    <div id="toast">✨ click fired</div>

    <!-- ─── Demo content ─── -->
    <div class="playground">
        <h1>✦ Virtual Mouse</h1>
        <p>Move your finger or mouse to aim the arrow.<br />Tap the <strong>circle</strong> to click at the arrow tip.</p>

        <div class="demo-grid">
            <button class="btn btn-primary" id="btnA">Button A</button>
            <button class="btn btn-success" id="btnB">Button B</button>
            <button class="btn" id="btnC">Button C</button>
        </div>

        <div id="click-feedback">✨ click any button (or use the circle)</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── elements ───
            const arrow = document.getElementById('arrow');
            const circle = document.getElementById('circle');
            const toast = document.getElementById('toast');
            const feedback = document.getElementById('click-feedback');

            // ─── state ───
            let posX = window.innerWidth / 2;
            let posY = window.innerHeight / 2;
            const OFFSET_X = 76; // circle offset from arrow tip
            const OFFSET_Y = 76;
            let idleTimer = null;
            let toastTimer = null;

            // ─── helpers ───
            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 1000);
            }

            function updatePositions(x, y) {
                posX = x;
                posY = y;

                // arrow tip at (x, y)
                arrow.style.left = x + 'px';
                arrow.style.top = y + 'px';

                // circle offset to bottom‑right
                circle.style.left = (x + OFFSET_X) + 'px';
                circle.style.top = (y + OFFSET_Y) + 'px';

                // show and reset idle timer
                arrow.classList.remove('idle');
                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => {
                    arrow.classList.add('idle');
                }, 2000);
            }

            // ─── fire click at arrow tip ───
            function fireClickAtArrow() {
                const x = posX;
                const y = posY;

                // 1. visual feedback on the circle
                circle.style.transform = 'translate(-50%, -50%) scale(0.82)';
                setTimeout(() => {
                    circle.style.transform = 'translate(-50%, -50%) scale(1)';
                }, 150);

                // 2. get the element under the arrow tip
                // hide arrow temporarily so elementFromPoint sees what's underneath
                const wasIdle = arrow.classList.contains('idle');
                arrow.style.display = 'none';
                const target = document.elementFromPoint(x, y);
                arrow.style.display = '';
                if (!wasIdle) arrow.classList.remove('idle');

                if (!target) {
                    showToast('⚠️ nothing under arrow');
                    return;
                }

                // 3. dispatch native events (mousedown + mouseup + click)
                const events = [
                    new MouseEvent('mousedown', { view: window, bubbles: true, cancelable: true, clientX: x,
                        clientY: y, button: 0 }),
                    new MouseEvent('mouseup', { view: window, bubbles: true, cancelable: true, clientX: x, clientY: y,
                        button: 0 }),
                    new MouseEvent('click', { view: window, bubbles: true, cancelable: true, clientX: x, clientY: y,
                        button: 0 })
                ];

                let fired = false;
                for (const ev of events) {
                    const canceled = !target.dispatchEvent(ev);
                    if (ev.type === 'click' && !canceled) fired = true;
                }

                // 4. feedback
                if (fired) {
                    const tag = target.tagName.toLowerCase();
                    const id = target.id || '';
                    const label = tag === 'button' ? (target.textContent.trim() || 'button') : (id || tag);
                    showToast(`✅ clicked "${label}"`);
                    feedback.textContent = `✅ Clicked: ${label}`;
                    feedback.classList.add('hit');
                    setTimeout(() => feedback.classList.remove('hit'), 1200);
                } else {
                    showToast('⚠️ click was blocked');
                }
            }

            // ─── pointer / touch move ───
            function handleMove(clientX, clientY) {
                updatePositions(clientX, clientY);
            }

            // ─── mouse events ───
            document.addEventListener('mousemove', (e) => {
                // ignore if over circle, but we still want to update position.
                // However, if mouse is over circle, we don't want to hide the circle.
                // We just update.
                handleMove(e.clientX, e.clientY);
            });

            // ─── touch events ───
            document.addEventListener('touchmove', (e) => {
                const t = e.touches[0];
                if (t) {
                    handleMove(t.clientX, t.clientY);
                }
            }, { passive: true });

            document.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                if (t) {
                    handleMove(t.clientX, t.clientY);
                }
            }, { passive: true });

            // ─── circle click handler ───
            circle.addEventListener('click', (e) => {
                e.stopPropagation(); // avoid weirdness
                fireClickAtArrow();
            });

            // ─── also support touch on circle ───
            circle.addEventListener('touchstart', (e) => {
                e.preventDefault(); // prevent scroll
                // We'll fire on touchend to avoid double-firing, but let's fire on touchstart for responsiveness.
                // Better to fire on touchend to match native click behavior.
            }, { passive: false });

            circle.addEventListener('touchend', (e) => {
                e.preventDefault();
                fireClickAtArrow();
            }, { passive: false });

            // ─── demo buttons native feedback ───
            document.querySelectorAll('.btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // feedback is handled globally, but we add a specific highlight
                    feedback.textContent = `✅ Button "${btn.textContent.trim()}" clicked natively!`;
                    feedback.classList.add('hit');
                    setTimeout(() => feedback.classList.remove('hit'), 1000);
                    showToast(`🖱️ ${btn.textContent.trim()}`);
                });
            });

            // ─── init ───
            // center the arrow
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            updatePositions(cx, cy);
            // show a short intro
            setTimeout(() => {
                showToast('👆 move to aim · tap circle to click');
            }, 400);

            console.log('🖱️ Simple Virtual Mouse ready');
        })();
    </script>
</body>
</html>
