                                `<div class="info-row"><span>Sector Area</span><span>${(0.5*r*r*delta).toFixed(1)}</span></div>`;
                        }
                        if (c.anchors && c.anchors.length > 0) {
                            html +=
                                `<div class="info-row"><span>Anchors</span><span>${c.anchors.length}</span></div>`;
                        }
                    }
                }
                if (!html) html = 'Draw shapes.';
                infoContent.innerHTML = html;
            }

            function updateStatusBar() {
                const histCount = history.length;
                globalStats.textContent =
                    `Polygons:${polygons.length} | Circles:${circles.length} | History:${histCount}`;
                let modeText = toolMode;
                if (toolMode === 'circle') {
                    if (circleStep === 0) modeText = 'Circle – Click center';
                    else if (circleStep === 1) modeText = 'Circle – Click radius point (or Esc/DblClick for full)';
                    else if (circleStep === 2) modeText = 'Circle – Click arc end (Esc/DblClick for full)';
                } else if (toolMode === 'ngon') modeText = ngonCenter ? 'Click radius' : 'Click center';
                else if (toolMode === 'rect') modeText = rectCorner ? 'Click second corner' : 'Click first corner';
                else if (toolMode === 'ellipse') modeText = ellipseStep === 0 ? 'Click center' : (ellipseStep === 1 ?
                    'Click X radius' : 'Click Y radius');
                else if (toolMode === 'dimension') modeText = dimStep === 0 ? 'Select start' : (dimStep === 1 ?
                    'Select end' : 'Place offset');
                else if (toolMode === 'move') modeText = 'Click and drag to move the entire drawing';
                else if (toolMode === 'split') modeText = 'Click on a line or circle circumference to split';
                else if (toolMode === 'connect') {
                    if (connectFirst === null) modeText = 'Click a point to start connection';
                    else modeText = 'Click another point (or empty space to create one) to connect';
                }
                if (dragTarget !== null) modeText = 'Dragging point...';
                if (isMoving) modeText = 'Moving drawing...';
                statusText.textContent = modeText;
                document.getElementById('btnUndo').title = historyIndex > 0 ? `Undo (${historyIndex} steps)` : 'Undo';
                document.getElementById('btnRedo').title = historyIndex < history.length - 1 ?
                    `Redo (${history.length - historyIndex - 1} steps)` : 'Redo';
            }

            function polygonArea(indices) {
                if (indices.length < 3) return 0;
                let area = 0;
                for (let i = 0; i < indices.length; i++) {
                    const p1 = points[indices[i]],
                        p2 = points[indices[(i + 1) % indices.length]];
                    area += p1.x * p2.y - p2.x * p1.y;
                }
                return Math.abs(area / 2);
            }

            function polygonPerimeter(indices) {
                let p = 0;
                for (let i = 0; i < indices.length; i++) p += dist(points[indices[i]], points[indices[(i + 1) % indices
                        .length]]);
                return p;
            }

            // ── Toast ──
            let toastTimer = null;

            function showToast(msg) {
                const el = document.getElementById('toast');
                el.textContent = msg;
                el.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
            }

            // ── JSON Save/Load ──
            function saveJSON() {
                const state = captureState();
                state._meta = {
                    version: '1.0',
                    darkMode,
                    lineColor,
                    lineWidthVal,
                    lineDash,
                    pointStyle,
                    pointRadius,
                    gridStyle,
                    showLabels,
                    showDistances,
                    showAngles,
                    showAlignmentGuides,
                    showPerimeterArea
                };
                const json = JSON.stringify(state, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const link = document.createElement('a');
                link.download = 'geometry_project.json';
                link.href = URL.createObjectURL(blob);
                link.click();
                URL.revokeObjectURL(link.href);
                showToast('💾 JSON saved');
            }

            function loadJSON(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data.points) { showToast('❌ Invalid file'); return; }
                        restoreState(data);
                        if (data._meta) {
                            const m = data._meta;
                            if (m.darkMode !== undefined) {
                                darkMode = m.darkMode;
                                document.body.classList.toggle('dark-mode', darkMode);
                                document.getElementById('darkModeToggle').checked = darkMode;
                            }
                            if (m.lineColor) { lineColor = m.lineColor;
                                document.getElementById('lineColor').value = lineColor; }
                            if (m.lineWidthVal) { lineWidthVal = m.lineWidthVal;
                                document.getElementById('lineWidth').value = lineWidthVal; }
                            if (m.lineDash) { lineDash = m.lineDash;
                                document.getElementById('lineDash').value = lineDash.join(',') || ''; }
                            if (m.pointStyle) { pointStyle = m.pointStyle;
                                document.getElementById('pointStyle').value = pointStyle; }
                            if (m.pointRadius) { pointRadius = m.pointRadius;
                                document.getElementById('pointSize').value = pointRadius; }
                            if (m.gridStyle) { gridStyle = m.gridStyle;
                                document.getElementById('gridStyle').value = gridStyle; }
                            if (m.showLabels !== undefined) { showLabels = m.showLabels;
                                document.getElementById('showLabels').checked = showLabels; }
                            if (m.showDistances !== undefined) { showDistances = m.showDistances;
                                document.getElementById('showDistances').checked = showDistances; }
                            if (m.showAngles !== undefined) { showAngles = m.showAngles;
                                document.getElementById('showAngles').checked = showAngles; }
                            if (m.showAlignmentGuides !== undefined) { showAlignmentGuides = m.showAlignmentGuides;
                                document.getElementById('showAlignment').checked = showAlignmentGuides; }
                            if (m.showPerimeterArea !== undefined) { showPerimeterArea = m.showPerimeterArea;
                                document.getElementById('showPerimArea').checked = showPerimeterArea; }
                        }
                        pushHistory();
                        render();
                        showToast('📂 JSON loaded');
                    } catch (err) {
                        showToast('❌ Error loading file');
                        console.error(err);
                    }
                };
                reader.readAsText(file);
            }

            // ── Auto-save ──
            function saveToLocalStorage() {
                try {
                    const state = captureState();
                    state._meta = {
                        version: '1.0',
                        darkMode,
                        lineColor,
                        lineWidthVal,
                        lineDash,
                        pointStyle,
                        pointRadius,
                        gridStyle,
                        showLabels,
                        showDistances,
                        showAngles,
                        showAlignmentGuides,
                        showPerimeterArea
                    };
                    localStorage.setItem('geometry_pro_state', JSON.stringify(state));
                } catch (e) { /* ignore */ }
            }

            function loadFromLocalStorage() {
                try {
                    const raw = localStorage.getItem('geometry_pro_state');
                    if (!raw) return false;
                    const data = JSON.parse(raw);
                    if (!data.points) return false;
                    restoreState(data);
                    if (data._meta) {
                        const m = data._meta;
                        if (m.darkMode !== undefined) {
                            darkMode = m.darkMode;
                            document.body.classList.toggle('dark-mode', darkMode);
                            document.getElementById('darkModeToggle').checked = darkMode;
                        }
                        if (m.lineColor) { lineColor = m.lineColor;
                            document.getElementById('lineColor').value = lineColor; }
                        if (m.lineWidthVal) { lineWidthVal = m.lineWidthVal;
                            document.getElementById('lineWidth').value = lineWidthVal; }
                        if (m.lineDash) { lineDash = m.lineDash;
                            document.getElementById('lineDash').value = lineDash.join(',') || ''; }
                        if (m.pointStyle) { pointStyle = m.pointStyle;
                            document.getElementById('pointStyle').value = pointStyle; }
                        if (m.pointRadius) { pointRadius = m.pointRadius;
                            document.getElementById('pointSize').value = pointRadius; }
                        if (m.gridStyle) { gridStyle = m.gridStyle;
                            document.getElementById('gridStyle').value = gridStyle; }
                        if (m.showLabels !== undefined) { showLabels = m.showLabels;
                            document.getElementById('showLabels').checked = showLabels; }
                        if (m.showDistances !== undefined) { showDistances = m.showDistances;
                            document.getElementById('showDistances').checked = showDistances; }
                        if (m.showAngles !== undefined) { showAngles = m.showAngles;
                            document.getElementById('showAngles').checked = showAngles; }
                        if (m.showAlignmentGuides !== undefined) { showAlignmentGuides = m.showAlignmentGuides;
                            document.getElementById('showAlignment').checked = showAlignmentGuides; }
                        if (m.showPerimeterArea !== undefined) { showPerimeterArea = m.showPerimeterArea;
                            document.getElementById('showPerimArea').checked = showPerimeterArea; }
                    }
                    pushHistory();
                    render();
                    return true;
                } catch (e) { return false; }
            }

            let saveTimer = null;

            function autoSave() {
                clearTimeout(saveTimer);
                saveTimer = setTimeout(() => saveToLocalStorage(), 500);
            }

            const origPushHistory = pushHistory;
            pushHistory = function() {
                origPushHistory();
                autoSave();
            };

            // ── Events ──
            function findNearby(pos, r = HIT_R) {
                for (let i = points.length - 1; i >= 0; i--) {
                    if (dist(pos, points[i]) <= r) return i;
                }
                return null;
            }

            function isNearFirst(pos) {
                if (!currentPolyline || currentPolyline.length < 3) return false;
                const first = points[currentPolyline[0]];
                return first && dist(pos, first) <= CLOSE_R;
            }

            function finalizeDimension() {
                if (dimP1 !== null && dimP2 !== null) {
                    dimensions.push({ p1Idx: dimP1, p2Idx: dimP2, offsetPoint: { ...mouseCanvasPos } });
                    dimP1 = null;
                    dimP2 = null;
                    dimStep = 0;
                }
            }

            // ── MOUSE EVENTS ──

            canvas.addEventListener('mousedown', e => {
                if (e.button !== 0) return;
                const pos = getPos(e);
                const nearby = findNearby(pos);

                // ── MOVE tool ──
                if (toolMode === 'move') {
                    moveStartPos = { x: pos.x, y: pos.y };
                    moveStartPoints = points.map(p => ({ ...p }));
                    isMoving = true;
                    render();
                    return;
                }

                // ── CONNECT tool – handle BEFORE drag ──
                if (toolMode === 'connect') {
                    const action = () => {
                        if (connectFirst === null) {
                            // First click: select a point
                            if (nearby !== null) {
                                connectFirst = nearby;
                                showToast('🔗 First point selected');
                            } else {
                                showToast('Click on a point to start');
                            }
                        } else {
                            // Second click: connect to another point
                            let targetIdx = nearby;
                            if (targetIdx === null) {
                                // Create a new point at the click location
                                targetIdx = addPoint(pos.x, pos.y, false);
                            }
                            if (targetIdx !== connectFirst) {
                                addConnection(connectFirst, targetIdx);
                                showToast('🔗 Connected');
                            } else {
                                showToast('Cannot connect a point to itself');
                            }
                            connectFirst = null;
                        }
                        render();
                        updateStatusBar();
                    };
                    withHistory(action);
                    return;
                }

                // ── DRAG (for other tools) ──
                if (nearby !== null) {
                    dragTarget = nearby;
                    isDragging = true;
                    render();
                    return;
                }

                // ── Other tool actions ──
                const action = () => {
                    if (toolMode === 'polygon') {
                        if (isNearFirst(pos) && currentPolyline && currentPolyline.length >= 3) {
                            closeCurrentPolyline();
                            render();
                            return;
                        }
                        addPoint(pos.x, pos.y, true);
                    } else if (toolMode === 'circle') {
                        if (circleStep === 0) {
                            circleTemp.centerIdx = nearby !== null ? nearby : addPoint(pos.x, pos.y, false);
                            circleStep = 1;
                        } else if (circleStep === 1) {
                            const radIdx = nearby !== null ? nearby : addPoint(pos.x, pos.y, false);
                            circleTemp.radiusIdx = radIdx;
                            circleStep = 2;
                        } else if (circleStep === 2) {
                            const endIdx = nearby !== null ? nearby : addPoint(pos.x, pos.y, false);
                            finalizeArc(circleTemp.centerIdx, circleTemp.radiusIdx, endIdx);
                            circleStep = 0;
                            circleTemp = {};
                        }
                    } else if (toolMode === 'split') {
                        const seg = findClosestSegment(pos.x, pos.y);
                        if (seg) {
                            splitSegment(seg);
                            showToast('✂️ Segment split');
                            return;
                        }
                        const circ = findClosestCircle(pos.x, pos.y);
                        if (circ) {
                            splitCircleAtPoint(circ.circleIdx, circ.proj, circ.angle);
                            showToast('✂️ Circle split at point');
                            return;
                        }
                        showToast('No segment or circle found to split');
                    } else if (toolMode === 'delete') {
                        if (nearby !== null) deletePoint(nearby);
                    } else if (toolMode === 'rect') {
                        if (rectCorner === null) rectCorner = pos;
                        else { createRectangle(rectCorner, pos);
                            rectCorner = null; }
                    } else if (toolMode === 'ngon') {
                        if (ngonCenter === null) {
                            ngonCenter = nearby !== null ? points[nearby] : pos;
                            if (nearby === null) ngonCenter = { x: pos.x, y: pos.y };
                        } else {
                            const radiusPt = nearby !== null ? points[nearby] : pos;
                            const sides = parseInt(prompt('Number of sides?', '6'));
                            if (sides && sides >= 3) createRegularPolygon(ngonCenter, radiusPt, sides);
                            ngonCenter = null;
                        }
                    } else if (toolMode === 'ellipse') {
                        if (ellipseStep === 0) {
                            ellipseTemp.centerIdx = nearby !== null ? nearby : addPoint(pos.x, pos.y, false);
                            ellipseStep = 1;
                        } else if (ellipseStep === 1) {
                            ellipseTemp.radXIdx = nearby !== null ? nearby : addPoint(pos.x, pos.y, false);
                            ellipseStep = 2;
                        } else {
                            const ryIdx = nearby !== null ? nearby : addPoint(pos.x, pos.y, false);
                            createEllipse(ellipseTemp.centerIdx, ellipseTemp.radXIdx, ryIdx);
                            ellipseStep = 0;
                            ellipseTemp = {};
                        }
                    } else if (toolMode === 'dimension') {
                        if (dimStep === 0) { if (nearby !== null) { dimP1 = nearby;
                                dimStep = 1; } } else if (dimStep === 1) { if (nearby !== null && nearby !== dimP1) {
                                dimP2 = nearby;
                                dimStep = 2; } } else { finalizeDimension(); }
                    } else if (toolMode === 'text') {
                        const txt = prompt('Enter annotation text:');
                        if (txt) annotations.push({ x: pos.x, y: pos.y, text: txt });
                    }
                    render();
                    updateStatusBar();
                };

                withHistory(action);
            });

            canvas.addEventListener('mousemove', e => {
                const pos = getPos(e);
                mouseCanvasPos = pos;

                if (toolMode === 'move' && isMoving && moveStartPos && moveStartPoints) {
                    const dx = pos.x - moveStartPos.x;
                    const dy = pos.y - moveStartPos.y;
                    for (let i = 0; i < points.length; i++) {
                        points[i].x = moveStartPoints[i].x + dx;
                        points[i].y = moveStartPoints[i].y + dy;
                    }
                    render();
                    return;
                }

                if (isDragging && dragTarget !== null) {
                    const snapped = snapAll(pos);
                    points[dragTarget].x = snapped.x;
                    points[dragTarget].y = snapped.y;
                    let updatedCircles = new Set();
                    for (let ci = 0; ci < circles.length; ci++) {
                        const c = circles[ci];
                        if (c.centerIdx === dragTarget || c.radiusIdx === dragTarget) {
                            updatedCircles.add(ci);
                        }
                    }
                    for (let ci of updatedCircles) {
                        updateCircleAnchors(ci);
                    }
                    render();
                    return;
                }

                hoveredPoint = findNearby(pos);
                render();
            });

            canvas.addEventListener('mouseup', () => {
                if (toolMode === 'move' && isMoving) {
                    if (moveStartPos && moveStartPoints) {
                        const dx = mouseCanvasPos.x - moveStartPos.x;
                        const dy = mouseCanvasPos.y - moveStartPos.y;
                        if (dx !== 0 || dy !== 0) {
                            pushHistory();
                            showToast('✋ Drawing moved');
                        }
                    }
                    isMoving = false;
                    moveStartPos = null;
                    moveStartPoints = null;
                    render();
                    return;
                }
                isDragging = false;
                dragTarget = null;
                render();
            });

            canvas.addEventListener('mouseleave', () => {
                if (toolMode === 'move' && isMoving) {
                    if (moveStartPoints) {
                        for (let i = 0; i < points.length; i++) {
                            points[i].x = moveStartPoints[i].x;
                            points[i].y = moveStartPoints[i].y;
                        }
                    }
                    isMoving = false;
                    moveStartPos = null;
                    moveStartPoints = null;
                    render();
                    return;
                }
                isDragging = false;
                dragTarget = null;
                hoveredPoint = null;
                render();
            });

            canvas.addEventListener('dblclick', e => {
                const action = () => {
                    if (toolMode === 'circle' && circleStep === 2) {
                        finalizeFullCircle(circleTemp.centerIdx, circleTemp.radiusIdx);
                        circleStep = 0;
                        circleTemp = {};
                        render();
                    } else if (toolMode === 'polygon' && currentPolyline && currentPolyline.length >= 2) {
                        closeCurrentPolyline();
                        render();
                    }
                };
                withHistory(action);
            });

            // ── KEYBOARD ──
            window.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    const action = () => {
                        if (toolMode === 'circle' && circleStep === 2) {
                            finalizeFullCircle(circleTemp.centerIdx, circleTemp.radiusIdx);
                            circleStep = 0;
                            circleTemp = {};
                            render();
                        } else {
                            connectFirst = null;
                            currentPolyline = null;
                            circleStep = 0;
                            circleTemp = {};
                            dimStep = 0;
                            rectCorner = null;
                            ngonCenter = null;
                            ellipseStep = 0;
                            render();
                        }
                    };
                    withHistory(action);
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                    e.preventDefault();
                    undo();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
                    e.preventDefault();
                    redo();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    saveJSON();
                }
            });

            // ── TOUCH EVENTS ──

            canvas.addEventListener('touchstart', e => {
                if (e.touches.length !== 1) return;
                e.preventDefault();
                const pos = getPos(e.touches[0]);
                const nearby = findNearby(pos);

                if (toolMode === 'move') {
                    moveStartPos = { x: pos.x, y: pos.y };
                    moveStartPoints = points.map(p => ({ ...p }));
                    isMoving = true;
                    render();
                    return;
                }

                if (toolMode === 'connect') {
                    const action = () => {
                        if (connectFirst === null) {
                            if (nearby !== null) {
                                connectFirst = nearby;
                                showToast('🔗 First point selected');
                            } else {
                                showToast('Click on a point to start');
                            }
                        } else {
                            let targetIdx = nearby;
                            if (targetIdx === null) {
                                targetIdx = addPoint(pos.x, pos.y, false);
                            }
                            if (targetIdx !== connectFirst) {
                                addConnection(connectFirst, targetIdx);
                                showToast('🔗 Connected');
                            } else {
                                showToast('Cannot connect a point to itself');
                            }
                            connectFirst = null;
                        }
                        render();
                        updateStatusBar();
                    };
                    withHistory(action);
                    return;
                }

                if (nearby !== null) {
                    dragTarget = nearby;
                    isDragging = true;
                    render();
                    return;
                }

                const action = () => {
                    if (toolMode === 'polygon') {
                        if (isNearFirst(pos) && currentPolyline && currentPolyline.length >= 3) {
                            closeCurrentPolyline();
                            render();
                            return;
                        }
                        addPoint(pos.x, pos.y, true);
                    } else if (toolMode === 'circle') {
                        if (circleStep === 0) {
                            circleTemp.centerIdx = nearby !== null ? nearby : addPoint(pos.x, pos.y, false);
                            circleStep = 1;
                        } else if (circleStep === 1) {
                            circleTemp.radiusIdx = nearby !== null ? nearby : addPoint(pos.x, pos.y, false);
                            circleStep = 2;
                        } else if (circleStep === 2) {
                            const endIdx = nearby !== null ? nearby : addPoint(pos.x, pos.y, false);
                            finalizeArc(circleTemp.centerIdx, circleTemp.radiusIdx, endIdx);
                            circleStep = 0;
                            circleTemp = {};
                        }
                    } else if (toolMode === 'split') {
                        const seg = findClosestSegment(pos.x, pos.y);
                        if (seg) { splitSegment(seg);
                            showToast('✂️ Segment split');
                            render(); return; }
                        const circ = findClosestCircle(pos.x, pos.y);
                        if (circ) {
                            splitCircleAtPoint(circ.circleIdx, circ.proj, circ.angle);
                            showToast('✂️ Circle split at point');
                            render();
                            return;
                        }
                        showToast('No segment or circle found to split');
                    } else if (toolMode === 'delete') {
                        if (nearby !== null) deletePoint(nearby);
                    }
                    render();
                    updateStatusBar();
                };
                withHistory(action);
            }, { passive: false });

            canvas.addEventListener('touchmove', e => {
                if (e.touches.length !== 1) return;
                const pos = getPos(e.touches[0]);
                mouseCanvasPos = pos;

                if (toolMode === 'move' && isMoving && moveStartPos && moveStartPoints) {
                    e.preventDefault();
                    const dx = pos.x - moveStartPos.x;
                    const dy = pos.y - moveStartPos.y;
                    for (let i = 0; i < points.length; i++) {
                        points[i].x = moveStartPoints[i].x + dx;
                        points[i].y = moveStartPoints[i].y + dy;
                    }
                    render();
                    return;
                }

                if (isDragging && dragTarget !== null) {
                    e.preventDefault();
                    const snapped = snapAll(pos);
                    points[dragTarget].x = snapped.x;
                    points[dragTarget].y = snapped.y;
                    let updatedCircles = new Set();
                    for (let ci = 0; ci < circles.length; ci++) {
                        const c = circles[ci];
                        if (c.centerIdx === dragTarget || c.radiusIdx === dragTarget) {
                            updatedCircles.add(ci);
                        }
                    }
                    for (let ci of updatedCircles) {
                        updateCircleAnchors(ci);
                    }
                    render();
                }
            }, { passive: false });

            canvas.addEventListener('touchend', () => {
                if (toolMode === 'move' && isMoving) {
                    if (moveStartPos && moveStartPoints) {
                        const dx = mouseCanvasPos.x - moveStartPos.x;
                        const dy = mouseCanvasPos.y - moveStartPos.y;
                        if (dx !== 0 || dy !== 0) {
                            pushHistory();
                            showToast('✋ Drawing moved');
                        }
                    }
                    isMoving = false;
                    moveStartPos = null;
                    moveStartPoints = null;
                    render();
                    return;
                }
                isDragging = false;
                dragTarget = null;
                render();
            });

            // ── UI Bindings ──
            function setMode(mode) {
                toolMode = mode;
                if (mode !== 'circle') { circleStep = 0;
                    circleTemp = {}; }
                connectFirst = null;
                dimStep = 0;
                rectCorner = null;
                ngonCenter = null;
                ellipseStep = 0;
                isMoving = false;
                moveStartPos = null;
                moveStartPoints = null;
                document.querySelectorAll('.toolbar .btn.active').forEach(b => b.classList.remove('active'));
                const btn = document.getElementById(`mode${mode.charAt(0).toUpperCase()+mode.slice(1)}`);
                if (btn) btn.classList.add('active');
                render();
                updateStatusBar();
            }

            document.getElementById('modePolygon').onclick = () => setMode('polygon');
            document.getElementById('modeCircle').onclick = () => setMode('circle');
            document.getElementById('modeConnect').onclick = () => setMode('connect');
            document.getElementById('modeSplit').onclick = () => setMode('split');
            document.getElementById('modeDelete').onclick = () => setMode('delete');
            document.getElementById('modeMove').onclick = () => setMode('move');
            document.getElementById('modeRect').onclick = () => setMode('rect');
            document.getElementById('modeNgon').onclick = () => setMode('ngon');
            document.getElementById('modeEllipse').onclick = () => setMode('ellipse');
            document.getElementById('modeDimension').onclick = () => setMode('dimension');
            document.getElementById('modeText').onclick = () => setMode('text');

            document.getElementById('btnClose').onclick = () => {
                const action = () => {
                    if (currentPolyline && currentPolyline.length >= 3) closeCurrentPolyline();
                    else if (toolMode === 'circle' && circleStep === 2) {
                        finalizeFullCircle(circleTemp.centerIdx, circleTemp.radiusIdx);
                        circleStep = 0;
                        circleTemp = {};
                    } else showToast('Nothing to close.');
                    render();
                };
                withHistory(action);
            };

            document.getElementById('btnNew').onclick = () => {
                const action = () => {
                    currentPolyline = null;
                    circleStep = 0;
                    circleTemp = {};
                    connectFirst = null;
                    dimStep = 0;
                    rectCorner = null;
                    ngonCenter = null;
                    ellipseStep = 0;
                    render();
                };
                withHistory(action);
            };

            document.getElementById('btnUndo').onclick = undo;
            document.getElementById('btnRedo').onclick = redo;

            document.getElementById('btnClear').onclick = () => {
                if (points.length && confirm('Clear everything?')) {
                    const action = () => { clearAll();
                        render(); };
                    withHistory(action);
                    showToast('🗑️ Cleared');
                }
            };

            document.getElementById('btnClearHistory').onclick = () => {
                if (confirm('Clear undo/redo history?')) {
                    clearHistory();
                    showToast('🗑️ History cleared');
                }
            };

            document.getElementById('btnSaveJSON').onclick = saveJSON;
            document.getElementById('btnLoadJSON').onclick = () => fileInput.click();
            fileInput.addEventListener('change', e => {
                if (e.target.files.length) {
                    loadJSON(e.target.files[0]);
                    e.target.value = '';
                }
            });

            // Settings
            document.getElementById('btnSettings').onclick = () => settingsPanel.classList.toggle('visible');

            document.getElementById('darkModeToggle').onchange = function() {
                darkMode = this.checked;
                document.body.classList.toggle('dark-mode', darkMode);
                render();
                autoSave();
            };

            document.getElementById('lineColor').onchange = e => { lineColor = e.target.value;
                render();
                autoSave(); };
            document.getElementById('lineWidth').onchange = e => { lineWidthVal = +e.target.value;
                render();
                autoSave(); };
            document.getElementById('lineDash').onchange = e => { lineDash = e.target.value ? e.target.value.split(',').map(
                    Number) : [];
                render();
                autoSave(); };
            document.getElementById('pointStyle').onchange = e => { pointStyle = e.target.value;
                render();
                autoSave(); };
            document.getElementById('pointSize').onchange = e => { pointRadius = +e.target.value;
                render();
                autoSave(); };
            document.getElementById('gridStyle').onchange = e => { gridStyle = e.target.value;
                render();
                autoSave(); };
            document.getElementById('showAlignment').onchange = e => { showAlignmentGuides = e.target.checked;
                render();
                autoSave(); };
            document.getElementById('showPerimArea').onchange = e => { showPerimeterArea = e.target.checked;
                render();
                autoSave(); };
            document.getElementById('showLabels').onchange = e => { showLabels = e.target.checked;
                render();
                autoSave(); };
            document.getElementById('showDistances').onchange = e => { showDistances = e.target.checked;
                render();
                autoSave(); };
            document.getElementById('showAngles').onchange = e => { showAngles = e.target.checked;
                render();
                autoSave(); };

            // Snap toggles
            document.getElementById('snapGrid').onchange = e => { snapGrid = e.target.checked;
                render(); };
            document.getElementById('snapPoint').onchange = e => { snapPoint = e.target.checked;
                render(); };
            document.getElementById('snapLine').onchange = e => { snapLine = e.target.checked;
                render(); };
            document.getElementById('snapMid').onchange = e => { snapMid = e.target.checked;
                render(); };
            document.getElementById('snapInter').onchange = e => { snapInter = e.target.checked;
                render(); };
            document.getElementById('snapTangent').onchange = e => { snapTangent = e.target.checked;
                render(); };
            document.getElementById('snapPerp').onchange = e => { snapPerp = e.target.checked;
                render(); };
            document.getElementById('snapEllipseTang').onchange = e => { snapEllipseTang = e.target.checked;
                render(); };
            document.getElementById('snapParallel').onchange = e => { snapParallel = e.target.checked;
                render(); };
            document.getElementById('snapExtend').onchange = e => { snapExtend = e.target.checked;
                render(); };
            document.getElementById('snapObj').onchange = e => { snapObj = e.target.checked;
                render(); };

            // ── roundRect polyfill ──
            if (!ctx.roundRect) {
                ctx.roundRect = function(x, y, w, h, r) {
                    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                    this.beginPath();
                    this.moveTo(x + r.tl, y);
                    this.lineTo(x + w - r.tr, y);
                    this.quadraticCurveTo(x + w, y, x + w, y + r.tr);
                    this.lineTo(x + w, y + h - r.br);
                    this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
                    this.lineTo(x + r.bl, y + h);
                    this.quadraticCurveTo(x, y + h, x, y + h - r.bl);
                    this.lineTo(x, y + r.tl);
                    this.quadraticCurveTo(x, y, x + r.tl, y);
                    this.closePath();
                };
            }

            // ── Init ──
            function init() {
                resizeCanvas();
                const loaded = loadFromLocalStorage();
                if (!loaded) pushHistory();
                updateUndoButtons();
                render();
                showToast('📐 Geometry Pro ready');
            }

            window.addEventListener('beforeunload', () => saveToLocalStorage());
            init();

            window.__geo = { points, adjacency, polygons, circles, history, undo, redo, saveJSON };

        })();
    </script>
</body>
