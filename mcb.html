<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RCBO – Small Line Art</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            padding: 12px;
        }

        .breaker-wrap {
            width: 100%;
            max-width: 200px;
            /* much smaller container */
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
        }

        .breaker-body {
            fill: #fff;
            stroke: #111;
            stroke-width: 1;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .fill-stroke {
            fill: #fff;
            stroke: #111;
            stroke-width: 1;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .screw-circle {
            fill: #fff;
            stroke: #111;
            stroke-width: 1;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .screw-cross {
            stroke: #111;
            stroke-width: 1;
            stroke-linecap: round;
        }

        .label {
            fill: #8d8a8abe;
            font-size: 12px;
            font-weight: 800;
            text-anchor: middle;
            dominant-baseline: middle;
            letter-spacing: -0.5px;
            user-select: none;
        }


        .label-dark {
            fill: #444;
            font-size: 10px;
            font-weight: 700;
            text-anchor: middle;
            dominant-baseline: middle;
            user-select: none;
        }

        .knob {
            fill: #f0f0f0;
            stroke: #111;
            stroke-width: 1.2;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .knob-indicator {
            stroke: #111;
            stroke-width: 1.5;
            stroke-linecap: round;
        }

        .marker {
            stroke: #555;
            stroke-width: 0.8;
            stroke-linecap: round;
        }

        .marker-label {
            fill: #555;
            font-size: 7px;
            font-weight: 600;
            text-anchor: middle;
            dominant-baseline: middle;
            user-select: none;
        }
    </style>
</head>

    <div class="breaker-wrap">
        <svg viewBox="0 0 180 320" aria-label="Circuit breaker line art">

                <line class="screw-cross" x1="122" y1="184" x2="122" y2="200" />
            </g>

        </svg>
    </div>

    <!-- BATTERY -->
    <div class="breaker-wrap">
        <svg viewBox="0 0 180 320" aria-label="Circuit breaker line art">

            <!-- TOP MOUNTING TAB -->
            <rect class="breaker-body" x="0" y="0" width="128" height="32" rx="5" />

            <!-- TOP SCREW (Phillips cross) -->
            <g>
                <circle class="screw-circle" cx="32" cy="16" r="10" />
                <line class="screw-cross" x1="24" y1="16" x2="40" y2="16" />
                <line class="screw-cross" x1="32" y1="8" x2="32" y2="24" />
            </g>

            <!-- TOP SCREW (Phillips cross) -->
            <g>
                <circle class="screw-circle" cx="96" cy="16" r="10" />
                <line class="screw-cross" x1="88" y1="16" x2="104" y2="16" />
                <line class="screw-cross" x1="96" y1="8" x2="96" y2="24" />
            </g>

            <!-- MAIN BREAKER BODY -->
            <rect class="breaker-body" x="0" y="40" width="128" height="64" rx="5" />
            <text class="label" x="64" y="72">12V BATTERY</text>
        </svg>
    </div>

    <!-- FAN REGULATOR (Single Module) -->
    <div class="breaker-wrap">
        <svg viewBox="0 0 180 320" aria-label="Fan regulator line art">

            <!-- TOP MOUNTING TAB -->
            <rect class="breaker-body" x="0" y="0" width="64" height="32" rx="5" />

            <!-- TOP SCREW (Phillips cross) -->
            <g>
                <circle class="screw-circle" cx="32" cy="16" r="10" />
                <line class="screw-cross" x1="24" y1="16" x2="40" y2="16" />
                <line class="screw-cross" x1="32" y1="8" x2="32" y2="24" />
            </g>

            <!-- MAIN BREAKER BODY -->
            <rect class="breaker-body" x="0" y="40" width="64" height="160" rx="5" />

            <!-- KNOB HOUSING (recessed area) -->
            <circle class="breaker-body" cx="32" cy="120" r="28" />

            <!-- KNOB -->
            <g>
                <circle class="knob" cx="32" cy="120" r="22" />
                <!-- Knob grip lines (subtle) -->
                <circle cx="32" cy="120" r="18" stroke="#ccc" stroke-width="0.5" fill="none" />
                <circle cx="32" cy="120" r="14" stroke="#ddd" stroke-width="0.5" fill="none" />
                <!-- Knob indicator line (pointer) -->
                <line class="knob-indicator" x1="32" y1="120" x2="32" y2="100" />
                <!-- Center dot -->
                <circle cx="32" cy="120" r="3" fill="#111" stroke="none" />
            </g>


            <!-- BOTTOM MOUNTING TAB -->
            <rect class="breaker-body" x="0" y="208" width="64" height="32" rx="5" />

            <!-- BOTTOM SCREW (Phillips cross) -->
            <g>
                <circle class="screw-circle" cx="32" cy="224" r="10" />
                <line class="screw-cross" x1="24" y1="224" x2="40" y2="224" />
                <line class="screw-cross" x1="32" y1="216" x2="32" y2="232" />
            </g>

            <!-- LABEL at bottom -->
            <text class="label" x="32" y="184">FAN REG</text>

        </svg>
    </div>

    <!-- SWITCH (1 Module) -->
    <div class="breaker-wrap">
        <svg viewBox="0 0 180 320" aria-label="Switch line art">

            <!-- TOP MOUNTING TAB -->
            <rect class="breaker-body" x="0" y="0" width="64" height="32" rx="5" />

            <!-- TOP SCREW (Phillips cross) -->
            <g>
                <circle class="screw-circle" cx="32" cy="16" r="10" />
                <line class="screw-cross" x1="24" y1="16" x2="40" y2="16" />
                <line class="screw-cross" x1="32" y1="8" x2="32" y2="24" />
            </g>

            <!-- MAIN BREAKER BODY -->
            <rect class="breaker-body" x="0" y="40" width="64" height="160" rx="5" />

            <!-- LABEL -->
            <text class="label" x="32" y="60">SWITCH</text>

            <!-- TOGGLE (rocker-style) -->
            <g>
                <!-- Main paddle -->
                <rect class="fill-stroke" x="14" y="90" width="36" height="60" rx="3" />
                <line class="screw-cross" x1="14" y1="120" x2="50" y2="120" />
                <line class="screw-cross" x1="14" y1="142" x2="50" y2="142" />
            </g>

            <!-- Pivot pin (decorative) -->
            <circle cx="32" cy="104" r="2.5" fill="#999" stroke="none" />

            <!-- BOTTOM MOUNTING TAB -->
            <rect class="breaker-body" x="0" y="208" width="64" height="32" rx="5" />

            <!-- BOTTOM SCREW (Phillips cross) -->
            <g>
                <circle class="screw-circle" cx="32" cy="224" r="10" />
                <line class="screw-cross" x1="24" y1="224" x2="40" y2="224" />
                <line class="screw-cross" x1="32" y1="216" x2="32" y2="232" />
            </g>

        </svg>
    </div>

    <!-- SWITCH (1 Module) -->
    <div class="breaker-wrap">
        <svg viewBox="0 0 180 320" aria-label="Switch line art">

            <!-- TOP MOUNTING TAB -->
            <rect class="breaker-body" x="0" y="0" width="64" height="32" rx="5" />

            <!-- TOP SCREW (Phillips cross) -->
            <g>
                <circle class="screw-circle" cx="32" cy="16" r="10" />
                <line class="screw-cross" x1="24" y1="16" x2="40" y2="16" />
                <line class="screw-cross" x1="32" y1="8" x2="32" y2="24" />
            </g>

            <!-- TOP MOUNTING TAB -->
            <rect class="breaker-body" x="0" y="104" width="64" height="32" rx="5" />

            <!-- TOP SCREW (Phillips cross) -->
            <g>
                <circle class="screw-circle" cx="32" cy="120" r="10" />
                <line class="screw-cross" x1="24" y1="120" x2="40" y2="120" />
                <line class="screw-cross" x1="32" y1="112" x2="32" y2="128" />
            </g>


            <!-- BOTTOM MOUNTING TAB -->
            <rect class="breaker-body" x="0" y="208" width="64" height="32" rx="5" />

            <!-- BOTTOM SCREW (Phillips cross) -->
            <g>
                <circle class="screw-circle" cx="32" cy="224" r="10" />
                <line class="screw-cross" x1="24" y1="224" x2="40" y2="224" />
                <line class="screw-cross" x1="32" y1="216" x2="32" y2="232" />
            </g>

        </svg>
    </div>

    <!-- ================= LIGHT MODULE (Half Round) ================= -->
    <div class="breaker-wrap">
        <svg viewBox="0 0 180 320" aria-label="Light module">
            <!-- Top Mounting Tab -->
            <rect class="breaker-body" x="0" y="0" width="64" height="32" rx="5" />

            <!-- Top Screws -->
            <g transform="translate(16, 16)">
                <circle class="screw-circle" cx="0" cy="0" r="10" />
                <line class="screw-cross" x1="-6" y1="0" x2="6" y2="0" />
                <line class="screw-cross" x1="0" y1="-6" x2="0" y2="6" />
            </g>
            <g transform="translate(46, 16)">
                <circle class="screw-circle" cx="0" cy="0" r="10" />
                <line class="screw-cross" x1="-6" y1="0" x2="6" y2="0" />
                <line class="screw-cross" x1="0" y1="-6" x2="0" y2="6" />
            </g>

            <!-- 
              HALF-ROUND BODY (EASY TO MODIFY)
              ===============================
              Width  = 128  (change this)
              Radius = 64   (must be Width/2)
              Top Y  = 24   (body starts here)
              Bottom Y = 88 (body ends here)
              To resize, just change the 4 numbers below:
              1. rect width: 128
              2. circle cx: 64   (half of width)
              3. circle r:  64   (half of width)
              4. rect height: 64 (Bottom Y - Top Y)
              5. path d: M 0 88 L 0 24 A 64 64 0 0 1 128 24 L 128 88 Z
               Stroke (outline) 
            <path class="breaker-body" fill="none" d="M 0 88 L 0 24 A 64 64 0 0 1 128 24 L 128 88 Z" />
            -->

            <!-- Light Bulb Icon -->
            <g transform="translate(32, 24)">
                <circle cx="0" cy="56" r="32" fill="#fff" stroke="#111" stroke-width="1.2" />
                <rect x="-16" y="16" width="32" height="12" rx="1" fill="#fff" stroke="#111" stroke-width="1.2" />
            </g>

            <!-- Label -->
            <text class="label" x="32" y="80">LIGHT</text>
        </svg>
    </div>

    <!-- ================= FAN MODULE (Half Round) ================= -->
    <div class="breaker-wrap">
        <svg viewBox="0 0 180 320" aria-label="Fan module">
            <defs>
                <!-- Reusable Fan Blade -->
                <path id="fanBlade" d="M 0,0 C 20,-32 32,-12 12,-4 C 4,-1 0,0 0,0" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round" />
            </defs>

            <!-- Top Mounting Tab -->
            <rect class="breaker-body" x="0" y="0" width="64" height="32" rx="5" />

            <!-- Top Screws -->
            <g transform="translate(16, 16)">
                <circle class="screw-circle" cx="0" cy="0" r="10" />
                <line class="screw-cross" x1="-6" y1="0" x2="6" y2="0" />
                <line class="screw-cross" x1="0" y1="-6" x2="0" y2="6" />
            </g>
            <g transform="translate(46, 16)">
                <circle class="screw-circle" cx="0" cy="0" r="10" />
                <line class="screw-cross" x1="-6" y1="0" x2="6" y2="0" />
                <line class="screw-cross" x1="0" y1="-6" x2="0" y2="6" />
            </g>

            <!-- Fan Icon -->
            <g transform="translate(32, 56)">
                <circle cx="0" cy="0" r="6" fill="#fff" stroke="#111" stroke-width="1.2" />
                <use href="#fanBlade" />
                <use href="#fanBlade" transform="rotate(120)" />
                <use href="#fanBlade" transform="rotate(240)" />
            </g>

            <!-- Label -->
            <text class="label" x="64" y="80">FAN</text>


        </svg>
    </div>

</body>
</html>
