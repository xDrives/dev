                lastTouchPos = { x: sx, y: sy };

                if (!dragState && !moveDragState && !isDrawingWire) {
                    const dx = sx - touchStartX;
                    const dy = sy - touchStartY;
                    if (Math.hypot(dx, dy) > 10) {
                        touchPanActive = true;
                        viewX = touchStartViewX - dx / zoom;
                        viewY = touchStartViewY - dy / zoom;
                        updateComponentTransforms();
                        updateCanvasSize();
                        redraw();
                        updateZoomIndicator();
                    }
                }
                redraw();
                e.preventDefault();
            } else if (e.touches.length === 2) {
                handleTouchMove(e);
                e.preventDefault();
            }
        }, { passive: false });

        canvasWrap.addEventListener('touchend', (e) => {
            if (e.touches.length === 0) {
                if (touchPanActive) {
                    touchPanActive = false;
                }
                touchAlignPoint = null;
                if (moveDragState) endMoveDrag();
                if (dragState) {
                    const node = getNode(dragState.nodeId);
                    if (node) node.el.classList.remove('dragging');
                    dragState = null;
                    updateCanvasSize();
                    redraw();
                }
            }
            if (e.touches.length === 1) {
                touchPanActive = false;
            }
        }, { passive: false });

        canvasWrap.addEventListener('touchcancel', (e) => {
            touchPanActive = false;
            touchAlignPoint = null;
            if (moveDragState) endMoveDrag();
            if (dragState) {
                const node = getNode(dragState.nodeId);
                if (node) node.el.classList.remove('dragging');
                dragState = null;
                updateCanvasSize();
                redraw();
            }
        }, { passive: false });

        // ── Double-click / Double-tap ──

        canvasWrap.addEventListener('dblclick', (e) => {
            if (e.target.closest('.c-node')) return;
            if (isDrawingWire) return;
            const pos = getMousePos(e);
            const wx = screenToWorld(pos.x, pos.y);
            handleDoubleClickWaypoint(wx.x, wx.y);
        });

        let lastTapTime = 0;
        let lastTapPos = null;

        canvasWrap.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                const touch = e.touches[0];
                const rect = canvasWrap.getBoundingClientRect();
                const sx = touch.clientX - rect.left;
                const sy = touch.clientY - rect.top;
                const now = Date.now();
                if (now - lastTapTime < 400 && lastTapPos) {
                    const dx = sx - lastTapPos.x;
                    const dy = sy - lastTapPos.y;
                    if (Math.hypot(dx, dy) < 30) {
                        const wx = screenToWorld(sx, sy);
                        handleDoubleClickWaypoint(wx.x, wx.y);
                        e.preventDefault();
                    }
                }
                lastTapTime = now;
                lastTapPos = { x: sx, y: sy };
            }
        }, { passive: true });

        function handleDoubleClickWaypoint(x, y) {
            const wpHit = hitTestWaypointGlobal(x, y);
            if (wpHit) {
                selectedWireId = wpHit.wireId;
                redraw();
                showToast(`Waypoint ${String.fromCharCode(65 + wpHit.idx)} selected`, 600);
                return;
            }

            for (const node of nodes) {
                for (const [term, termPos] of Object.entries(node.terminals)) {
                    const tp = getTerminalPosition(node, term);
                    if (Math.hypot(x - tp.x, y - tp.y) < WP_HIT) {
                        selectedWireId = null;
                        redraw();
                        showToast('Terminal selected — tap to connect', 600);
                        return;
                    }
                }
            }

            const wireId = hitTestWire(x, y);
            if (wireId === null) {
                showToast('Tap on a wire to add a waypoint', 800);
                return;
            }

            const wire = wires.find(w => w.id === wireId);
            if (!wire) {
                showToast('Wire not found', 800);
                return;
            }

            let pts = getWirePoints(wire);
            if (!pts || pts.length < 2) {
                showToast('Cannot add waypoint to this wire', 1200);
                return;
            }

            let bestSeg = -1,
                bestDist = Infinity;
            for (let i = 0; i < pts.length - 1; i++) {
                const d = distToSegment(x, y, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y);
                if (d < bestDist) { bestDist = d;
                    bestSeg = i; }
            }

            if (bestSeg < 0 || bestSeg >= pts.length - 1) {
                showToast('Could not find a segment to split', 800);
                return;
            }

            const segStart = pts[bestSeg];
            const segEnd = pts[bestSeg + 1];
            const dStart = Math.hypot(x - segStart.x, y - segStart.y);
            const dEnd = Math.hypot(x - segEnd.x, y - segEnd.y);
            if (dStart < 8 || dEnd < 8) {
                showToast('Too close to existing point', 800);
                return;
            }

            const dx = Math.abs(segEnd.x - segStart.x);
            const dy = Math.abs(segEnd.y - segStart.y);
            let snapX = x,
                snapY = y;
            if (dx > dy) {
                snapX = x;
                snapY = segStart.y;
            } else {
                snapX = segStart.x;
                snapY = y;
            }

            const allPoints = getAllSnapPoints(undefined, undefined, undefined);
            for (const p of allPoints) {
                if (Math.hypot(snapX - p.x, snapY - p.y) < 5) {
                    showToast('Waypoint would overlap an existing point', 1200);
                    return;
                }
            }

            let insertIdx;
            if (bestSeg === 0) {
                insertIdx = 0;
            } else if (bestSeg >= pts.length - 1) {
                insertIdx = wire.waypoints.length;
            } else {
                const hasStartTerminal = (wire.fromNodeId !== -1 && getNode(wire.fromNodeId));
                if (hasStartTerminal) {
                    insertIdx = bestSeg;
                } else {
                    insertIdx = bestSeg;
                }
                insertIdx = Math.max(0, Math.min(wire.waypoints.length, insertIdx));
            }

            wire.waypoints.splice(insertIdx, 0, { x: snapX, y: snapY });

            selectedWireId = wire.id;
            redraw();
            showToast('Waypoint added', 800);
        }

        // ── Keyboard ──

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (isDrawingWire) { cancelWire();
                    showToast('Cancelled', 600); }
                if (moveDragState) endMoveDrag();
                if (dragState) dragState = null;
                selectedWireId = null;
                redraw();
            }
            if ((e.key === 'Delete' || e.key === 'Backspace') && currentMode === 'delete') {
                if (selectedWireId !== null) {
                    removeWire(selectedWireId);
                    selectedWireId = null;
                    showToast('Wire deleted');
                }
            }
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  ZOOM CONTROLS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        document.getElementById('zoomIn').addEventListener('click', () => {
            const center = { x: canvasWrap.clientWidth / 2, y: canvasWrap.clientHeight / 2 };
            const worldBefore = screenToWorld(center.x, center.y);
            zoom = Math.min(MAX_ZOOM, zoom * 1.25);
            const worldAfter = screenToWorld(center.x, center.y);
            viewX += worldBefore.x - worldAfter.x;
            viewY += worldBefore.y - worldAfter.y;
            updateComponentTransforms();
            updateCanvasSize();
            redraw();
            updateZoomIndicator();
        });

        document.getElementById('zoomOut').addEventListener('click', () => {
            const center = { x: canvasWrap.clientWidth / 2, y: canvasWrap.clientHeight / 2 };
            const worldBefore = screenToWorld(center.x, center.y);
            zoom = Math.max(MIN_ZOOM, zoom / 1.25);
            const worldAfter = screenToWorld(center.x, center.y);
            viewX += worldBefore.x - worldAfter.x;
            viewY += worldBefore.y - worldAfter.y;
            updateComponentTransforms();
            updateCanvasSize();
            redraw();
            updateZoomIndicator();
        });

        document.getElementById('zoomReset').addEventListener('click', () => {
            zoom = 1.0;
            viewX = 0;
            viewY = 0;
            updateComponentTransforms();
            updateCanvasSize();
            redraw();
            updateZoomIndicator();
        });

        function updateZoomIndicator() {
            document.getElementById('zoomIndicator').textContent = Math.round(zoom * 100) + '%';
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RENDER
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function updateCanvasSize() {
            const rect = canvasWrap.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            wireCanvas.width = w * dpr;
            wireCanvas.height = h * dpr;
            wireCanvas.style.width = w + 'px';
            wireCanvas.style.height = h + 'px';
            wireCanvas._w = w;
            wireCanvas._h = h;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }

        function formatLength(inches) {
            if (inches < 0) return '-' + formatLength(-inches);
            if (inches < 12) return inches.toFixed(1) + '"';
            const feet = Math.floor(inches / 12);
            const rem = inches - feet * 12;
            if (rem < 0.05) return feet + "'";
            return feet + "' " + rem.toFixed(1) + '"';
        }

        function drawRoundedPolyline(ctx, pts, radius, color, width, dash) {
            if (pts.length < 2) return;
            ctx.save();
            if (dash) ctx.setLineDash(dash);
            ctx.strokeStyle = color;
            ctx.lineWidth = width * Math.min(1, zoom);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            const first = { x: (pts[0].x - viewX) * zoom, y: (pts[0].y - viewY) * zoom };
            ctx.moveTo(first.x, first.y);
            for (let i = 1; i < pts.length - 1; i++) {
                const p0 = pts[i - 1],
                    p1 = pts[i],
                    p2 = pts[i + 1];
                const dx1 = p1.x - p0.x,
                    dy1 = p1.y - p0.y;
                const dx2 = p2.x - p1.x,
                    dy2 = p2.y - p1.y;
                const len1 = Math.hypot(dx1, dy1),
                    len2 = Math.hypot(dx2, dy2);
                if (len1 > 1 && len2 > 1) {
                    const angle = Math.atan2(dy2, dx2) - Math.atan2(dy1, dx1);
                    const deg = Math.abs(angle * 180 / Math.PI);
                    if (Math.abs(deg - 90) < 20 || Math.abs(deg - 270) < 20) {
                        const r = Math.min(radius * Math.min(1, zoom), len1 / 2 * zoom, len2 / 2 * zoom);
                        const p1s = { x: (p1.x - viewX) * zoom, y: (p1.y - viewY) * zoom };
                        const p2s = { x: (p2.x - viewX) * zoom, y: (p2.y - viewY) * zoom };
                        ctx.arcTo(p1s.x, p1s.y, p2s.x, p2s.y, r);
                        continue;
                    }
                }
                const ps = { x: (p1.x - viewX) * zoom, y: (p1.y - viewY) * zoom };
                ctx.lineTo(ps.x, ps.y);
            }
            const last = { x: (pts[pts.length - 1].x - viewX) * zoom, y: (pts[pts.length - 1].y - viewY) * zoom };
            ctx.lineTo(last.x, last.y);
            ctx.stroke();
            ctx.restore();
        }

        function redraw() {
            const w = wireCanvas._w || 1200,
                h = wireCanvas._h || 900;
            ctx.clearRect(0, 0, w, h);

            // ── Grid (scaled) ──
            drawZoomedGrid(ctx, w, h);

            // ── Wires ──
            for (const wire of wires) {
                const pts = getWirePoints(wire);
                if (!pts || pts.length < 2) continue;
                const isSelected = (selectedWireId === wire.id);
                const isMoving = (moveDragState && moveDragState.type === 'waypoint' && moveDragState.wireId === wire.id);
                const color = isSelected ? '#2563eb' : (isMoving ? '#4a90d9' : '#1e293b');
                const width = (isSelected || isMoving) ? 3.5 : 2.5;
                drawRoundedPolyline(ctx, pts, ROUND_RADIUS, color, width, null);

                const first = { x: (pts[0].x - viewX) * zoom, y: (pts[0].y - viewY) * zoom };
                const last = { x: (pts[pts.length - 1].x - viewX) * zoom, y: (pts[pts.length - 1].y - viewY) * zoom };
                ctx.fillStyle = color;
                const r = 3 * Math.min(1, zoom);
                ctx.beginPath();
                ctx.arc(first.x, first.y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(last.x, last.y, r, 0, Math.PI * 2);
                ctx.fill();

                if (isSelected) {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(37,99,235,0.08)';
                    ctx.lineWidth = 14 * Math.min(1, zoom);
                    ctx.beginPath();
                    const p0 = { x: (pts[0].x - viewX) * zoom, y: (pts[0].y - viewY) * zoom };
                    ctx.moveTo(p0.x, p0.y);
                    for (let i = 1; i < pts.length; i++) {
                        const pi = { x: (pts[i].x - viewX) * zoom, y: (pts[i].y - viewY) * zoom };
                        ctx.lineTo(pi.x, pi.y);
                    }
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // ── Junctions ──
            for (const j of junctions) {
                const isMoving = (moveDragState && moveDragState.type === 'junction' && moveDragState.junctionId === j.id);
                const sx = (j.x - viewX) * zoom,
                    sy = (j.y - viewY) * zoom;
                const r = (isMoving ? 12 : 10) * Math.min(1, zoom);
                ctx.save();
                ctx.fillStyle = isMoving ? '#4a90d9' : '#e07b4c';
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3 * Math.min(1, zoom);
                ctx.shadowColor = isMoving ? 'rgba(74,144,217,0.5)' : 'rgba(224,123,76,0.4)';
                ctx.shadowBlur = (isMoving ? 20 : 10) * Math.min(1, zoom);
                ctx.beginPath();
                ctx.arc(sx, sy, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.restore();
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${10*Math.min(1, zoom)}px "Segoe UI", Arial, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(isMoving ? '✦' : '⚡', sx, sy + 0.5);
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.font = `${8*Math.min(1, zoom)}px "Segoe UI", Arial, sans-serif`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(`${j.waypoints.length} wires`, sx + 14 * Math.min(1, zoom), sy - 8 * Math.min(1, zoom));
            }

            // ── Waypoints ──
            for (const wire of wires) {
                const isSelected = (selectedWireId === wire.id);
                for (let i = 0; i < wire.waypoints.length; i++) {
                    const wp = wire.waypoints[i];
                    const junction = findJunctionByWaypoint(wire.id, i);
                    if (junction) continue;

                    const isMovingPoint = (moveDragState && moveDragState.type === 'waypoint' &&
                        moveDragState.wireId === wire.id && moveDragState.idx === i);
                    const sx = (wp.x - viewX) * zoom,
                        sy = (wp.y - viewY) * zoom;

                    if (isDrawingWire) {
                        const isStart = (wireStartPoint && wireStartPoint.x === wp.x && wireStartPoint.y === wp.y);
                        const r = (isStart ? 11 : 8) * Math.min(1, zoom);
                        ctx.save();
                        ctx.fillStyle = isStart ? '#16a34a' : '#4a90d9';
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2.5 * Math.min(1, zoom);
                        ctx.shadowColor = isStart ? 'rgba(22,163,74,0.5)' : 'rgba(74,144,217,0.3)';
                        ctx.shadowBlur = (isStart ? 15 : 8) * Math.min(1, zoom);
                        ctx.beginPath();
                        ctx.arc(sx, sy, r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                        ctx.restore();
                        ctx.fillStyle = '#fff';
                        ctx.font = `bold ${9*Math.min(1, zoom)}px "Segoe UI", Arial, sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(isStart ? '★' : String.fromCharCode(65 + i), sx, sy + 0.5);
                        continue;
                    }

                    if (currentMode === 'move') {
                        const isHovered = (moveDragState && moveDragState.type === 'waypoint' &&
                            moveDragState.wireId === wire.id && moveDragState.idx === i);
                        const r = (isHovered ? 11 : 7) * Math.min(1, zoom);
                        ctx.save();
                        ctx.fillStyle = isHovered ? '#4a90d9' : (isSelected ? '#4a90d9' : '#4a90d9');
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2.5 * Math.min(1, zoom);
                        ctx.shadowColor = isHovered ? 'rgba(74,144,217,0.5)' : 'rgba(74,144,217,0.2)';
                        ctx.shadowBlur = (isHovered ? 18 : 6) * Math.min(1, zoom);
                        ctx.beginPath();
                        ctx.arc(sx, sy, r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                        ctx.restore();
                        ctx.fillStyle = '#fff';
                        ctx.font = `bold ${9*Math.min(1, zoom)}px "Segoe UI", Arial, sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(isHovered ? '✦' : String.fromCharCode(65 + i), sx, sy + 0.5);
                        if (isHovered) {
                            ctx.save();
                            ctx.fillStyle = '#4a90d9';
                            ctx.font = `bold ${10*Math.min(1, zoom)}px "Segoe UI", Arial, sans-serif`;
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'bottom';
                            ctx.fillText('drag me', sx, sy - 16 * Math.min(1, zoom));
                            ctx.restore();
                        }
                        continue;
                    }

                    if (isSelected) {
                        const r = (isMovingPoint ? 11 : 7) * Math.min(1, zoom);
                        ctx.save();
                        ctx.fillStyle = isMovingPoint ? '#4a90d9' : '#4a90d9';
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2 * Math.min(1, zoom);
                        ctx.shadowColor = isMovingPoint ? 'rgba(74,144,217,0.5)' : 'rgba(74,144,217,0.2)';
                        ctx.shadowBlur = (isMovingPoint ? 18 : 6) * Math.min(1, zoom);
                        ctx.beginPath();
                        ctx.arc(sx, sy, r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                        ctx.restore();
                        ctx.fillStyle = '#fff';
                        ctx.font = `bold ${10*Math.min(1, zoom)}px "Segoe UI", Arial, sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(isMovingPoint ? '✦' : String.fromCharCode(65 + i), sx, sy + 0.5);
                    }
                }
            }

            // ── Distance labels ──
            const labelZoom = Math.min(1, zoom);
            for (const wire of wires) {
                const pts = getWirePoints(wire);
                if (!pts || pts.length < 2) continue;
                for (let i = 0; i < pts.length - 1; i++) {
                    const p1 = pts[i],
                        p2 = pts[i + 1];
                    const sx = (p1.x + p2.x) / 2,
                        sy = (p1.y + p2.y) / 2;
                    const mx = (sx - viewX) * zoom,
                        my = (sy - viewY) * zoom;
                    const d = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                    if (d > 2 && zoom > 0.3) {
                        const label = formatLength(d);
                        ctx.save();
                        ctx.font = `${10*labelZoom}px "Segoe UI", Arial, sans-serif`;
                        const m = ctx.measureText(label);
                        const pad = 6 * labelZoom,
                            pw = m.width + pad * 2,
                            ph = 18 * labelZoom;
                        ctx.fillStyle = 'rgba(255,255,255,0.9)';
                        ctx.beginPath();
                        ctx.rect(mx - pw / 2, my - ph / 2, pw, ph);
                        ctx.fill();
                        ctx.strokeStyle = '#ccc';
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                        ctx.fillStyle = '#333';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(label, mx, my);
                        ctx.restore();
                    }
                }
            }

            // ── Alignment Guides ──
            let alignSource = null;
            if (window._lastMousePos) {
                alignSource = window._lastMousePos;
            } else if (touchAlignPoint) {
                alignSource = touchAlignPoint;
            }

            if (alignSource && (currentMode === 'wire' || currentMode === 'move' || isDrawingWire || dragState || moveDragState)) {
                const sx = alignSource.x;
                const sy = alignSource.y;
                const excludeNodeId = dragState ? dragState.nodeId : undefined;
                const excludeWireId = moveDragState && moveDragState.type === 'waypoint' ? moveDragState.wireId : undefined;
                const excludeIdx = moveDragState && moveDragState.type === 'waypoint' ? moveDragState.idx : undefined;
                drawAlignmentGuides(ctx, sx, sy, w, h, excludeWireId, excludeIdx, excludeNodeId);
            }

            // ── Drawing preview ──
            if (isDrawingWire && wireStartPoint) {
                let pts = [];
                if (wireStartPoint.type === 'terminal') {
                    const node = getNode(wireStartPoint.nodeId);
                    if (node) pts.push(getTerminalPosition(node, wireStartPoint.term));
                } else if (wireStartPoint.type === 'junction') {
                    pts.push({ x: wireStartPoint.x, y: wireStartPoint.y });
                } else {
                    pts.push({ x: wireStartPoint.x, y: wireStartPoint.y });
                }
                for (const wp of wireWaypoints) pts.push({ x: wp.x, y: wp.y });

                let mouseWorld = null;
                if (window._lastMousePos) {
                    mouseWorld = screenToWorld(window._lastMousePos.x, window._lastMousePos.y);
                } else if (touchAlignPoint) {
                    mouseWorld = screenToWorld(touchAlignPoint.x, touchAlignPoint.y);
                }
                if (mouseWorld) {
                    if (pts.length > 0) {
                        const last = pts[pts.length - 1];
                        const dx = Math.abs(mouseWorld.x - last.x);
                        const dy = Math.abs(mouseWorld.y - last.y);
                        let snapX, snapY;
                        if (dx < dy) { snapX = last.x;
                            snapY = mouseWorld.y; } else { snapX = mouseWorld.x;
                            snapY = last.y; }
                        pts.push({ x: snapX, y: snapY });
                    } else {
                        pts.push({ x: mouseWorld.x, y: mouseWorld.y });
                    }
                }

                if (pts.length > 1) {
                    ctx.save();
                    ctx.setLineDash([6, 4]);
                    ctx.strokeStyle = '#2563eb';
                    ctx.lineWidth = 2.5 * Math.min(1, zoom);
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    const p0 = { x: (pts[0].x - viewX) * zoom, y: (pts[0].y - viewY) * zoom };
                    ctx.moveTo(p0.x, p0.y);
                    for (let i = 1; i < pts.length; i++) {
                        const pi = { x: (pts[i].x - viewX) * zoom, y: (pts[i].y - viewY) * zoom };
                        ctx.lineTo(pi.x, pi.y);
                    }
                    ctx.stroke();
                    ctx.restore();
                }
                for (let i = 0; i < wireWaypoints.length; i++) {
                    const wp = wireWaypoints[i];
                    const sx = (wp.x - viewX) * zoom,
                        sy = (wp.y - viewY) * zoom;
                    const r = 7 * Math.min(1, zoom);
                    ctx.save();
                    ctx.fillStyle = '#4a90d9';
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2 * Math.min(1, zoom);
                    ctx.beginPath();
                    ctx.arc(sx, sy, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                    ctx.fillStyle = '#fff';
                    ctx.font = `bold ${10*Math.min(1, zoom)}px "Segoe UI", Arial, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(wp.letter || String.fromCharCode(65 + i), sx, sy + 0.5);
                }
                if (wireStartPoint) {
                    const sx = (wireStartPoint.x - viewX) * zoom,
                        sy = (wireStartPoint.y - viewY) * zoom;
                    ctx.save();
                    ctx.fillStyle = 'rgba(22,163,74,0.15)';
                    ctx.beginPath();
                    ctx.arc(sx, sy, 18 * Math.min(1, zoom), 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#16a34a';
                    ctx.lineWidth = 2.5 * Math.min(1, zoom);
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath();
                    ctx.arc(sx, sy, 14 * Math.min(1, zoom), 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            updateInfo();
            updateZoomIndicator();
        }

        function drawZoomedGrid(ctx, w, h) {
            const topLeft = screenToWorld(0, 0);
            const bottomRight = screenToWorld(w, h);
            const gridSize = 40 / zoom;

            const xStart = Math.floor(topLeft.x / gridSize) * gridSize;
            const yStart = Math.floor(topLeft.y / gridSize) * gridSize;
            const xEnd = Math.ceil(bottomRight.x / gridSize) * gridSize;
            const yEnd = Math.ceil(bottomRight.y / gridSize) * gridSize;

            const majorGrid = gridSize * 2;
            const minorColor = 'rgba(200,200,200,0.25)';
            const majorColor = 'rgba(180,180,180,0.45)';

            ctx.lineWidth = 0.5;
            for (let x = xStart; x <= xEnd; x += gridSize) {
                if (x % majorGrid === 0) continue;
                const sx = (x - viewX) * zoom;
                if (sx < -10 || sx > w + 10) continue;
                ctx.strokeStyle = minorColor;
                ctx.beginPath();
                ctx.moveTo(sx, 0);
                ctx.lineTo(sx, h);
                ctx.stroke();
            }
            for (let y = yStart; y <= yEnd; y += gridSize) {
                if (y % majorGrid === 0) continue;
                const sy = (y - viewY) * zoom;
                if (sy < -10 || sy > h + 10) continue;
                ctx.strokeStyle = minorColor;
                ctx.beginPath();
                ctx.moveTo(0, sy);
                ctx.lineTo(w, sy);
                ctx.stroke();
            }

            ctx.lineWidth = 1.2;
            for (let x = xStart; x <= xEnd; x += majorGrid) {
                const sx = (x - viewX) * zoom;
                if (sx < -10 || sx > w + 10) continue;
                ctx.strokeStyle = majorColor;
                ctx.beginPath();
                ctx.moveTo(sx, 0);
                ctx.lineTo(sx, h);
                ctx.stroke();
            }
            for (let y = yStart; y <= yEnd; y += majorGrid) {
                const sy = (y - viewY) * zoom;
                if (sy < -10 || sy > h + 10) continue;
                ctx.strokeStyle = majorColor;
                ctx.beginPath();
                ctx.moveTo(0, sy);
                ctx.lineTo(w, sy);
                ctx.stroke();
            }
        }

        // ── Resize handler ──

        function handleResize() {
            updateCanvasSize();
            updateComponentTransforms();
            redraw();
        }

        window.addEventListener('resize', handleResize);
        const ro = new ResizeObserver(() => { handleResize(); });
        ro.observe(canvasWrap);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  INFO
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function updateInfo() {
            let html = '';
            if (currentMode === 'wire') {
                if (isDrawingWire) {
                    html += `<div class="info-title">✏️ Drawing Wire</div>`;
                    html +=
                        `<div class="info-row"><span class="info-label">Points</span><span class="info-value">${wireWaypoints.length}</span></div>`;
                    html +=
                        `<div class="info-row"><span class="info-label">Status</span><span class="info-value">Tap wire or point to finish</span></div>`;
                } else {
                    html += `<div class="info-title">🔗 Wire Mode</div>`;
                    if (selectedWireId !== null) {
                        const wire = wires.find(w => w.id === selectedWireId);
                        if (wire) {
                            html +=
                                `<div class="info-row"><span class="info-label">Selected</span><span class="info-value">${wire.waypoints.length} wp</span></div>`;
                            html +=
                                `<div class="info-row" style="color:#4a90d9;font-size:0.6rem;">Double-tap to add waypoint</div>`;
                        }
                    } else {
                        html +=
                            `<div class="info-row" style="color:#4a90d9;font-size:0.6rem;">Double-tap any wire to add waypoint</div>`;
                    }
                    html +=
                        `<div class="info-row" style="color:#ff8800;font-size:0.6rem;">🟧 Alignment guides active</div>`;
                }
            } else if (currentMode === 'move') {
                html += `<div class="info-title">✋ Move Mode</div>`;
                if (moveDragState) {
                    html +=
                        `<div class="info-row"><span class="info-label">Moving</span><span class="info-value">${moveDragState.type}</span></div>`;
                } else if (dragState) {
                    html += `<div class="info-row"><span class="info-label">Moving</span><span class="info-value">Component</span></div>`;
                } else {
                    html +=
                        `<div class="info-row" style="color:#4a90d9;font-size:0.6rem;">Drag component or waypoint</div>`;
                }
                html +=
                    `<div class="info-row" style="color:#e07b4c;font-size:0.6rem;">⚡ Junction = moves connected</div>`;
                html +=
                    `<div class="info-row" style="color:#ff8800;font-size:0.6rem;">🟧 Alignment guides active</div>`;
            } else if (currentMode === 'delete') {
                html += `<div class="info-title">🗑️ Delete Mode</div>`;
                html += `<div class="info-row"><span class="info-label">Action</span><span class="info-value">Tap to delete</span></div>`;
            }
            html +=
                `<div class="info-row" style="color:#64748b;font-size:0.55rem;border-top:1px solid #ddd;padding-top:3px;margin-top:3px;">Pinch zoom · Two-finger pan</div>`;
            document.getElementById('infoContent').innerHTML = html;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  EXPORT SVG
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function exportSVG() {
            const w = 1200,
                h = 900;
            let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
            <rect width="${w}" height="${h}" fill="#fff"/>
            <style>
              .breaker-body{fill:#fff;stroke:#111;stroke-width:1;stroke-linejoin:round;stroke-linecap:round;}
              .fill-stroke{fill:#fff;stroke:#111;stroke-width:1;stroke-linejoin:round;stroke-linecap:round;}
              .screw-circle{fill:#fff;stroke:#111;stroke-width:1;stroke-linejoin:round;stroke-linecap:round;}
              .screw-cross{stroke:#111;stroke-width:1;stroke-linecap:round;}
              .label{fill:#8d8a8abe;font-size:12px;font-weight:800;text-anchor:middle;dominant-baseline:middle;letter-spacing:-0.5px;user-select:none;}
              .wire{stroke:#1e293b;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
              .junction{fill:#e07b4c;stroke:#fff;stroke-width:2;}
            </style>
            <g id="wires">`;
            for (const wire of wires) {
                const pts = getWirePoints(wire);
                if (!pts || pts.length < 2) continue;
                let d = `M ${pts[0].x} ${pts[0].y}`;
                for (let i = 1; i < pts.length; i++) d += ` L ${pts[i].x} ${pts[i].y}`;
                svg += `<path class="wire" d="${d}"/>`;
            }
            svg += `</g><g id="junctions">`;
            for (const j of junctions) {
                svg += `<circle cx="${j.x}" cy="${j.y}" r="10" class="junction"/>`;
                svg +=
                    `<text x="${j.x}" y="${j.y}" fill="#fff" font-size="9" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">⚡</text>`;
            }
            svg += `</g><g id="components">`;
            for (const node of nodes) {
                const def = COMP_TYPES[node.typeId];
                if (!def) continue;
                svg += `<g transform="translate(${node.x},${node.y})">${def.svg}`;
                for (const [name, pos] of Object.entries(def.terminals)) {
                    svg += `<circle cx="${pos.x}" cy="${pos.y}" r="9" fill="#2563eb" stroke="#fff" stroke-width="2"/>`;
                }
                svg += `</g>`;
            }
            svg += `</g></svg>`;
            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'electrical-diagram.svg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('SVG exported!');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  CLEAR
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function clearAll() {
            if (nodes.length === 0 && wires.length === 0) return;
            if (!confirm('Delete all components and wires?')) return;
            for (const w of [...wires]) removeWire(w.id);
            for (const n of [...nodes]) deleteNode(n.id);
            junctions = [];
            if (isDrawingWire) cancelWire();
            selectedWireId = null;
            moveDragState = null;
            dragState = null;
            updateCanvasSize();
            redraw();
            showToast('Cleared all');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  MODE SWITCHING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function setMode(mode) {
            if (mode === currentMode) return;
            if (isDrawingWire) cancelWire();
            moveDragState = null;
            dragState = null;
            selectedWireId = null;
            currentMode = mode;

            document.getElementById('btnWire').className = mode === 'wire' ? 'active' : '';
            document.getElementById('btnMove').className = mode === 'move' ? 'move-active' : '';
            document.getElementById('btnDelete').className = mode === 'delete' ? 'delete-active' : '';

            const modeNames = {
                'wire': '🔗 Wire Mode — Double-tap wire to add waypoint',
                'move': '✋ Move Mode — Drag components or waypoints',
                'delete': '🗑️ Delete Mode — Tap to delete'
            };
            showToast(modeNames[mode] || '', 2000);
            redraw();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        buildPalette();

        const mcb = addNode('mcb', 80, 120);
        const rccb = addNode('rccb', 260, 120);
        const sw = addNode('switch_mod', 460, 120);
        const light = addNode('light', 600, 120);

        setTimeout(() => {
            const n1 = getNode(mcb.id);
            const n2 = getNode(rccb.id);
            if (n1 && n2) {
                const from = getTerminalPosition(n1, 'bottom');
                const to = getTerminalPosition(n2, 'top');
                const midX = (from.x + to.x) / 2;
                wires.push({
                    id: nextId++,
                    fromNodeId: n1.id,
                    fromTerm: 'bottom',
                    toNodeId: n2.id,
                    toTerm: 'top',
                    waypoints: [{ x: midX, y: from.y + 40 }]
                });
            }
            const n2b = getNode(rccb.id);
            const n3 = getNode(sw.id);
            if (n2b && n3) {
                const from = getTerminalPosition(n2b, 'bottom');
                const to = getTerminalPosition(n3, 'top');
                const midX = (from.x + to.x) / 2;
                wires.push({
                    id: nextId++,
                    fromNodeId: n2b.id,
                    fromTerm: 'bottom',
                    toNodeId: n3.id,
                    toTerm: 'top',
                    waypoints: [{ x: midX, y: from.y + 40 }]
                });
            }
            const n3b = getNode(sw.id);
            const n4 = getNode(light.id);
            if (n3b && n4) {
                const from = getTerminalPosition(n3b, 'bottom');
                const to = getTerminalPosition(n4, 'top');
                const midX = (from.x + to.x) / 2;
                wires.push({
                    id: nextId++,
                    fromNodeId: n3b.id,
                    fromTerm: 'bottom',
                    toNodeId: n4.id,
                    toTerm: 'top',
                    waypoints: [{ x: midX, y: from.y + 40 }]
                });
            }
            detectAndCreateJunctions();
            updateCanvasSize();
            updateComponentTransforms();
            redraw();
        }, 150);

        document.getElementById('btnWire').addEventListener('click', () => setMode('wire'));
        document.getElementById('btnMove').addEventListener('click', () => setMode('move'));
        document.getElementById('btnDelete').addEventListener('click', () => setMode('delete'));

        document.getElementById('btnClear').addEventListener('click', clearAll);
        document.getElementById('btnExport').addEventListener('click', exportSVG);

        document.getElementById('zoomIn').addEventListener('touchstart', (e) => { e.preventDefault();
            document.getElementById('zoomIn').click(); });
        document.getElementById('zoomOut').addEventListener('touchstart', (e) => { e.preventDefault();
            document.getElementById('zoomOut').click(); });
        document.getElementById('zoomReset').addEventListener('touchstart', (e) => { e.preventDefault();
            document.getElementById('zoomReset').click(); });

        setMode('wire');

        setTimeout(() => {
            updateCanvasSize();
            viewX = -100;
            viewY = -50;
            updateComponentTransforms();
            redraw();
            updateZoomIndicator();
        }, 100);

        showToast('🔗 Pinch to zoom · Two-finger pan · Components scale with zoom', 4000);
        console.log('⚡ Zoom fixed: Components now scale and move with zoom/pan');
        console.log('   • Pinch to zoom in/out');
        console.log('   • Two-finger drag to pan');
        console.log('   • Components scale proportionally');
        console.log('   • Alignment guides work at all zoom levels');
    </script>
</body>
</html>
