                        context.fill();
                        context.beginPath();
                        context.arc(cx, cy, radius, startAngle, endAngle);
                        context.strokeStyle = '#8b6fc0';
                        context.lineWidth = 2.8;
                        context.setLineDash([]);
                        context.stroke();
                    }
                    if (radius > 10) {
                        const midRad = startAngle;
                        const badgeX = cx + Math.cos(midRad) * radius * 0.5;
                        const badgeY = cy + Math.sin(midRad) * radius * 0.5;
                        drawBadge(context, badgeX, badgeY, formatLength(r), '#8b6fc0');
                    }
                }
            }

            function drawEllipses(context) {
                for (let e of ellipses) {
                    const c = points[e.centerIdx],
                        rxP = points[e.radXIdx],
                        ryP = points[e.radYIdx];
                    if (!c || !rxP || !ryP) continue;
                    const rx = dist(c, rxP),
                        ry = dist(c, ryP);
                    const angle = Math.atan2(rxP.y - c.y, rxP.x - c.x);
                    const cx = (c.x - viewX) * zoom,
                        cy = (c.y - viewY) * zoom;
                    context.save();
                    context.translate(cx, cy);
                    context.rotate(angle);
                    context.beginPath();
                    context.ellipse(0, 0, rx * zoom, ry * zoom, 0, 0, Math.PI * 2);
                    context.strokeStyle = '#8b6fc0';
                    context.lineWidth = 2.2;
                    context.setLineDash([6, 4]);
                    context.stroke();
                    context.setLineDash([]);
                    context.restore();
                }
            }

            function drawDistanceLabels(context) {
                const drawn = new Set();
                for (let [i, nbrs] of adjacency) {
                    const p1 = points[i];
                    if (!p1) continue;
                    for (let j of nbrs) {
                        const key = i < j ? `${i}-${j}` : `${j}-${i}`;
                        if (drawn.has(key)) continue;
                        drawn.add(key);
                        const p2 = points[j];
                        if (!p2) continue;
                        const mx = ((p1.x + p2.x) / 2 - viewX) * zoom;
                        const my = ((p1.y + p2.y) / 2 - viewY) * zoom;
                        const distVal = dist(p1, p2);
                        drawBadge(context, mx, my, formatLength(distVal), '#5c5c5c');
                    }
                }
            }

            function drawAllAngles(context) {
                for (let [i, nbrs] of adjacency) {
                    const vertex = points[i];
                    if (!vertex) continue;
                    const vx = (vertex.x - viewX) * zoom,
                        vy = (vertex.y - viewY) * zoom;
                    const nbrArr = [...nbrs].filter(j => points[j]);
                    if (nbrArr.length < 2) continue;
                    nbrArr.sort((a, b) => Math.atan2(points[a].y - vertex.y, points[a].x - vertex.x) - Math.atan2(points[b]
                        .y - vertex.y, points[b].x - vertex.x));
                    for (let k = 0; k < nbrArr.length; k++) {
                        const j1 = nbrArr[k],
                            j2 = nbrArr[(k + 1) % nbrArr.length];
                        const p1 = points[j1],
                            p2 = points[j2];
                        const ang = angleBetweenVectors(p1.x - vertex.x, p1.y - vertex.y, p2.x - vertex.x, p2.y - vertex.y);
                        if (!ang || ang * 180 / Math.PI < 1 || ang * 180 / Math.PI > 179) continue;
                        const a1 = Math.atan2(p1.y - vertex.y, p1.x - vertex.x),
                            a2 = Math.atan2(p2.y - vertex.y, p2.x - vertex.x);
                        let mid = a1 + (a2 - a1) / 2;
                        if (Math.abs(a2 - a1) > Math.PI) mid += Math.PI;
                        const radius = (28 + k * 14) * Math.min(zoom, 1.5);
                        context.beginPath();
                        context.arc(vx, vy, radius, a1, a2, a2 < a1);
                        const deg = Math.round(ang * 180 / Math.PI);
                        const color = deg < 90 ? '#5a9e6f' : (deg > 90 ? '#e89440' : '#4a90d9');
                        context.strokeStyle = color;
                        context.lineWidth = 2;
                        context.stroke();
                        const bx = vx + Math.cos(mid) * (radius + 14 * Math.min(zoom, 1.2));
                        const by = vy + Math.sin(mid) * (radius + 14 * Math.min(zoom, 1.2));
                        drawBadge(context, bx, by, deg + '°', color);
                    }
                }
            }

            function drawDimensions(context) {
                for (let d of dimensions) {
                    const p1 = points[d.p1Idx],
                        p2 = points[d.p2Idx];
                    if (!p1 || !p2) continue;
                    const off = d.offsetPoint;
                    const dx = p2.x - p1.x,
                        dy = p2.y - p1.y;
                    const len = Math.hypot(dx, dy);
                    if (len < 0.001) continue;
                    const nx = -dy / len,
                        ny = dx / len;
                    const mx = (p1.x + p2.x) / 2,
                        my = (p1.y + p2.y) / 2;
                    const vec = { x: off.x - mx, y: off.y - my };
                    const sign = (vec.x * nx + vec.y * ny) > 0 ? 1 : -1;
                    const offsetDist = Math.abs(vec.x * nx + vec.y * ny);
                    const ext1 = { x: p1.x + nx * sign * offsetDist, y: p1.y + ny * sign * offsetDist };
                    const ext2 = { x: p2.x + nx * sign * offsetDist, y: p2.y + ny * sign * offsetDist };
                    const ex1x = (ext1.x - viewX) * zoom,
                        ex1y = (ext1.y - viewY) * zoom;
                    const ex2x = (ext2.x - viewX) * zoom,
                        ex2y = (ext2.y - viewY) * zoom;
                    const p1x = (p1.x - viewX) * zoom,
                        p1y = (p1.y - viewY) * zoom;
                    const p2x = (p2.x - viewX) * zoom,
                        p2y = (p2.y - viewY) * zoom;
                    context.beginPath();
                    context.moveTo(p1x, p1y);
                    context.lineTo(ex1x, ex1y);
                    context.strokeStyle = '#666';
                    context.lineWidth = 1;
                    context.setLineDash([5, 4]);
                    context.stroke();
                    context.beginPath();
                    context.moveTo(p2x, p2y);
                    context.lineTo(ex2x, ex2y);
                    context.stroke();
                    context.beginPath();
                    context.moveTo(ex1x, ex1y);
                    context.lineTo(ex2x, ex2y);
                    context.strokeStyle = '#666';
                    context.lineWidth = 1.5;
                    context.setLineDash([6, 4]);
                    context.stroke();
                    context.setLineDash([]);
                    const arrowSize = 8 * Math.min(zoom, 1.5);
                    drawArrowScreen(context, ex2x, ex2y, ex1x, ex1y, arrowSize);
                    drawArrowScreen(context, ex1x, ex1y, ex2x, ex2y, arrowSize);
                    const midx = (ex1x + ex2x) / 2,
                        midy = (ex1y + ex2y) / 2;
                    drawBadge(context, midx, midy, formatLength(len), '#333');
                }
            }

            function drawArrowScreen(context, fromX, fromY, toX, toY, size) {
                const angle = Math.atan2(fromY - toY, fromX - toX);
                const x1 = fromX - Math.cos(angle) * size,
                    y1 = fromY - Math.sin(angle) * size;
                context.beginPath();
                context.moveTo(fromX, fromY);
                context.lineTo(x1 - Math.sin(angle) * size / 2, y1 + Math.cos(angle) * size / 2);
                context.lineTo(x1 + Math.sin(angle) * size / 2, y1 - Math.cos(angle) * size / 2);
                context.closePath();
                context.fillStyle = '#666';
                context.fill();
            }

            function drawAnnotations(context) {
                for (let a of annotations) {
                    const x = (a.x - viewX) * zoom,
                        y = (a.y - viewY) * zoom;
                    if (a.anchorX !== undefined && a.anchorY !== undefined) {
                        const ax = (a.anchorX - viewX) * zoom,
                            ay = (a.anchorY - viewY) * zoom;
                        context.save();
                        context.strokeStyle = '#666';
                        context.lineWidth = 1.4 * Math.min(zoom, 1.5);
                        context.setLineDash([6, 4]);
                        context.beginPath();
                        context.moveTo(ax, ay);
                        const ex = ((a.endX !== undefined ? a.endX : a.x) - viewX) * zoom;
                        const ey = ((a.endY !== undefined ? a.endY : a.y) - viewY) * zoom;
                        context.lineTo(ex, ey);
                        context.stroke();
                        context.setLineDash([]);
                        context.fillStyle = '#666';
                        context.beginPath();
                        context.arc(ax, ay, 3.5 * Math.min(zoom, 1.4), 0, Math.PI * 2);
                        context.fill();
                        context.beginPath();
                        context.arc(ex, ey, 3.5 * Math.min(zoom, 1.4), 0, Math.PI * 2);
                        context.fill();
                        context.restore();
                    }
                    const fontSize = 13 * Math.min(zoom, 1.5);
                    context.font = `italic ${fontSize}px "Inter"`;
                    context.textAlign = 'center';
                    context.textBaseline = 'middle';
                    const metrics = context.measureText(a.text);
                    const padX = 7 * Math.min(zoom, 1.5);
                    const padY = 4 * Math.min(zoom, 1.5);
                    const boxW = metrics.width + padX * 2;
                    const boxH = fontSize + padY * 2;
                    const radius = 4 * Math.min(zoom, 1.5);
                    context.fillStyle = 'rgba(255, 255, 255, 0.94)';
                    context.strokeStyle = '#666';
                    context.lineWidth = 1 * Math.min(zoom, 1.5);
                    context.beginPath();
                    context.roundRect(x - boxW / 2, y - boxH / 2, boxW, boxH, radius);
                    context.fill();
                    context.stroke();
                    context.fillStyle = '#2c2c2c';
                    context.fillText(a.text, x, y);
                    context.textAlign = 'start';
                    context.textBaseline = 'alphabetic';
                }
            }

            function drawTextConnectorPreview(context) {
                if (!textAnchor) return;
                const ax = (textAnchor.x - viewX) * zoom;
                const ay = (textAnchor.y - viewY) * zoom;
                const pos = textPosition || mouseWorldPos;
                const tx = (pos.x - viewX) * zoom;
                const ty = (pos.y - viewY) * zoom;
                context.save();
                context.strokeStyle = '#777';
                context.lineWidth = 1.4 * Math.min(zoom, 1.5);
                context.setLineDash([6, 4]);
                context.beginPath();
                context.moveTo(ax, ay);
                context.lineTo(tx, ty);
                context.stroke();
                context.setLineDash([]);
                context.fillStyle = '#777';
                context.beginPath();
                context.arc(ax, ay, 4 * Math.min(zoom, 1.4), 0, Math.PI * 2);
                context.fill();
                context.beginPath();
                context.arc(tx, ty, 4 * Math.min(zoom, 1.4), 0, Math.PI * 2);
                context.fill();
                const previewText = textStep === 1 ? 'Place text' : 'Enter text';
                const previewSize = 13 * Math.min(zoom, 1.5);
                context.font = `italic ${previewSize}px "Inter"`;
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                const pm = context.measureText(previewText);
                const ppX = 7 * Math.min(zoom, 1.5);
                const ppY = 4 * Math.min(zoom, 1.5);
                const pw = pm.width + ppX * 2,
                    ph = previewSize + ppY * 2;
                context.fillStyle = 'rgba(255,255,255,0.88)';
                context.strokeStyle = '#777';
                context.lineWidth = 1;
                context.beginPath();
                context.roundRect(tx - pw / 2, ty - ph / 2, pw, ph, 4 * Math.min(zoom, 1.5));
                context.fill();
                context.stroke();
                context.fillStyle = '#555';
                context.fillText(previewText, tx, ty);
                context.textAlign = 'start';
                context.textBaseline = 'alphabetic';
                context.restore();
            }

            function drawPerimeterAreaLabels(context) {
                for (let p of polygons) {
                    if (p.indices.length < 3) continue;
                    const perim = polygonPerimeter(p.indices);
                    const area = polygonArea(p.indices);
                    let cx = 0,
                        cy = 0;
                    for (let i of p.indices) { cx += points[i].x;
                        cy += points[i].y; }
                    cx /= p.indices.length;
                    cy /= p.indices.length;
                    const sx = (cx - viewX) * zoom,
                        sy = (cy - viewY) * zoom;
                    const fs = 11 * Math.min(zoom, 1.5);
                    context.font = `bold ${fs}px "Inter"`;
                    context.fillStyle = '#333';
                    context.fillText(`P=${formatLength(perim)}`, sx, sy - fs * 0.8);
                    const sqft = area / (INCHES_PER_FOOT * INCHES_PER_FOOT);
                    const areaStr = sqft >= 1 ? sqft.toFixed(2) + ' ft²' : area.toFixed(1) + ' in²';
                    context.fillText(`A=${areaStr}`, sx, sy + fs * 0.8);
                }
            }

            function drawPoints(context) {
                for (let i = 0; i < points.length; i++) {
                    const p = points[i];
                    const sx = (p.x - viewX) * zoom,
                        sy = (p.y - viewY) * zoom;
                    const isHover = hoveredPoint === i,
                        isDrag = dragTarget === i,
                        isSelected = selectedPoint === i,
                        isJunction = junctionPoints.has(i) && getNeighbors(i).length >= 2;
                    const baseRad = pointRadius * Math.min(zoom, 1.5);
                    const rad = isDrag ? baseRad + 3 : (isHover ? baseRad + 2 : baseRad);
                    if (isJunction) {
                        context.beginPath();
                        context.arc(sx, sy, rad + 5, 0, 2 * Math.PI);
                        context.strokeStyle = '#d97706';
                        context.lineWidth = 2;
                        context.stroke();
                    }
                    if (isDrag || isHover || isSelected) {
                        context.beginPath();
                        context.arc(sx, sy, rad + 6, 0, 2 * Math.PI);
                        context.fillStyle = isDrag ? 'rgba(224,123,76,0.25)' : 'rgba(74,144,217,0.2)';
                        context.fill();
                    }
                    if (pointStyle === 'circle') {
                        context.beginPath();
                        context.arc(sx, sy, rad, 0, 2 * Math.PI);
                        const grad = context.createRadialGradient(sx - 1, sy - 2, rad * 0.2, sx, sy, rad);
                        if (isDrag) { grad.addColorStop(0, '#fff');
                            grad.addColorStop(1, '#e07b4c'); } else if (isSelected) { grad.addColorStop(0, '#fff');
                            grad.addColorStop(1, '#7c3aed'); } else if (isHover) { grad.addColorStop(0, '#fff');
                            grad.addColorStop(1, '#4a90d9'); } else { grad.addColorStop(0, '#fff');
                            grad.addColorStop(1, '#4a4a4a'); }
                        context.fillStyle = grad;
                        context.fill();
                        context.strokeStyle = isDrag ? '#c96a3f' : (isSelected ? '#6d28d9' : (isHover ? '#3a70b0' : '#2a2a2a'));
                        context.lineWidth = 2;
                        context.stroke();
                    } else if (pointStyle === 'square') {
                        context.fillStyle = isDrag ? '#e07b4c' : (isHover ? '#4a90d9' : '#4a4a4a');
                        context.fillRect(sx - rad, sy - rad, rad * 2, rad * 2);
                    } else if (pointStyle === 'cross') {
                        context.strokeStyle = isDrag ? '#e07b4c' : (isHover ? '#4a90d9' : '#4a4a4a');
                        context.lineWidth = 2;
                        context.beginPath();
                        context.moveTo(sx - rad, sy);
                        context.lineTo(sx + rad, sy);
                        context.stroke();
                        context.beginPath();
                        context.moveTo(sx, sy - rad);
                        context.lineTo(sx, sy + rad);
                        context.stroke();
                    }
                    if (showLabels) {
                        const fs = 11 * Math.min(zoom, 1.5);
                        context.font = `bold ${fs}px "Inter"`;
                        context.fillStyle = '#2c2c2c';
                        context.fillText(p.letter, sx + 14 * Math.min(zoom, 1.5), sy - 14 * Math.min(zoom, 1.5));
                    }
                }
            }

            function drawBadge(context, x, y, text, color) {
                const fs = 12 * Math.min(zoom, 1.5);
                context.font = `600 ${fs}px "Inter"`;
                const m = context.measureText(text);
                const pad = 8 * Math.min(zoom, 1.5);
                const pw = m.width + pad * 2;
                const ph = fs + pad;
                context.fillStyle = 'white';
                context.beginPath();
                context.roundRect(x - pw / 2, y - ph / 2, pw, ph, 6 * Math.min(zoom, 1.5));
                context.fill();
                context.strokeStyle = color;
                context.lineWidth = 1.5;
                context.stroke();
                context.fillStyle = color;
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillText(text, x, y);
            }

            function drawCircleRadiusPreview(context) {
                if (circleTemp.centerIdx === undefined) return;
                const center = points[circleTemp.centerIdx];
                if (!center) return;
                const cx = (center.x - viewX) * zoom,
                    cy = (center.y - viewY) * zoom;
                context.beginPath();
                context.moveTo(cx, cy);
                context.lineTo(mouseScreenPos.x, mouseScreenPos.y);
                context.strokeStyle = '#8b6fc0';
                context.lineWidth = 2;
                context.setLineDash([4, 3]);
                context.stroke();
                context.setLineDash([]);
            }

            function drawDimPreview(context) {
                if (dimP1 === null || dimP2 === null) return;
                const p1 = points[dimP1],
                    p2 = points[dimP2];
                if (!p1 || !p2) return;
                const w = canvas.width / (Math.min(window.devicePixelRatio || 1, 2));
                const h = canvas.height / (Math.min(window.devicePixelRatio || 1, 2));
                const off = screenToWorld(mouseScreenPos.x, mouseScreenPos.y);
                const dx = p2.x - p1.x,
                    dy = p2.y - p1.y;
                const len = Math.hypot(dx, dy);
                if (len < 0.001) return;
                const nx = -dy / len,
                    ny = dx / len;
                const mx = (p1.x + p2.x) / 2,
                    my = (p1.y + p2.y) / 2;
                const vec = { x: off.x - mx, y: off.y - my };
                const sign = (vec.x * nx + vec.y * ny) > 0 ? 1 : -1;
                const offsetDist = Math.abs(vec.x * nx + vec.y * ny);
                const ext1 = { x: p1.x + nx * sign * offsetDist, y: p1.y + ny * sign * offsetDist };
                const ext2 = { x: p2.x + nx * sign * offsetDist, y: p2.y + ny * sign * offsetDist };
                const ex1x = (ext1.x - viewX) * zoom,
                    ex1y = (ext1.y - viewY) * zoom;
                const ex2x = (ext2.x - viewX) * zoom,
                    ex2y = (ext2.y - viewY) * zoom;
                const p1x = (p1.x - viewX) * zoom,
                    p1y = (p1.y - viewY) * zoom;
                const p2x = (p2.x - viewX) * zoom,
                    p2y = (p2.y - viewY) * zoom;
                context.beginPath();
                context.moveTo(p1x, p1y);
                context.lineTo(ex1x, ex1y);
                context.strokeStyle = '#aaa';
                context.lineWidth = 1;
                context.setLineDash([3, 3]);
                context.stroke();
                context.setLineDash([]);
                context.beginPath();
                context.moveTo(p2x, p2y);
                context.lineTo(ex2x, ex2y);
                context.stroke();
                context.beginPath();
                context.moveTo(ex1x, ex1y);
                context.lineTo(ex2x, ex2y);
                context.strokeStyle = '#aaa';
                context.lineWidth = 1.5;
                context.stroke();
            }

            function highlightNearestSegment(context) {
                const worldPos = screenToWorld(mouseScreenPos.x, mouseScreenPos.y);
                const seg = findClosestSegment(worldPos.x, worldPos.y);
                if (seg) {
                    const p1 = points[seg.i],
                        p2 = points[seg.j];
                    context.beginPath();
                    context.moveTo((p1.x - viewX) * zoom, (p1.y - viewY) * zoom);
                    context.lineTo((p2.x - viewX) * zoom, (p2.y - viewY) * zoom);
                    context.strokeStyle = '#e07b4c';
                    context.lineWidth = 4;
                    context.stroke();
                    return;
                }
                const circ = findClosestCircle(worldPos.x, worldPos.y);
                if (circ) {
                    const center = points[circ.circle.centerIdx];
                    const radPt = points[circ.circle.radiusIdx];
                    if (center && radPt) {
                        const r = dist(center, radPt);
                        const cx = (center.x - viewX) * zoom,
                            cy = (center.y - viewY) * zoom;
                        context.beginPath();
                        context.arc(cx, cy, r * zoom, 0, 2 * Math.PI);
                        context.strokeStyle = '#e07b4c';
                        context.lineWidth = 4;
                        context.setLineDash([4, 4]);
                        context.stroke();
                        context.setLineDash([]);
                        const px = (circ.proj.x - viewX) * zoom,
                            py = (circ.proj.y - viewY) * zoom;
                        context.beginPath();
                        context.arc(px, py, 5, 0, 2 * Math.PI);
                        context.fillStyle = '#e07b4c';
                        context.fill();
                    }
                }
            }

            function highlightDeleteTarget(context) {
                const worldPos = screenToWorld(mouseScreenPos.x, mouseScreenPos.y);
                const textIndex = findAnnotationAt(worldPos);
                if (textIndex !== null) {
                    const a = annotations[textIndex];
                    const x = (a.x - viewX) * zoom,
                        y = (a.y - viewY) * zoom;
                    context.save();
                    context.beginPath();
                    context.arc(x, y, 18 * Math.min(zoom, 1.4), 0, Math.PI * 2);
                    context.fillStyle = 'rgba(224,123,76,0.25)';
                    context.fill();
                    context.strokeStyle = '#e07b4c';
                    context.lineWidth = 2;
                    context.setLineDash([4, 4]);
                    context.stroke();
                    context.restore();
                    return;
                }
                const dimIndex = findDimensionAt(worldPos);
                if (dimIndex !== null) {
                    const d = dimensions[dimIndex],
                        p1 = points[d.p1Idx],
                        p2 = points[d.p2Idx];
                    if (p1 && p2) {
                        const mx = (p1.x + p2.x) / 2,
                            my = (p1.y + p2.y) / 2;
                        context.save();
                        context.beginPath();
                        context.arc((mx - viewX) * zoom, (my - viewY) * zoom, 16 * Math.min(zoom, 1.4), 0, Math.PI * 2);
                        context.fillStyle = 'rgba(224,123,76,0.25)';
                        context.fill();
                        context.strokeStyle = '#e07b4c';
                        context.lineWidth = 2;
                        context.setLineDash([4, 4]);
                        context.stroke();
                        context.restore();
                        return;
                    }
                }
                const nearby = findNearby(worldPos);
                if (nearby !== null) {
                    const p = points[nearby];
                    const sx = (p.x - viewX) * zoom,
                        sy = (p.y - viewY) * zoom;
                    context.beginPath();
                    context.arc(sx, sy, (pointRadius * Math.min(zoom, 1.5)) + 10, 0, 2 * Math.PI);
                    context.fillStyle = 'rgba(224,123,76,0.3)';
                    context.fill();
                    context.strokeStyle = '#e07b4c';
                    context.lineWidth = 2;
                    context.setLineDash([4, 4]);
                    context.stroke();
                    context.setLineDash([]);
                    return;
                }
                const seg = findClosestSegment(worldPos.x, worldPos.y);
                if (seg) {
                    const p1 = points[seg.i],
                        p2 = points[seg.j];
                    context.beginPath();
                    context.moveTo((p1.x - viewX) * zoom, (p1.y - viewY) * zoom);
                    context.lineTo((p2.x - viewX) * zoom, (p2.y - viewY) * zoom);
                    context.strokeStyle = '#e07b4c';
                    context.lineWidth = 6;
                    context.setLineDash([4, 4]);
                    context.stroke();
                    context.setLineDash([]);
                    return;
                }
                const circ = findClosestCircle(worldPos.x, worldPos.y);
                if (circ) {
                    const center = points[circ.circle.centerIdx];
                    const radPt = points[circ.circle.radiusIdx];
                    if (center && radPt) {
                        const r = dist(center, radPt);
                        const cx = (center.x - viewX) * zoom,
                            cy = (center.y - viewY) * zoom;
                        context.beginPath();
                        context.arc(cx, cy, r * zoom, 0, 2 * Math.PI);
                        context.strokeStyle = '#e07b4c';
                        context.lineWidth = 4;
                        context.setLineDash([4, 4]);
                        context.stroke();
                        context.setLineDash([]);
                    }
                }
                for (let fi = 0; fi < freeformPaths.length; fi++) {
                    const f = freeformPaths[fi];
                    if (f.points.length < 2) continue;
                    for (let i = 0; i < f.points.length - 1; i++) {
                        const p1 = f.points[i],
                            p2 = f.points[i + 1];
                        const res = pointToSegmentDist(worldPos.x, worldPos.y, p1, p2);
                        if (res.dist < 12) {
                            const sx1 = (p1.x - viewX) * zoom,
                                sy1 = (p1.y - viewY) * zoom;
                            const sx2 = (p2.x - viewX) * zoom,
                                sy2 = (p2.y - viewY) * zoom;
                            context.beginPath();
                            context.moveTo(sx1, sy1);
                            context.lineTo(sx2, sy2);
                            context.strokeStyle = '#e07b4c';
                            context.lineWidth = 6;
                            context.setLineDash([4, 4]);
                            context.stroke();
                            context.setLineDash([]);
                            return;
                        }
                    }
                }
            }

            function drawAlignmentGuides(context) {
                if (!showAlignmentGuides) return;
                const mx = mouseWorldPos.x;
                const my = mouseWorldPos.y;
                const tolerance = 5 / Math.max(zoom, 0.2);
                let alignX = null,
                    alignY = null;
                let minDx = Infinity,
                    minDy = Infinity;
                for (let i = 0; i < points.length; i++) {
                    const p = points[i];
                    const dx = Math.abs(p.x - mx);
                    const dy = Math.abs(p.y - my);
                    if (dx <= tolerance && dx < minDx) { minDx = dx;
                        alignX = p.x; }
                    if (dy <= tolerance && dy < minDy) { minDy = dy;
                        alignY = p.y; }
                }
                if (alignX === null && alignY === null) return;
                const canvasW = canvas.width / (window.devicePixelRatio || 1);
                const canvasH = canvas.height / (window.devicePixelRatio || 1);
                context.save();
                context.strokeStyle = '#ff8800';
                context.fillStyle = '#ff8800';
                context.lineWidth = 1;
                context.setLineDash([6, 5]);
                if (alignX !== null) {
                    const sx = (alignX - viewX) * zoom;
                    context.beginPath();
                    context.moveTo(sx, 0);
                    context.lineTo(sx, canvasH);
                    context.stroke();
                }
                if (alignY !== null) {
                    const sy = (alignY - viewY) * zoom;
                    context.beginPath();
                    context.moveTo(0, sy);
                    context.lineTo(canvasW, sy);
                    context.stroke();
                }
                if (alignX !== null && alignY !== null) {
                    const sx = (alignX - viewX) * zoom;
                    const sy = (alignY - viewY) * zoom;
                    context.setLineDash([]);
                    context.beginPath();
                    context.arc(sx, sy, 5, 0, Math.PI * 2);
                    context.stroke();
                }
                context.restore();
            }

            // ── Info ──
            function updateInfoPanel() {
                let html = '';
                if (polygons.length) {
                    const last = polygons[polygons.length - 1];
                    if (last.indices.length > 2) {
                        html += '<div class="info-title"><i class="fas fa-draw-polygon"></i> Polygon</div>';
                        html +=
                            `<div class="info-row"><span class="info-label">Sides</span><span class="info-value">${last.indices.length}</span></div>`;
                        const perim = polygonPerimeter(last.indices);
                        html +=
                            `<div class="info-row"><span class="info-label">Perimeter</span><span class="info-value">${formatLength(perim)}</span></div>`;
                        const area = polygonArea(last.indices);
                        const sqft = area / (INCHES_PER_FOOT * INCHES_PER_FOOT);
                        const areaStr = sqft >= 1 ? sqft.toFixed(2) + ' ft²' : area.toFixed(1) + ' in²';
                        html +=
                            `<div class="info-row"><span class="info-label">Area</span><span class="info-value">${areaStr}</span></div>`;
                    }
                }
                if (circles.length) {
                    const c = circles[circles.length - 1];
                    const center = points[c.centerIdx],
                        radPt = points[c.radiusIdx];
                    if (center && radPt) {
                        const r = dist(center, radPt);
                        html += '<div class="info-title"><i class="fas fa-circle"></i> Circle</div>';
                        html +=
                            `<div class="info-row"><span class="info-label">Radius</span><span class="info-value">${formatLength(r)}</span></div>`;
                        html +=
                            `<div class="info-row"><span class="info-label">Diameter</span><span class="info-value">${formatLength(2*r)}</span></div>`;
                        const circ = 2 * Math.PI * r;
                        html +=
                            `<div class="info-row"><span class="info-label">Circ.</span><span class="info-value">${formatLength(circ)}</span></div>`;
                        const area = Math.PI * r * r;
                        const sqft = area / (INCHES_PER_FOOT * INCHES_PER_FOOT);
                        const areaStr = sqft >= 1 ? sqft.toFixed(2) + ' ft²' : area.toFixed(1) + ' in²';
                        html +=
                            `<div class="info-row"><span class="info-label">Area</span><span class="info-value">${areaStr}</span></div>`;
                        if (c.endAngleIdx !== undefined && points[c.endAngleIdx]) {
                            const endPt = points[c.endAngleIdx];
                            const startAng = Math.atan2(radPt.y - center.y, radPt.x - center.x);
                            const endAng = Math.atan2(endPt.y - center.y, endPt.x - center.x);
                            let delta = endAng - startAng;
                            if (delta < 0) delta += 2 * Math.PI;
                            html +=
                                `<div class="info-row"><span class="info-label">Central ∠</span><span class="info-value">${(delta*180/Math.PI).toFixed(1)}°</span></div>`;
                            const arcLen = r * delta;
                            html +=
                                `<div class="info-row"><span class="info-label">Arc Len</span><span class="info-value">${formatLength(arcLen)}</span></div>`;
                            const chord = Math.sqrt(2 * r * r * (1 - Math.cos(delta)));
                            html +=
                                `<div class="info-row"><span class="info-label">Chord</span><span class="info-value">${formatLength(chord)}</span></div>`;
                            const sector = 0.5 * r * r * delta;
                            const sectorStr = sector / (INCHES_PER_FOOT * INCHES_PER_FOOT) >= 1 ? (sector / (INCHES_PER_FOOT *
                                INCHES_PER_FOOT)).toFixed(2) + ' ft²' : sector.toFixed(1) + ' in²';
                            html +=
                                `<div class="info-row"><span class="info-label">Sector</span><span class="info-value">${sectorStr}</span></div>`;
                        }
                        if (c.anchors && c.anchors.length > 0) {
                            html +=
                                `<div class="info-row"><span class="info-label">Anchors</span><span class="info-value">${c.anchors.length}</span></div>`;
                        }
                    }
                }
                if (freeformPaths.length) {
                    const last = freeformPaths[freeformPaths.length - 1];
                    html += '<div class="info-title"><i class="fas fa-pen-fancy"></i> Freeform</div>';
                    html +=
                        `<div class="info-row"><span class="info-label">Points</span><span class="info-value">${last.points.length}</span></div>`;
                    html +=
                        `<div class="info-row"><span class="info-label">Closed</span><span class="info-value">${last.closed ? 'Yes' : 'No'}</span></div>`;
                }
                if (!html) html = '<span style="color:#94a3b8;">Draw shapes.</span>';
                infoContent.innerHTML = html;
            }

            function updateStatusBar() {
                const histCount = history.length;
                globalStats.innerHTML =
                    `<i class="fas fa-chart-pie"></i> Polygons:${polygons.length} | Circles:${circles.length} | Joints:${[...junctionPoints].filter(i => points[i]).length} | History:${histCount}`;
                let modeText = toolMode;
                if (toolMode === 'circle') {
                    if (circleStep === 0) modeText = 'Circle – Click center';
                    else if (circleStep === 1) modeText = 'Circle – Click radius point';
                } else if (toolMode === 'ngon') modeText = ngonCenter ? 'Click radius' : 'Click center';
                else if (toolMode === 'rect') modeText = rectCorner ? 'Click second corner' : 'Click first corner';
                else if (toolMode === 'ellipse') modeText = ellipseStep === 0 ? 'Click center' : (ellipseStep === 1 ?
                    'Click X radius' : 'Click Y radius');
                else if (toolMode === 'dimension') modeText = dimStep === 0 ? 'Select start point' : (dimStep === 1 ?
                    'Select end point' : 'Place dimension offset');
                else if (toolMode === 'select') modeText = selectedPoint !== null ? `Selected point ${points[selectedPoint]?.letter || ''} – drag to move` : 'Click a point to select and drag';
                else if (toolMode === 'move') modeText = 'Click and drag to move the entire drawing';
                else if (toolMode === 'split') modeText = 'Click on a line or circle circumference to split';
                else if (toolMode === 'delete') modeText = 'Click a point, line, circle, or freeform to delete';
                else if (toolMode === 'text') modeText = textStep === 0 ? 'Select connector point' : (textStep === 1 ? 'Place text' : 'Enter text');
                else if (toolMode === 'freeform') modeText = 'Click and drag to draw freehand (release to finish)';
                if (dragTarget !== null) modeText = 'Dragging point...';
                if (isMoving) modeText = 'Moving drawing...';
                statusText.innerHTML = `<i class="fas fa-info-circle"></i> ${modeText}`;
                document.getElementById('btnUndo').title = historyIndex > 0 ? `Undo (${historyIndex} steps)` : 'Undo';
                document.getElementById('btnRedo').title = historyIndex < history.length - 1 ?
                    `Redo (${history.length - historyIndex - 1} steps)` : 'Redo';
            }

            function polygonArea(indices) {
                if (indices.length < 3) return 0;
                let area = 0;
                for (let i = 0; i < indices.length; i++) {
                    const p1 = points[indices[i]],
                        p2 = points[indices[(i + 1) % indices.length]];
                    area += p1.x * p2.y - p2.x * p1.y;
                }
                return Math.abs(area / 2);
            }

            function polygonPerimeter(indices) {
                let p = 0;
                for (let i = 0; i < indices.length; i++) p += dist(points[indices[i]], points[indices[(i + 1) % indices
                        .length]]);
                return p;
            }

            // ── Toast ──
            let toastTimer = null;

            function showToast(msg) {
                const el = document.getElementById('toast');
                el.textContent = msg;
                el.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
            }

            // ── PDF ──
            function exportPDF() {
                const infoText = infoContent.innerText || 'No shapes';
                const date = new Date().toLocaleString();
                const rect = canvas.parentElement.getBoundingClientRect();
                const w = rect.width;
                const h = rect.height;
                const scale = 2;
                const pdfWidth = w * scale;
                const pdfHeight = h * scale;
                const offscreen = document.createElement('canvas');
                offscreen.width = pdfWidth;
                offscreen.height = pdfHeight;
                const offCtx = offscreen.getContext('2d');
                offCtx.scale(scale, scale);
                renderToContext(offCtx, w, h, true);
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('l', 'pt', 'letter');
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                const margin = 40;
                const maxImgWidth = pageWidth - 2 * margin;
                const maxImgHeight = pageHeight - 2 * margin - 60;
                const imgData = offscreen.toDataURL('image/png');
                const img = new Image();
                img.src = imgData;
                img.onload = function() {
                    const imgAspect = img.width / img.height;
                    let drawWidth = maxImgWidth;
                    let drawHeight = drawWidth / imgAspect;
                    if (drawHeight > maxImgHeight) { drawHeight = maxImgHeight;
                        drawWidth = drawHeight * imgAspect; }
                    const x = (pageWidth - drawWidth) / 2;
                    const y = margin;
                    pdf.addImage(imgData, 'PNG', x, y, drawWidth, drawHeight);
                    const infoY = y + drawHeight + 20;
                    pdf.setFontSize(12);
                    pdf.setTextColor(40);
                    pdf.text('Drawing Info', margin, infoY);
                    pdf.setFontSize(10);
                    pdf.setTextColor(80);
                    const lines = pdf.splitTextToSize(infoText, pageWidth - 2 * margin);
                    pdf.text(lines, margin, infoY + 16);
                    pdf.setFontSize(8);
                    pdf.setTextColor(150);
                    pdf.text('Generated: ' + date, pageWidth - margin, pageHeight - 20, { align: 'right' });
                    pdf.save('geometry_drawing.pdf');
                    showToast('📄 PDF saved');
                };
                img.onerror = function() { showToast('❌ PDF export failed'); };
            }

            // ── JSON ──
            function saveJSON() {
                const state = captureState();
                state._meta = {
                    version: '1.0',
                    darkMode,
                    lineColor,
                    lineWidthVal,
                    lineDash,
                    pointStyle,
                    pointRadius,
                    gridStyle,
                    showLabels,
                    showDistances,
                    showAngles,
                    showAlignmentGuides,
                    showPerimeterArea
                };
                const json = JSON.stringify(state, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const link = document.createElement('a');
                link.download = 'geometry_project.json';
                link.href = URL.createObjectURL(blob);
                link.click();
                URL.revokeObjectURL(link.href);
                showToast('💾 JSON saved');
            }

            function loadJSON(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data.points) { showToast('❌ Invalid file'); return; }
                        restoreState(data);
                        if (data._meta) {
                            const m = data._meta;
                            if (m.darkMode !== undefined) {
                                darkMode = m.darkMode;
                                document.getElementById('darkModeToggle').checked = darkMode;
                            }
                            if (m.lineColor) { lineColor = m.lineColor;
                                document.getElementById('lineColor').value = lineColor; }
                            if (m.lineWidthVal) { lineWidthVal = m.lineWidthVal;
                                document.getElementById('lineWidth').value = lineWidthVal; }
                            if (m.lineDash) { lineDash = m.lineDash;
                                document.getElementById('lineDash').value = lineDash.join(',') || ''; }
                            if (m.pointStyle) { pointStyle = m.pointStyle;
                                document.getElementById('pointStyle').value = pointStyle; }
                            if (m.pointRadius) { pointRadius = m.pointRadius;
                                document.getElementById('pointSize').value = pointRadius; }
                            if (m.gridStyle) { gridStyle = m.gridStyle;
                                document.getElementById('gridStyle').value = gridStyle; }
                            if (m.showLabels !== undefined) { showLabels = m.showLabels;
                                document.getElementById('showLabels').checked = showLabels; }
                            if (m.showDistances !== undefined) { showDistances = m.showDistances;
                                document.getElementById('showDistances').checked = showDistances; }
                            if (m.showAngles !== undefined) { showAngles = m.showAngles;
                                document.getElementById('showAngles').checked = showAngles; }
                            if (m.showAlignmentGuides !== undefined) { showAlignmentGuides = m.showAlignmentGuides;
                                document.getElementById('showAlignment').checked = showAlignmentGuides; }
                            if (m.showPerimeterArea !== undefined) { showPerimeterArea = m.showPerimeterArea;
                                document.getElementById('showPerimArea').checked = showPerimeterArea; }
                        }
                        pushHistory();
                        render();
                        showToast('📂 JSON loaded');
                    } catch (err) {
                        showToast('❌ Error loading file');
                        console.error(err);
                    }
                };
                reader.readAsText(file);
            }

            // ── Auto-save ──
            function saveToLocalStorage() {
                try {
                    const state = captureState();
                    state._meta = {
                        version: '1.0',
                        darkMode,
                        lineColor,
                        lineWidthVal,
                        lineDash,
                        pointStyle,
                        pointRadius,
                        gridStyle,
                        showLabels,
                        showDistances,
                        showAngles,
                        showAlignmentGuides,
                        showPerimeterArea
                    };
                    localStorage.setItem('geometry_pro_state', JSON.stringify(state));
                } catch (e) { /* ignore */ }
            }

            function loadFromLocalStorage() {
                try {
                    const raw = localStorage.getItem('geometry_pro_state');
                    if (!raw) return false;
                    const data = JSON.parse(raw);
                    if (!data.points) return false;
                    restoreState(data);
                    if (data._meta) {
                        const m = data._meta;
                        if (m.darkMode !== undefined) {
                            darkMode = m.darkMode;
                            document.getElementById('darkModeToggle').checked = darkMode;
                        }
                        if (m.lineColor) { lineColor = m.lineColor;
                            document.getElementById('lineColor').value = lineColor; }
                        if (m.lineWidthVal) { lineWidthVal = m.lineWidthVal;
                            document.getElementById('lineWidth').value = lineWidthVal; }
                        if (m.lineDash) { lineDash = m.lineDash;
                            document.getElementById('lineDash').value = lineDash.join(',') || ''; }
                        if (m.pointStyle) { pointStyle = m.pointStyle;
                            document.getElementById('pointStyle').value = pointStyle; }
                        if (m.pointRadius) { pointRadius = m.pointRadius;
                            document.getElementById('pointSize').value = pointRadius; }
                        if (m.gridStyle) { gridStyle = m.gridStyle;
                            document.getElementById('gridStyle').value = gridStyle; }
                        if (m.showLabels !== undefined) { showLabels = m.showLabels;
                            document.getElementById('showLabels').checked = showLabels; }
                        if (m.showDistances !== undefined) { showDistances = m.showDistances;
                            document.getElementById('showDistances').checked = showDistances; }
                        if (m.showAngles !== undefined) { showAngles = m.showAngles;
                            document.getElementById('showAngles').checked = showAngles; }
                        if (m.showAlignmentGuides !== undefined) { showAlignmentGuides = m.showAlignmentGuides;
                            document.getElementById('showAlignment').checked = showAlignmentGuides; }
                        if (m.showPerimeterArea !== undefined) { showPerimeterArea = m.showPerimeterArea;
                            document.getElementById('showPerimArea').checked = showPerimeterArea; }
                    }
                    pushHistory();
                    render();
                    return true;
                } catch (e) { return false; }
            }

            let saveTimer = null;

            function autoSave() {
                clearTimeout(saveTimer);
                saveTimer = setTimeout(() => saveToLocalStorage(), 500);
            }

            const origPushHistory = pushHistory;
            pushHistory = function() {
                origPushHistory();
                autoSave();
            };

            // ── Events ──
            function findNearby(pos, r = HIT_R) {
                for (let i = points.length - 1; i >= 0; i--) {
                    if (dist(pos, points[i]) <= r) return i;
                }
                return null;
            }

            function findAnnotationAt(pos) {
                for (let i = annotations.length - 1; i >= 0; i--) {
                    const a = annotations[i];
                    const fontSize = 13;
                    const approxCharWidth = fontSize * 0.58;
                    const textWidth = Math.max(fontSize * 1.5, String(a.text || '').length * approxCharWidth);
                    const padX = 7,
                        padY = 4;
                    const halfW = textWidth / 2 + padX;
                    const halfH = fontSize / 2 + padY;
                    if (Math.abs(pos.x - a.x) <= halfW / zoom && Math.abs(pos.y - a.y) <= halfH / zoom) {
                        return i;
                    }
                }
                return null;
            }

            function findTextEndpointAt(pos) {
                const hitR = Math.max(HIT_R, 10 / zoom);
                for (let i = annotations.length - 1; i >= 0; i--) {
                    const a = annotations[i];
                    if (a.anchorX === undefined || a.endX === undefined) continue;
                    const start = { x: a.anchorX, y: a.anchorY };
                    const end = { x: a.endX, y: a.endY };
                    if (dist(pos, start) <= hitR) return { index: i, endpoint: 'start' };
                    if (dist(pos, end) <= hitR) return { index: i, endpoint: 'end' };
                }
                return null;
            }

            function editAnnotation(index) {
                if (index === null || !annotations[index]) return false;
                const a = annotations[index];
                const updated = prompt('Edit text:', a.text || '');
                if (updated === null) return false;
                const value = updated.trim();
                if (!value) { showToast('Text cannot be empty'); return false; }
                a.text = value;
                showToast('📝 Text updated');
                return true;
            }

            function finalizeDimension() {
                if (dimP1 !== null && dimP2 !== null) {
                    const worldPos = screenToWorld(mouseScreenPos.x, mouseScreenPos.y);
                    dimensions.push({ p1Idx: dimP1, p2Idx: dimP2, offsetPoint: { ...worldPos } });
                    dimP1 = null;
                    dimP2 = null;
                    dimStep = 0;
                }
            }

            function handlePolygonPoint(worldPos) {
                const nearby = findNearby(worldPos);
                if (!currentPolyline || currentPolyline.length === 0) {
                    if (nearby !== null) {
                        currentPolyline = [nearby];
                        showToast('🔗 Poly started on existing point');
                        return;
                    }
                    addPoint(worldPos.x, worldPos.y, false);
                    return;
                }
                if (nearby !== null && nearby === currentPolyline[0] && currentPolyline.length >= 3) {
                    closeCurrentPolyline();
                    showToast('🔷 Polygon closed');
                    return;
                }
                const lastIdx = currentPolyline[currentPolyline.length - 1];
                if (nearby !== null) {
                    if (nearby === lastIdx) return;
                    addConnection(lastIdx, nearby);
                    junctionPoints.add(lastIdx);
                    junctionPoints.add(nearby);
                    currentPolyline.push(nearby);
                    showToast('🔗 Points joined');
                    return;
                }
                addPoint(worldPos.x, worldPos.y, true);
            }

            function findDimensionAt(pos) {
                const hit = 10;
                for (let i = dimensions.length - 1; i >= 0; i--) {
                    const d = dimensions[i];
                    const p1 = points[d.p1Idx],
                        p2 = points[d.p2Idx];
                    if (!p1 || !p2 || !d.offsetPoint) continue;
                    const dx = p2.x - p1.x,
                        dy = p2.y - p1.y;
                    const len = Math.hypot(dx, dy);
                    if (len < 0.001) continue;
                    const nx = -dy / len,
                        ny = dx / len;
                    const mx = (p1.x + p2.x) / 2,
                        my = (p1.y + p2.y) / 2;
                    const vx = d.offsetPoint.x - mx,
                        vy = d.offsetPoint.y - my;
                    const sign = (vx * nx + vy * ny) > 0 ? 1 : -1;
                    const offsetDist = Math.abs(vx * nx + vy * ny);
                    const ex1 = { x: p1.x + nx * sign * offsetDist, y: p1.y + ny * sign * offsetDist };
                    const ex2 = { x: p2.x + nx * sign * offsetDist, y: p2.y + ny * sign * offsetDist };
                    if (pointToSegmentDist(pos.x, pos.y, ex1, ex2).dist <= hit) return i;
                }
                return null;
            }

            function deleteTarget(worldPos) {
                const annotationIndex = findAnnotationAt(worldPos);
                if (annotationIndex !== null) {
                    annotations.splice(annotationIndex, 1);
                    showToast('🗑️ Text deleted');
                    return true;
                }
                const dimensionIndex = findDimensionAt(worldPos);
                if (dimensionIndex !== null) {
                    dimensions.splice(dimensionIndex, 1);
                    showToast('🗑️ Dimension deleted');
                    return true;
                }
                const pointHit = Math.min(9, Math.max(4, 8 / Math.max(zoom, 0.25)));
                const nearby = findNearby(worldPos, pointHit);
                if (nearby !== null) {
                    deletePoint(nearby);
                    showToast('🗑️ Point deleted');
                    return true;
                }
                const seg = findClosestSegment(worldPos.x, worldPos.y, Math.min(10, Math.max(5, 10 / Math.max(zoom,
                0.25))));
                if (seg) {
                    removeConnection(seg.i, seg.j);
                    showToast('🗑️ Line deleted');
                    return true;
                }
                const circ = findClosestCircle(worldPos.x, worldPos.y);
                if (circ) {
                    circles.splice(circ.circleIdx, 1);
                    showToast('🗑️ Circle deleted');
                    return true;
                }
                for (let fi = 0; fi < freeformPaths.length; fi++) {
                    const f = freeformPaths[fi];
                    if (f.points.length < 2) continue;
                    for (let i = 0; i < f.points.length - 1; i++) {
                        const p1 = f.points[i],
                            p2 = f.points[i + 1];
                        const res = pointToSegmentDist(worldPos.x, worldPos.y, p1, p2);
                        if (res.dist < Math.min(10, Math.max(5, 10 / Math.max(zoom, 0.25)))) {
                            freeformPaths.splice(fi, 1);
                            showToast('🗑️ Freeform deleted');
                            return true;
                        }
                    }
                }
                showToast('Nothing to delete');
                return false;
            }

            // ── MOUSE ──
            canvas.addEventListener('mousedown', e => {
                if (e.button === 1) {
                    e.preventDefault();
                    isPanning = true;
                    panStartX = e.clientX;
                    panStartY = e.clientY;
                    panStartViewX = viewX;
                    panStartViewY = viewY;
                    canvas.style.cursor = 'grab';
                    return;
                }
                if (e.button !== 0) return;
                const pos = getPos(e);
                mouseScreenPos = pos;
                const worldPos = screenToWorld(pos.x, pos.y);

                if (toolMode === 'select') {
                    const endpoint = findTextEndpointAt(worldPos);
                    if (endpoint) {
                        const a = annotations[endpoint.index];
                        textDrag = { index: endpoint.index, endpoint: endpoint.endpoint, startX: endpoint.endpoint ===
                                'start' ? a.anchorX : a.endX, startY: endpoint.endpoint === 'start' ? a.anchorY :
                                a.endY };
                        hoveredTextEndpoint = endpoint;
                        isDragging = true;
                        canvas.style.cursor = 'grabbing';
                        render();
                        updateStatusBar();
                        return;
                    }
                }

                const annotationIndex = (toolMode === 'text') ? findAnnotationAt(worldPos) : null;
                if (annotationIndex !== null) {
                    const action = () => editAnnotation(annotationIndex);
                    withHistory(action);
                    render();
                    updateStatusBar();
                    return;
                }

                if (toolMode === 'move') {
                    moveStartPos = { x: pos.x, y: pos.y };
                    moveStartPoints = points.map(p => ({ ...p }));
                    isMoving = true;
                    render();
                    return;
                }

                if (toolMode === 'select') {
                    const nearby = findNearby(worldPos);
                    selectedPoint = nearby;
                    if (nearby !== null) {
                        dragTarget = nearby;
                        dragStartX = points[nearby].x;
                        dragStartY = points[nearby].y;
                        isDragging = true;
                        canvas.style.cursor = 'grabbing';
                        showToast(`↖️ Selected point ${points[nearby].letter}`);
                    } else {
                        dragTarget = null;
                        isDragging = false;
                        canvas.style.cursor = 'crosshair';
                    }
                    render();
                    updateStatusBar();
                    return;
                }

                if (toolMode === 'freeform') {
                    if (!currentFreeform) {
                        currentFreeform = { points: [{ ...worldPos }], closed: false };
                    } else {
                        currentFreeform.points.push({ ...worldPos });
                    }
                    render();
                    return;
                }

                if (toolMode === 'polygon') {
                    const action = () => handlePolygonPoint(worldPos);
                    withHistory(action);
                    return;
                }

                if (toolMode === 'delete') {
                    const action = () => { deleteTarget(worldPos);
                        render();
                        updateStatusBar(); };
                    withHistory(action);
                    return;
                }

                if (toolMode === 'dimension') {
                    const action = () => {
                        if (dimStep === 0) {
                            const nearby = findNearby(worldPos);
                            if (nearby !== null) { dimP1 = nearby;
                                dimStep = 1;
                                showToast('📐 First point selected'); } else { showToast(
                                    'Click on a point to start dimension'); }
                        } else if (dimStep === 1) {
                            const nearby = findNearby(worldPos);
                            if (nearby !== null && nearby !== dimP1) { dimP2 = nearby;
                                dimStep = 2;
                                showToast('📐 Second point selected, now place offset'); } else { showToast(
                                    'Select a different point'); }
                        } else if (dimStep === 2) {
                            finalizeDimension();
                            showToast('📐 Dimension placed');
                        }
                        render();
                        updateStatusBar();
                    };
                    withHistory(action);
                    return;
                }

                if (toolMode === 'split') {
                    const action = () => {

                    const t1 = e.touches[0],
                        t2 = e.touches[1];
                    const dist2 = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                    const scale = dist2 / lastTouchDist;
                    const newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * scale));
                    if (newZoom !== zoom) {
                        const cx = canvas._zoomCenterScreen.x;
                        const cy = canvas._zoomCenterScreen.y;
                        const worldBefore = screenToWorld(cx, cy);
                        zoom = newZoom;
                        const worldAfter = screenToWorld(cx, cy);
                        viewX += worldBefore.x - worldAfter.x;
                        viewY += worldBefore.y - worldAfter.y;
                        updateZoomIndicator();
                        render();
                    }
                    lastTouchDist = dist2;
                }
            }, { passive: false });

            canvas.addEventListener('touchend', e => {
                if (toolMode === 'freeform' && currentFreeform && currentFreeform.points.length > 1) {
                    const action = () => {
                        const closed = currentFreeform.points.length > 2 && dist(currentFreeform.points[0],
                            currentFreeform.points[currentFreeform.points.length - 1]) < 8 / zoom;
                        if (closed && currentFreeform.points.length > 2) {
                            const f = { points: currentFreeform.points.map(p => ({ ...p })), closed: true };
                            freeformPaths.push(f);
                            showToast('✏️ Freeform shape (closed)');
                        } else {
                            const f = { points: currentFreeform.points.map(p => ({ ...p })), closed: false };
                            freeformPaths.push(f);
                            showToast('✏️ Freeform path');
                        }
                        currentFreeform = null;
                        render();
                        updateStatusBar();
                    };
                    withHistory(action);
                    return;
                }
                if (toolMode === 'freeform' && currentFreeform) { currentFreeform = null;
                    render(); }
                if (toolMode === 'select' && isDragging && textDrag) {
                    const a = annotations[textDrag.index];
                    if (a) {
                        const x = textDrag.endpoint === 'start' ? a.anchorX : a.endX;
                        const y = textDrag.endpoint === 'start' ? a.anchorY : a.endY;
                        if (Math.abs(x - textDrag.startX) > 0.001 || Math.abs(y - textDrag.startY) > 0.001) pushHistory();
                    }
                    isDragging = false;
                    textDrag = null;
                    hoveredTextEndpoint = null;
                    canvas.style.cursor = 'crosshair';
                    render();
                    updateStatusBar();
                    return;
                }
                if (toolMode === 'select' && isDragging && dragTarget !== null) {
                    const moved = Math.abs(points[dragTarget].x - dragStartX) > 0.001 || Math.abs(points[dragTarget].y -
                        dragStartY) > 0.001;
                    if (moved) pushHistory();
                }
                isDragging = false;
                dragTarget = null;
                dragStartX = dragStartY = null;
                render();
                updateStatusBar();
            }, { passive: true });

            // ── UI ──
            function setMode(mode) {
                toolMode = mode;
                selectedPoint = null;
                dragTarget = null;
                isDragging = false;
                textDrag = null;
                hoveredTextEndpoint = null;
                if (mode !== 'circle') { circleStep = 0;
                    circleTemp = {}; }
                if (mode !== 'freeform') {
                    if (currentFreeform && currentFreeform.points.length > 1) {
                        const f = { points: currentFreeform.points.map(p => ({ ...p })), closed: false };
                        freeformPaths.push(f);
                        showToast('✏️ Freeform path');
                    }
                    currentFreeform = null;
                }
                dimStep = 0;
                dimP1 = null;
                dimP2 = null;
                textStep = 0;
                textAnchor = null;
                textPosition = null;
                rectCorner = null;
                ngonCenter = null;
                ellipseStep = 0;
                isMoving = false;
                moveStartPos = null;
                moveStartPoints = null;
                document.querySelectorAll('.toolbar .btn.active').forEach(b => b.classList.remove('active'));
                const modeMap = {
                    select: 'modeSelect',
                    polygon: 'modePolygon',
                    circle: 'modeCircle',
                    split: 'modeSplit',
                    delete: 'modeDelete',
                    move: 'modeMove',
                    rect: 'modeRect',
                    ngon: 'modeNgon',
                    ellipse: 'modeEllipse',
                    dimension: 'modeDimension',
                    text: 'modeText',
                    freeform: 'modeFreeform'
                };
                const btn = document.getElementById(modeMap[mode]);
                if (btn) btn.classList.add('active');
                render();
                updateStatusBar();
            }

            document.getElementById('modeSelect').onclick = () => setMode('select');
            document.getElementById('modePolygon').onclick = () => setMode('polygon');
            document.getElementById('modeCircle').onclick = () => setMode('circle');
            document.getElementById('modeSplit').onclick = () => setMode('split');
            document.getElementById('modeDelete').onclick = () => setMode('delete');
            document.getElementById('modeMove').onclick = () => setMode('move');
            document.getElementById('modeDimension').onclick = () => setMode('dimension');
            document.getElementById('modeText').onclick = () => setMode('text');

            document.getElementById('btnUndo').onclick = undo;
            document.getElementById('btnRedo').onclick = redo;

            document.getElementById('btnClear').onclick = () => {
                if (points.length && confirm('Clear everything?')) {
                    const action = () => { clearAll();
                        render(); };
                    withHistory(action);
                    showToast('🗑️ Cleared');
                }
            };

            function resetSettings() {
                lineColor = '#3a3a3a';
                lineWidthVal = 2.2;
                lineDash = [];
                pointStyle = 'circle';
                pointRadius = 7;
                gridStyle = 'lines';
                gridMinorWidth = 0.5;
                gridMediumWidth = 0.8;
                gridMajorWidth = 1.5;
                darkMode = false;
                showAlignmentGuides = true;
                showPerimeterArea = false;
                showLabels = true;
                showDistances = true;
                showAngles = true;
                snapGrid = false;
                snapLine = false;

                document.getElementById('lineColor').value = lineColor;
                document.getElementById('lineWidth').value = lineWidthVal;
                document.getElementById('lineDash').value = '';
                document.getElementById('pointStyle').value = pointStyle;
                document.getElementById('pointSize').value = pointRadius;
                document.getElementById('gridStyle').value = gridStyle;
                document.getElementById('gridMinorWidth').value = gridMinorWidth;
                document.getElementById('gridMediumWidth').value = gridMediumWidth;
                document.getElementById('gridMajorWidth').value = gridMajorWidth;
                document.getElementById('darkModeToggle').checked = false;
                document.getElementById('showAlignment').checked = true;
                document.getElementById('showPerimArea').checked = false;
                document.getElementById('showLabels').checked = true;
                document.getElementById('showDistances').checked = true;
                document.getElementById('showAngles').checked = true;
                document.getElementById('snapGrid').checked = false;
                document.getElementById('snapLine').checked = false;

                updateZoomIndicator();
                render();
                updateStatusBar();
                showToast('↻ Settings reset');
            }

            document.getElementById('btnResetSettings').onclick = resetSettings;
            document.getElementById('btnClearHistory').onclick = () => {
                if (confirm('Clear undo/redo history?')) { clearHistory();
                    showToast('🗑️ History cleared'); }
            };

            document.getElementById('btnSaveJSON').onclick = saveJSON;
            document.getElementById('btnLoadJSON').onclick = () => fileInput.click();
            document.getElementById('btnPDF').onclick = exportPDF;
            fileInput.addEventListener('change', e => {
                if (e.target.files.length) { loadJSON(e.target.files[0]);
                    e.target.value = ''; }
            });

            document.getElementById('btnSettings').onclick = () => settingsPanel.classList.toggle('visible');

            document.getElementById('darkModeToggle').onchange = function() {
                darkMode = this.checked;
                // Dark mode only affects the UI chrome; canvas stays light.
                document.querySelector('.app-container').style.background = darkMode ? '#0f172a' : '#1e293b';
                document.querySelector('.app-header').style.background = darkMode ? '#0a0f1a' : '#0f172a';
                document.querySelector('.status-bar').style.background = darkMode ? '#0a0f1a' : '#0f172a';
                document.querySelector('.status-bar').style.borderTopColor = darkMode ? '#1e293b' : '#334155';
                document.querySelector('.app-header').style.borderBottomColor = darkMode ? '#1e293b' : '#334155';
                document.querySelector('.canvas-wrapper').style.borderBottomColor = darkMode ? '#1e293b' : '#334155';
                autoSave();
            };
            // Initialize dark mode state from toggle
            document.getElementById('darkModeToggle').dispatchEvent(new Event('change'));

            document.getElementById('lineColor').onchange = e => { lineColor = e.target.value;
                render();
                autoSave(); };
            document.getElementById('lineWidth').onchange = e => { lineWidthVal = +e.target.value;
                render();
                autoSave(); };
            document.getElementById('lineDash').onchange = e => { lineDash = e.target.value ? e.target.value.split(',').map(
                    Number) : [];
                render();
                autoSave(); };
            document.getElementById('pointStyle').onchange = e => { pointStyle = e.target.value;
                render();
                autoSave(); };
            document.getElementById('pointSize').onchange = e => { pointRadius = +e.target.value;
                render();
                autoSave(); };
            document.getElementById('gridStyle').onchange = e => { gridStyle = e.target.value;
                render();
                autoSave(); };
            document.getElementById('gridMinorWidth').onchange = e => { gridMinorWidth = +e.target.value;
                render();
                autoSave(); };
            document.getElementById('gridMediumWidth').onchange = e => { gridMediumWidth = +e.target.value;
                render();
                autoSave(); };
            document.getElementById('gridMajorWidth').onchange = e => { gridMajorWidth = +e.target.value;
                render();
                autoSave(); };
            document.getElementById('showAlignment').onchange = e => { showAlignmentGuides = e.target.checked;
                render();
                autoSave(); };
            document.getElementById('showPerimArea').onchange = e => { showPerimeterArea = e.target.checked;
                render();
                autoSave(); };
            document.getElementById('showLabels').onchange = e => { showLabels = e.target.checked;
                render();
                autoSave(); };
            document.getElementById('showDistances').onchange = e => { showDistances = e.target.checked;
                render();
                autoSave(); };
            document.getElementById('showAngles').onchange = e => { showAngles = e.target.checked;
                render();
                autoSave(); };
            document.getElementById('snapGrid').onchange = e => { snapGrid = e.target.checked;
                render(); };
            document.getElementById('snapLine').onchange = e => { snapLine = e.target.checked;
                render(); };

            // ── roundRect ──
            if (!ctx.roundRect) {
                ctx.roundRect = function(x, y, w, h, r) {
                    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                    this.beginPath();
                    this.moveTo(x + r.tl, y);
                    this.lineTo(x + w - r.tr, y);
                    this.quadraticCurveTo(x + w, y, x + w, y + r.tr);
                    this.lineTo(x + w, y + h - r.br);
                    this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
                    this.lineTo(x + r.bl, y + h);
                    this.quadraticCurveTo(x, y + h, x, y + h - r.bl);
                    this.lineTo(x, y + r.tl);
                    this.quadraticCurveTo(x, y, x + r.tl, y);
                    this.closePath();
                };
            }

            // ── Init ──
            function init() {
                resizeCanvas();
                const loaded = loadFromLocalStorage();
                if (!loaded) pushHistory();
                updateUndoButtons();
                updateZoomIndicator();
                render();
                showToast('📐 Geometry Pro · Units: inches');
                const rect = canvas.parentElement.getBoundingClientRect();
                viewX = -rect.width / (2 * zoom);
                viewY = -rect.height / (2 * zoom);
                render();
            }

            window.addEventListener('beforeunload', () => saveToLocalStorage());
            init();

            window.__geo = { points, adjacency, polygons, circles, history, undo, redo, saveJSON, viewX, viewY, zoom };
        })();
    </script>
</body>
