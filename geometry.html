<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Geometry Pro – Imperial Units</title>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            user-select: none;
            transition: background 0.3s;
        }

        /* ── Main Container ── */
        .app-container {
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
            width: 100%;
            max-width: 1500px;
            max-height: 98vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s;
        }

        /* ── Header (dark) ── */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .app-title {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f1f5f9;
            letter-spacing: -0.01em;
        }
        .app-title i {
            color: #f59e0b;
            font-size: 1.2rem;
        }
        .app-title span {
            background: linear-gradient(135deg, #f59e0b, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .toolbar {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* ── Buttons ── */
        .btn {
            padding: 6px 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #1e293b;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            color: #e2e8f0;
            transition: all 0.15s ease;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            line-height: 1.4;
            min-height: 32px;
        }
        .btn i {
            font-size: 0.85rem;
            color: #94a3b8;
            transition: color 0.15s;
        }
        .btn:hover {
            background: #334155;
            border-color: #475569;
            color: #f8fafc;
        }
        .btn:hover i {
            color: #e2e8f0;
        }
        .btn.active {
            background: #2d3748;
            border-color: #f59e0b;
            color: #fbbf24;
            box-shadow: 0 0 0 1px #f59e0b44;
        }
        .btn.active i {
            color: #fbbf24;
        }
        .btn.danger {
            border-color: #7f1d1d;
            color: #fca5a5;
        }
        .btn.danger i {
            color: #ef4444;
        }
        .btn.danger:hover {
            background: #7f1d1d;
            border-color: #991b1b;
            color: #fecaca;
        }
        .btn.success {
            border-color: #065f46;
            color: #6ee7b7;
        }
        .btn.success i {
            color: #34d399;
        }
        .btn.success:hover {
            background: #065f46;
            border-color: #047857;
            color: #a7f3d0;
        }
        .btn.violet {
            border-color: #4c1d95;
            color: #c4b5fd;
        }
        .btn.violet i {
            color: #8b5cf6;
        }
        .btn.violet:hover {
            background: #4c1d95;
            border-color: #6d28d9;
            color: #ddd6fe;
        }
        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }

        .separator {
            width: 1px;
            height: 26px;
            background: #334155;
            margin: 0 4px;
            flex-shrink: 0;
        }

        /* ── Snap Panel ── */
        .snap-panel {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
            margin-left: 2px;
        }
        .snap-panel .toggle-label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.65rem;
            cursor: pointer;
            color: #94a3b8;
            white-space: nowrap;
        }
        .snap-panel .toggle-label input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: #f59e0b;
            cursor: pointer;
            filter: brightness(0.9);
        }

        .export-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* ── Canvas Wrapper (light workspace) ── */
        .canvas-wrapper {
            position: relative;
            flex: 1;
            min-height: 460px;
            background: #f1f5f9;
            border-bottom: 1px solid #334155;
            cursor: crosshair;
            overflow: hidden;
            transition: background 0.3s;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            background: transparent;
        }

        /* ── Info Panel (dark) ── */
        .info-panel {
            position: absolute;
            right: 16px;
            top: 16px;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 12px 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            font-size: 0.72rem;
            max-width: 220px;
            border: 1px solid #334155;
            z-index: 10;
            pointer-events: none;
            color: #e2e8f0;
        }
        .info-title {
            font-weight: 700;
            font-size: 0.8rem;
            margin-bottom: 4px;
            color: #fbbf24;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
            gap: 10px;
        }
        .info-label {
            color: #94a3b8;
        }
        .info-value {
            font-weight: 600;
            color: #f1f5f9;
        }

        /* ── Status Bar (dark) ── */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 6px 18px;
            font-size: 0.7rem;
            color: #94a3b8;
            background: #0f172a;
            border-top: 1px solid #334155;
            flex-wrap: wrap;
            gap: 4px;
            flex-shrink: 0;
        }
        .status-bar #statusText {
            color: #cbd5e1;
        }
        .status-bar #globalStats {
            color: #64748b;
        }

        /* ── Settings Panel (dark) ── */
        .settings-panel {
            position: absolute;
            left: 16px;
            bottom: 40px;
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(14px);
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            font-size: 0.7rem;
            border: 1px solid #334155;
            display: none;
            z-index: 20;
            flex-direction: column;
            gap: 6px;
            min-width: 200px;
            pointer-events: auto;
            color: #e2e8f0;
        }
        .settings-panel.visible {
            display: flex;
        }
        .settings-panel input[type="color"] {
            width: 26px;
            height: 26px;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 0;
            background: transparent;
            cursor: pointer;
        }
        .settings-panel select,
        .settings-panel input[type="number"] {
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 3px 6px;
            font-size: 0.65rem;
            outline: none;
        }
        .settings-panel select:focus,
        .settings-panel input[type="number"]:focus {
            border-color: #f59e0b;
        }
        .settings-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .settings-row label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            color: #cbd5e1;
            font-size: 0.7rem;
        }
        .settings-row input[type="checkbox"] {
            accent-color: #f59e0b;
            cursor: pointer;
            width: 15px;
            height: 15px;
            filter: brightness(0.9);
        }
        .settings-row .btn {
            font-size: 0.65rem;
            padding: 4px 10px;
            min-height: 28px;
        }
        .settings-row .btn.danger {
            border-color: #7f1d1d;
            color: #fca5a5;
        }
        .settings-row .btn.danger i {
            color: #ef4444;
        }
        .settings-row .btn.danger:hover {
            background: #7f1d1d;
        }
        .settings-row .btn {
            background: #1e293b;
            border-color: #334155;
            color: #e2e8f0;
        }
        .settings-row .btn:hover {
            background: #334155;
        }

        .settings-hint {
            font-size: 0.6rem;
            color: #64748b;
            border-top: 1px solid #334155;
            padding-top: 6px;
            margin-top: 4px;
            line-height: 1.4;
        }

        /* ── Zoom Controls (dark) ── */
        .zoom-controls {
            position: absolute;
            right: 16px;
            bottom: 16px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .zoom-controls button {
            width: 38px;
            height: 38px;
            font-size: 18px;
            border: 1px solid #475569;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }
        .zoom-controls button:hover {
            background: #334155;
            border-color: #f59e0b;
            color: #fbbf24;
        }
        .zoom-controls button:active {
            transform: scale(0.94);
        }

        .zoom-indicator {
            position: absolute;
            left: 16px;
            top: 16px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            color: #e2e8f0;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
            pointer-events: none;
            z-index: 5;
            border: 1px solid #334155;
        }
        .unit-badge {
            position: absolute;
            left: 16px;
            bottom: 16px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            color: #94a3b8;
            padding: 3px 14px;
            border-radius: 12px;
            font-size: 0.6rem;
            pointer-events: none;
            z-index: 5;
            border: 1px solid #334155;
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(12px);
            color: #f1f5f9;
            padding: 10px 28px;
            border-radius: 12px;
            font-size: 0.85rem;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.35s ease, transform 0.35s ease;
            pointer-events: none;
            border: 1px solid #334155;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transform: translateX(-50%) translateY(8px);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── Responsive ── */
        @media (max-width: 1024px) {
            .app-header {
                padding: 8px 12px;
            }
            .toolbar .btn {
                font-size: 0.65rem;
                padding: 4px 8px;
                min-height: 28px;
            }
            .snap-panel .toggle-label {
                font-size: 0.55rem;
            }
            .info-panel {
                right: 10px;
                top: 10px;
                max-width: 160px;
                font-size: 0.6rem;
                padding: 8px 10px;
            }
            .settings-panel {
                left: 10px;
                bottom: 30px;
                min-width: 160px;
                padding: 10px 12px;
            }
        }

        @media (max-width: 700px) {
            .app-title {
                font-size: 0.9rem;
            }
            .app-title i {
                font-size: 1rem;
            }
            .toolbar .btn {
                font-size: 0.55rem;
                padding: 3px 6px;
                min-height: 24px;
                gap: 4px;
            }
            .toolbar .btn i {
                font-size: 0.7rem;
            }
            .snap-panel .toggle-label {
                font-size: 0.5rem;
            }
            .status-bar {
                font-size: 0.55rem;
                padding: 4px 10px;
            }
            .zoom-controls button {
                width: 32px;
                height: 32px;
                font-size: 15px;
            }
            .info-panel {
                max-width: 130px;
                font-size: 0.55rem;
                padding: 6px 8px;
                right: 8px;
                top: 8px;
            }
            .settings-panel {
                left: 8px;
                bottom: 24px;
                min-width: 140px;
                padding: 8px 10px;
                font-size: 0.6rem;
            }
        }

        @media (max-width: 500px) {
            body {
                padding: 8px;
            }
            .app-container {
                border-radius: 14px;
            }
            .app-header {
                padding: 6px 8px;
                gap: 4px;
            }
            .toolbar .btn {
                font-size: 0.5rem;
                padding: 2px 5px;
                min-height: 22px;
                gap: 3px;
            }
            .toolbar .btn i {
                font-size: 0.6rem;
            }
            .separator {
                height: 18px;
                margin: 0 2px;
            }
            .export-group .btn {
                font-size: 0.5rem;
                padding: 2px 5px;
            }
        }

        /* ── Scrollbar styling ── */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <div class="app-container" id="appContainer">
        <!-- Header -->
        <header class="app-header">
            <div class="app-title">
                <i class="fas fa-ruler-combined"></i>
                <span>Geometry Pro</span>
            </div>

            <div class="toolbar">
                <button class="btn" id="modeSelect"><i class="fas fa-mouse-pointer"></i> Select</button>
                <button class="btn active" id="modePolygon"><i class="fas fa-draw-polygon"></i> Poly</button>
                <button class="btn" id="modeCircle"><i class="fas fa-circle"></i> Circle</button>
                <button class="btn" id="modeSplit"><i class="fas fa-cut"></i> Split</button>
                <button class="btn" id="modeDelete"><i class="fas fa-trash"></i> Del</button>
                <button class="btn" id="modeMove"><i class="fas fa-arrows-alt"></i> Move</button>
                <button class="btn" id="modeDimension"><i class="fas fa-ruler"></i> Dim</button>
                <button class="btn" id="modeText"><i class="fas fa-font"></i> Text</button>
                <div class="separator"></div>
                <button class="btn" id="btnUndo" disabled><i class="fas fa-undo-alt"></i> Undo</button>
                <button class="btn" id="btnRedo" disabled><i class="fas fa-redo-alt"></i> Redo</button>
                <button class="btn danger" id="btnClear"><i class="fas fa-eraser"></i> Clear</button>
            </div>

            <div class="snap-panel">
                <span style="font-size:0.6rem;font-weight:500;color:#94a3b8;">Snap:</span>
                <label class="toggle-label"><input type="checkbox" id="snapGrid"> <i class="fas fa-th"></i> Grid</label>
                <label class="toggle-label"><input type="checkbox" id="snapLine"> <i class="fas fa-grip-lines"></i> Line</label>
            </div>

            <div class="export-group">
                <button class="btn success" id="btnSaveJSON"><i class="fas fa-file-export"></i> JSON</button>
                <button class="btn success" id="btnLoadJSON"><i class="fas fa-folder-open"></i> Load</button>
                <button class="btn success" id="btnPDF"><i class="fas fa-file-pdf"></i> PDF</button>
                <button class="btn violet" id="btnSettings"><i class="fas fa-sliders-h"></i></button>
            </div>
        </header>

        <!-- Canvas -->
        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="geomCanvas"></canvas>

            <div class="zoom-controls">
                <button id="zoomIn" title="Zoom in"><i class="fas fa-plus"></i></button>
                <button id="zoomOut" title="Zoom out"><i class="fas fa-minus"></i></button>
                <button id="zoomReset" title="Reset view"><i class="fas fa-sync-alt"></i></button>
            </div>

            <div class="zoom-indicator" id="zoomIndicator">100%</div>
            <div class="unit-badge"><i class="fas fa-ruler"></i> Units: inches</div>

            <div class="info-panel" id="infoPanel">
                <div class="info-title"><i class="fas fa-chart-simple"></i> Info</div>
                <div id="infoContent">Draw something</div>
            </div>

            <div class="settings-panel" id="settingsPanel">
                <div class="settings-row"><b>Line:</b> <input type="color" id="lineColor" value="#3a3a3a"> Width <input type="number" id="lineWidth" value="2.2" step="0.1" min="0.5" max="10" style="width:52px">
                    <select id="lineDash"><option value="">Solid</option><option value="6,4">Dashed</option><option value="2,2">Dotted</option><option value="10,5,2,5">Dash-dot</option></select>
                </div>
                <div class="settings-row"><b>Point:</b> Style <select id="pointStyle"><option value="circle">● Circle</option><option value="square">■ Square</option><option value="cross">✚ Cross</option></select> Size <input type="number" id="pointSize" value="7" min="3" max="20" style="width:52px"></div>
                <div class="settings-row"><b>Grid:</b> <select id="gridStyle"><option value="lines">Graph Paper</option><option value="dots">Dots</option><option value="isometric">Isometric</option></select>
                    Minor <input type="number" id="gridMinorWidth" value="0.5" step="0.1" min="0.1" max="5" style="width:48px">
                    Medium <input type="number" id="gridMediumWidth" value="0.8" step="0.1" min="0.1" max="5" style="width:48px">
                    Major <input type="number" id="gridMajorWidth" value="1.5" step="0.1" min="0.1" max="5" style="width:48px">
                </div>
                <div class="settings-row"><label><i class="fas fa-moon"></i> <input type="checkbox" id="darkModeToggle"> Dark UI</label></div>
                <div class="settings-row"><label><i class="fas fa-align-left"></i> <input type="checkbox" id="showAlignment" checked> Alignment</label></div>
                <div class="settings-row"><label><i class="fas fa-vector-square"></i> <input type="checkbox" id="showPerimArea"> P/A</label></div>
                <div class="settings-row"><label><i class="fas fa-tag"></i> <input type="checkbox" id="showLabels" checked> Labels</label></div>
                <div class="settings-row"><label><i class="fas fa-arrows-left-right"></i> <input type="checkbox" id="showDistances" checked> Dist</label></div>
                <div class="settings-row"><label><i class="fas fa-angle-double-up"></i> <input type="checkbox" id="showAngles" checked> Angles</label></div>
                <div class="settings-row"><button class="btn danger" id="btnClearHistory"><i class="fas fa-history"></i> Clear History</button></div>
                <div class="settings-row"><button class="btn" id="btnResetSettings"><i class="fas fa-undo-alt"></i> Reset</button></div>
                <div class="settings-hint"><i class="fas fa-mouse-pointer"></i> Scroll to pan · Ctrl+scroll to zoom · Middle-drag to pan</div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <span id="statusText"><i class="fas fa-draw-polygon"></i> Polygon – Click to place points</span>
            <span id="globalStats"><i class="fas fa-chart-pie"></i> Polygons:0 | Circles:0 | History:0</span>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".json" style="display:none" />

    <script>
        (function() {
            // ── DOM refs ──
            const canvas = document.getElementById('geomCanvas');
            const ctx = canvas.getContext('2d');
            const infoContent = document.getElementById('infoContent');
            const statusText = document.getElementById('statusText');
            const globalStats = document.getElementById('globalStats');
            const settingsPanel = document.getElementById('settingsPanel');
            const toast = document.getElementById('toast');
            const fileInput = document.getElementById('fileInput');
            const zoomIndicator = document.getElementById('zoomIndicator');

            // ── Infinite Canvas State ──
            let viewX = 0,
                viewY = 0;
            let zoom = 1.0;
            const MIN_ZOOM = 0.1,
                MAX_ZOOM = 10;

            // ── Data ──
            let points = [];
            let adjacency = new Map();
            let currentPolyline = null;
            let polygons = [];
            let circles = [];
            let ellipses = [];
            let dimensions = [];
            let annotations = [];
            let junctionPoints = new Set();
            let selectedPoint = null;
            let dragStartX = null,
                dragStartY = null;
            let freeformPaths = [];
            let currentFreeform = null;
            let letterCounter = 0;
            const nextLetter = () => "ABCDEFGHIJKLMNOPQRSTUVWXYZ"[letterCounter++ % 26];

            const INCHES_PER_FOOT = 12;
            const WORLD_UNITS_PER_INCH = 2;
            const MAJOR_GRID = 48;
            const MINOR_GRID = 12;

            let toolMode = 'polygon';
            let circleStep = 0,
                circleTemp = {};
            let dimStep = 0,
                dimP1 = null,
                dimP2 = null;
            let textStep = 0,
                textAnchor = null,
                textPosition = null;
            let rectCorner = null;
            let ngonCenter = null;
            let ellipseStep = 0,
                ellipseTemp = {};
            let dragTarget = null,
                hoveredPoint = null,
                isDragging = false;
            let mouseScreenPos = { x: 0, y: 0 };
            let mouseWorldPos = { x: 0, y: 0 };
            let hoveredTextEndpoint = null;
            let textDrag = null;

            let moveStartPos = null;
            let moveStartPoints = null;
            let isMoving = false;

            let isPanning = false;
            let panStartX = 0,
                panStartY = 0;
            let panStartViewX = 0,
                panStartViewY = 0;

            let showLabels = true,
                showDistances = true,
                showAngles = true;
            let snapGrid = false,
                snapPoint = false,
                snapLine = false,
                snapMid = false,
                snapInter = false,
                snapTangent = false,
                snapPerp = false;
            let snapEllipseTang = false,
                snapParallel = false,
                snapExtend = false,
                snapObj = false;
            let darkMode = false;
            let lineColor = '#3a3a3a',
                lineWidthVal = 2.2,
                lineDash = [];
            let pointStyle = 'circle',
                pointRadius = 7;
            let gridStyle = 'lines';
            let gridMinorWidth = 0.5,
                gridMediumWidth = 0.8,
                gridMajorWidth = 1.5;
            let showAlignmentGuides = true,
                showPerimeterArea = false;

            const HIT_R = 15,
                CLOSE_R = 20;
            const MAX_HISTORY = 80;

            // ── Formatting ──
            function formatLength(worldUnits) {
                if (worldUnits < 0) return '-' + formatLength(-worldUnits);
                const inches = worldUnits / WORLD_UNITS_PER_INCH;
                const feet = Math.floor(inches / INCHES_PER_FOOT);
                const remaining = inches - feet * INCHES_PER_FOOT;
                if (feet === 0) {
                    return remaining.toFixed(1) + '"';
                } else {
                    if (remaining < 0.05) return feet + "'";
                    else return feet + "' " + remaining.toFixed(1) + '"';
                }
            }

            function worldToScreen(wx, wy) {
                return { x: (wx - viewX) * zoom, y: (wy - viewY) * zoom };
            }

            function screenToWorld(sx, sy) {
                return { x: sx / zoom + viewX, y: sy / zoom + viewY };
            }

            // ── History ──
            let history = [];
            let historyIndex = -1;
            let isRestoring = false;

            function captureState() {
                const adjObj = {};
                for (let [k, v] of adjacency) adjObj[k] = [...v];
                return {
                    points: points.map(p => ({ ...p })),
                    adjacency: adjObj,
                    currentPolyline: currentPolyline ? [...currentPolyline] : null,
                    polygons: polygons.map(p => ({ indices: [...p.indices] })),
                    circles: circles.map(c => ({ ...c, anchors: c.anchors ? c.anchors.map(a => ({ ...a })) : [] })),
                    ellipses: ellipses.map(e => ({ ...e })),
                    dimensions: dimensions.map(d => ({ ...d })),
                    annotations: annotations.map(a => ({ ...a })),
                    junctionPoints: [...junctionPoints],
                    freeformPaths: freeformPaths.map(f => ({ points: f.points.map(p => ({ ...p })), closed: f.closed })),
                    letterCounter,
                    circleStep,
                    circleTemp: { ...circleTemp },
                    dimStep,
                    dimP1,
                    dimP2,
                    textStep,
                    textAnchor: textAnchor ? { ...textAnchor } : null,
                    textPosition: textPosition ? { ...textPosition } : null,
                    rectCorner: rectCorner ? { ...rectCorner } : null,
                    ngonCenter: ngonCenter ? { ...ngonCenter } : null,
                    ellipseStep,
                    ellipseTemp: { ...ellipseTemp },
                    viewX,
                    viewY,
                    zoom,
                };
            }

            function restoreState(state) {
                isRestoring = true;
                points = state.points.map(p => ({ ...p }));
                const adjObj = state.adjacency || {};
                adjacency = new Map();
                for (let k in adjObj) adjacency.set(parseInt(k), new Set(adjObj[k]));
                currentPolyline = state.currentPolyline ? [...state.currentPolyline] : null;
                polygons = state.polygons.map(p => ({ indices: [...p.indices] }));
                circles = state.circles.map(c => ({ ...c, anchors: c.anchors ? c.anchors.map(a => ({ ...a })) : [] }));
                ellipses = state.ellipses.map(e => ({ ...e }));
                dimensions = state.dimensions.map(d => ({ ...d }));
                annotations = state.annotations.map(a => ({ ...a }));
                junctionPoints = new Set(state.junctionPoints || []);
                selectedPoint = null;
                freeformPaths = state.freeformPaths ? state.freeformPaths.map(f => ({ points: f.points.map(p => ({ ...
                        p })), closed: f.closed })) : [];
                letterCounter = state.letterCounter || 0;
                circleStep = state.circleStep || 0;
                circleTemp = { ...(state.circleTemp || {}) };
                dimStep = state.dimStep || 0;
                dimP1 = state.dimP1 !== undefined ? state.dimP1 : null;
                dimP2 = state.dimP2 !== undefined ? state.dimP2 : null;
                textStep = state.textStep || 0;
                textAnchor = state.textAnchor ? { ...state.textAnchor } : null;
                textPosition = state.textPosition ? { ...state.textPosition } : null;
                rectCorner = state.rectCorner ? { ...state.rectCorner } : null;
                ngonCenter = state.ngonCenter ? { ...state.ngonCenter } : null;
                ellipseStep = state.ellipseStep || 0;
                ellipseTemp = { ...(state.ellipseTemp || {}) };
                if (state.viewX !== undefined) { viewX = state.viewX;
                    viewY = state.viewY;
                    zoom = state.zoom || 1; }
                isRestoring = false;
                updateAllCircleAnchors();
                updateZoomIndicator();
            }

            function pushHistory() {
                if (isRestoring) return;
                if (historyIndex < history.length - 1) history = history.slice(0, historyIndex + 1);
                const state = captureState();
                history.push(state);
                if (history.length > MAX_HISTORY) history.shift();
                historyIndex = history.length - 1;
                updateUndoButtons();
                updateStatusBar();
                autoSave();
            }

            function undo() {
                if (historyIndex <= 0) return;
                historyIndex--;
                restoreState(history[historyIndex]);
                render();
                updateUndoButtons();
                updateStatusBar();
                showToast('↩️ Undo');
            }

            function redo() {
                if (historyIndex >= history.length - 1) return;
                historyIndex++;
                restoreState(history[historyIndex]);
                render();
                updateUndoButtons();
                updateStatusBar();
                showToast('↪️ Redo');
            }

            function updateUndoButtons() {
                document.getElementById('btnUndo').disabled = (historyIndex <= 0);
                document.getElementById('btnRedo').disabled = (historyIndex >= history.length - 1);
            }

            function clearHistory() {
                history = [];
                historyIndex = -1;
                pushHistory();
                updateUndoButtons();
                showToast('🗑️ History cleared');
            }

            function withHistory(fn) {
                pushHistory();
                fn();
                render();
                updateStatusBar();
            }

            // ── Circle anchors ──
            function updateAllCircleAnchors() {
                for (let c of circles) {
                    const center = points[c.centerIdx];
                    const radPt = points[c.radiusIdx];
                    if (!center || !radPt) continue;
                    const r = dist(center, radPt);
                    if (c.anchors) {
                        for (let a of c.anchors) {
                            const p = points[a.idx];
                            if (p) {
                                p.x = center.x + r * Math.cos(a.angle);
                                p.y = center.y + r * Math.sin(a.angle);
                            }
                        }
                    }
                }
            }

            function addCircleAnchor(circleIdx, pointIdx, angle) {
                const c = circles[circleIdx];
                if (!c) return;
                if (!c.anchors) c.anchors = [];
                c.anchors.push({ idx: pointIdx, angle: angle });
                const center = points[c.centerIdx];
                const radPt = points[c.radiusIdx];
                if (center && radPt) {
                    const r = dist(center, radPt);
                    const p = points[pointIdx];
                    p.x = center.x + r * Math.cos(angle);
                    p.y = center.y + r * Math.sin(angle);
                }
            }

            function updateCircleAnchors(circleIdx) {
                const c = circles[circleIdx];
                if (!c) return;
                const center = points[c.centerIdx];
                const radPt = points[c.radiusIdx];
                if (!center || !radPt) return;
                const r = dist(center, radPt);
                if (c.anchors) {
                    for (let a of c.anchors) {
                        const p = points[a.idx];
                        if (p) {
                            p.x = center.x + r * Math.cos(a.angle);
                            p.y = center.y + r * Math.sin(a.angle);
                        }
                    }
                }
            }

            // ── Helpers ──
            const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
            const getPos = e => {
                const r = canvas.getBoundingClientRect();
                return { x: e.clientX - r.left, y: e.clientY - r.top };
            };
            const angleBetweenVectors = (vx1, vy1, vx2, vy2) => {
                const dot = vx1 * vx2 + vy1 * vy2;
                const m1 = Math.hypot(vx1, vy1),
                    m2 = Math.hypot(vx2, vy2);
                if (m1 < 0.001 || m2 < 0.001) return null;
                return Math.acos(Math.max(-1, Math.min(1, dot / (m1 * m2))));
            };

            function lineIntersection(p1, p2, p3, p4) {
                const d = (p1.x - p2.x) * (p3.y - p4.y) - (p1.y - p2.y) * (p3.x - p4.x);
                if (Math.abs(d) < 1e-6) return null;
                const t = ((p1.x - p3.x) * (p3.y - p4.y) - (p1.y - p3.y) * (p3.x - p4.x)) / d;
                const u = -((p1.x - p2.x) * (p1.y - p3.y) - (p1.y - p2.y) * (p1.x - p3.x)) / d;
                if (t >= 0 && t <= 1 && u >= 0 && u <= 1) return { x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) };
                return null;
            }

            function pointToSegmentDist(px, py, p1, p2) {
                const dx = p2.x - p1.x,
                    dy = p2.y - p1.y;
                const len2 = dx * dx + dy * dy;
                if (len2 === 0) return { dist: dist({ x: px, y: py }, p1), proj: { x: p1.x, y: p1.y }, t: 0 };
                let t = ((px - p1.x) * dx + (py - p1.y) * dy) / len2;
                t = Math.max(0, Math.min(1, t));
                const proj = { x: p1.x + t * dx, y: p1.y + t * dy };
                return { dist: dist({ x: px, y: py }, proj), proj, t };
            }

            // ── Snapping ──
            function snapAll(pos) {
                let best = pos,
                    bestDist = Infinity;
                const candidates = [];

                if (snapGrid) {
                    const g = { x: Math.round(pos.x / MAJOR_GRID) * MAJOR_GRID, y: Math.round(pos.y / MAJOR_GRID) *
                            MAJOR_GRID };
                    candidates.push({ ...g, dist: dist(pos, g) });
                }
                if (snapPoint) {
                    for (let i = 0; i < points.length; i++) {
                        const d = dist(pos, points[i]);
                        if (d < HIT_R) candidates.push({ ...points[i], dist: d });
                    }
                }
                if (snapLine) {
                    const gridStep = MINOR_GRID;
                    const gx = Math.round(pos.x / gridStep) * gridStep;
                    const gy = Math.round(pos.y / gridStep) * gridStep;
                    const dx = Math.abs(pos.x - gx);
                    const dy = Math.abs(pos.y - gy);
                    const lineSnapRange = Math.max(10, 14 / Math.max(zoom, 0.5));

                    if (dx <= lineSnapRange) {
                        candidates.push({ x: gx, y: pos.y, dist: dx });
                    }
                    if (dy <= lineSnapRange) {
                        candidates.push({ x: pos.x, y: gy, dist: dy });
                    }
                    const intersectionDist = Math.hypot(pos.x - gx, pos.y - gy);
                    if (intersectionDist <= lineSnapRange) {
                        candidates.push({ x: gx, y: gy, dist: intersectionDist });
                    }
                }
                if (snapMid) {
                    const drawn = new Set();
                    for (let [i, nbrs] of adjacency) {
                        const p1 = points[i];
                        if (!p1) continue;
                        for (let j of nbrs) {
                            const key = i < j ? `${i}-${j}` : `${j}-${i}`;
                            if (drawn.has(key)) continue;
                            drawn.add(key);
                            const p2 = points[j];
                            if (!p2) continue;
                            const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
                            const d = dist(pos, mid);
                            if (d < HIT_R) candidates.push({ ...mid, dist: d });
                        }
                    }
                    for (let c of circles) {
                        const center = points[c.centerIdx],
                            radPt = points[c.radiusIdx];
                        if (center && radPt) {
                            const mid = { x: (center.x + radPt.x) / 2, y: (center.y + radPt.y) / 2 };
                            const d = dist(pos, mid);
                            if (d < HIT_R) candidates.push({ ...mid, dist: d });
                        }
                        if (c.endAngleIdx !== undefined) {
                            const endPt = points[c.endAngleIdx];
                            if (center && endPt) {
                                const mid = { x: (center.x + endPt.x) / 2, y: (center.y + endPt.y) / 2 };
                                const d = dist(pos, mid);
                                if (d < HIT_R) candidates.push({ ...mid, dist: d });
                            }
                        }
                        if (c.anchors) {
                            for (let a of c.anchors) {
                                const p = points[a.idx];
                                if (p && center) {
                                    const mid = { x: (center.x + p.x) / 2, y: (center.y + p.y) / 2 };
                                    const d = dist(pos, mid);
                                    if (d < HIT_R) candidates.push({ ...mid, dist: d });
                                }
                            }
                        }
                    }
                }
                if (snapInter) {
                    const segs = [];
                    const drawn = new Set();
                    for (let [i, nbrs] of adjacency) {
                        const p1 = points[i];
                        if (!p1) continue;
                        for (let j of nbrs) {
                            const key = i < j ? `${i}-${j}` : `${j}-${i}`;
                            if (drawn.has(key)) continue;
                            drawn.add(key);
                            segs.push({ p1: points[i], p2: points[j] });
                        }
                    }
                    for (let c of circles) {
                        const center = points[c.centerIdx],
                            radPt = points[c.radiusIdx];
                        if (center && radPt) segs.push({ p1: center, p2: radPt });
                        if (c.endAngleIdx !== undefined) {
                            const endPt = points[c.endAngleIdx];
                            if (center && endPt) segs.push({ p1: center, p2: endPt });
                        }
                        if (c.anchors) {
                            for (let a of c.anchors) {
                                const p = points[a.idx];
                                if (p && center) segs.push({ p1: center, p2: p });
                            }
                        }
                    }
                    for (let a = 0; a < segs.length; a++) {
                        for (let b = a + 1; b < segs.length; b++) {
                            const inter = lineIntersection(segs[a].p1, segs[a].p2, segs[b].p1, segs[b].p2);
                            if (inter) { const d = dist(pos, inter); if (d < 18) candidates.push({ ...inter, dist: d }); }
                        }
                    }
                }
                if (snapTangent) {
                    for (let c of circles) {
                        const center = points[c.centerIdx],
                            radPt = points[c.radiusIdx];
                        if (!center || !radPt) continue;
                        const r = dist(center, radPt);
                        const d = dist(pos, center);
                        if (d < r || d < 0.1) continue;
                        const ang = Math.atan2(pos.y - center.y, pos.x - center.x);
                        const alpha = Math.asin(Math.min(1, r / d));
                        const t1 = ang + alpha,
                            t2 = ang - alpha;
                        const tan1 = { x: center.x + r * Math.cos(t1), y: center.y + r * Math.sin(t1) };
                        const tan2 = { x: center.x + r * Math.cos(t2), y: center.y + r * Math.sin(t2) };
                        const d1 = dist(pos, tan1),
                            d2 = dist(pos, tan2);
                        if (d1 < 20) candidates.push({ ...tan1, dist: d1 });
                        if (d2 < 20) candidates.push({ ...tan2, dist: d2 });
                    }
                }
                if (snapEllipseTang) {
                    for (let e of ellipses) {
                        const center = points[e.centerIdx],
                            rxP = points[e.radXIdx],
                            ryP = points[e.radYIdx];
                        if (!center || !rxP || !ryP) continue;
                        const rx = dist(center, rxP),
                            ry = dist(center, ryP);
                        if (rx < 0.1 || ry < 0.1) continue;
                        const angle = Math.atan2(rxP.y - center.y, rxP.x - center.x);
                        const dx = pos.x - center.x,
                            dy = pos.y - center.y;
                        const cosA = Math.cos(angle),
                            sinA = Math.sin(angle);
                        let bestDist = Infinity,
                            bestPt = null;
                        const steps = 36;
                        for (let i = 0; i < steps; i++) {
                            const theta = (i / steps) * 2 * Math.PI;
                            const px = center.x + rx * Math.cos(theta) * cosA - ry * Math.sin(theta) * sinA;
                            const py = center.y + rx * Math.cos(theta) * sinA + ry * Math.sin(theta) * cosA;
                            const d = dist(pos, { x: px, y: py });
                            if (d < bestDist) { bestDist = d;
                                bestPt = { x: px, y: py }; }
                        }
                        if (bestPt && bestDist < 20) candidates.push({ ...bestPt, dist: bestDist });
                    }
                }
                if (snapPerp) {
                    const drawn = new Set();
                    for (let [i, nbrs] of adjacency) {
                        const p1 = points[i];
                        if (!p1) continue;
                        for (let j of nbrs) {
                            const key = i < j ? `${i}-${j}` : `${j}-${i}`;
                            if (drawn.has(key)) continue;
                            drawn.add(key);
                            const p2 = points[j];
                            if (!p2) continue;
                            const dx = p2.x - p1.x,
                                dy = p2.y - p1.y;
                            const len = Math.hypot(dx, dy);
                            if (len < 0.01) continue;
                            const nx = -dy / len,
                                ny = dx / len;
                            const t = (pos.x - p1.x) * nx + (pos.y - p1.y) * ny;
                            const proj = { x: p1.x + t * nx, y: p1.y + t * ny };
                            const d = dist(pos, proj);
                            if (d < 14) candidates.push({ ...proj, dist: d });
                        }
                    }
                }
                if (snapParallel || snapExtend) {
                    const drawn = new Set();
                    for (let [i, nbrs] of adjacency) {
                        const p1 = points[i];
                        if (!p1) continue;
                        for (let j of nbrs) {
                            const key = i < j ? `${i}-${j}` : `${j}-${i}`;
                            if (drawn.has(key)) continue;
                            drawn.add(key);
                            const p2 = points[j];
                            if (!p2) continue;
                            const dx = p2.x - p1.x,
                                dy = p2.y - p1.y;
                            const len = Math.hypot(dx, dy);
                            if (len < 0.01) continue;
                            const nx = -dy / len,
                                ny = dx / len;
                            if (snapParallel) {
                                const t = ((pos.x - p1.x) * dx + (pos.y - p1.y) * dy) / (len * len);
                                const proj = { x: p1.x + t * dx, y: p1.y + t * dy };
                                const perpDist = (pos.x - p1.x) * nx + (pos.y - p1.y) * ny;
                                const pProj = { x: proj.x + perpDist * nx, y: proj.y + perpDist * ny };
                                const d = dist(pos, pProj);
                                if (d < 16) candidates.push({ ...pProj, dist: d });
                            }
                            if (snapExtend) {
                                const t = ((pos.x - p1.x) * dx + (pos.y - p1.y) * dy) / (len * len);
                                const proj = { x: p1.x + t * dx, y: p1.y + t * dy };
                                const d = dist(pos, proj);
                                if (d < 12 && (t < -0.1 || t > 1.1)) candidates.push({ ...proj, dist: d });
                            }
                        }
                    }
                }
                if (snapObj) {
                    for (let c of circles) {
                        const center = points[c.centerIdx],
                            radPt = points[c.radiusIdx];
                        if (!center || !radPt) continue;
                        const r = dist(center, radPt);
                        const dc = dist(pos, center);
                        if (dc < HIT_R) candidates.push({ ...center, dist: dc });
                        const qs = [
                            { x: center.x + r, y: center.y },
                            { x: center.x - r, y: center.y },
                            { x: center.x, y: center.y + r },
                            { x: center.x, y: center.y - r }
                        ];
                        for (let q of qs) { const d = dist(pos, q); if (d < HIT_R) candidates.push({ ...q, dist: d }); }
                    }
                    for (let e of ellipses) {
                        const center = points[e.centerIdx];
                        if (!center) continue;
                        const dc = dist(pos, center);
                        if (dc < HIT_R) candidates.push({ ...center, dist: dc });
                    }
                    for (let p of polygons) {
                        if (p.indices.length < 3) continue;
                        let cx = 0,
                            cy = 0;
                        for (let idx of p.indices) { cx += points[idx].x;
                            cy += points[idx].y; }
                        cx /= p.indices.length;
                        cy /= p.indices.length;
                        const dc = dist(pos, { x: cx, y: cy });
                        if (dc < HIT_R) candidates.push({ x: cx, y: cy, dist: dc });
                    }
                }

                for (let c of candidates) {
                    if (c.dist < bestDist) { best = c;
                        bestDist = c.dist; }
                }
                return best;
            }

            // ── Adjacency ──
            function addConnection(i, j) {
                if (i === j) return;
                if (!adjacency.has(i)) adjacency.set(i, new Set());
                if (!adjacency.has(j)) adjacency.set(j, new Set());
                adjacency.get(i).add(j);
                adjacency.get(j).add(i);
            }

            function removeConnection(i, j) {
                if (adjacency.has(i)) adjacency.get(i).delete(j);
                if (adjacency.has(j)) adjacency.get(j).delete(i);
                if (adjacency.has(i) && adjacency.get(i).size === 0) adjacency.delete(i);
                if (adjacency.has(j) && adjacency.get(j).size === 0) adjacency.delete(j);
            }

            function removeAllConnections(i) {
                for (let n of getNeighbors(i)) {
                    if (adjacency.has(n)) adjacency.get(n).delete(i);
                }
                adjacency.delete(i);
            }
            const getNeighbors = i => adjacency.has(i) ? [...adjacency.get(i)] : [];

            // ── Points ──
            function addPoint(x, y, connectToPrev = false) {
                const snapped = snapAll({ x, y });
                const idx = points.length;
                points.push({ x: snapped.x, y: snapped.y, letter: nextLetter() });
                if (connectToPrev && currentPolyline && currentPolyline.length > 0) {
                    addConnection(idx, currentPolyline[currentPolyline.length - 1]);
                }
                if (!currentPolyline) currentPolyline = [];
                currentPolyline.push(idx);
                return idx;
            }

            function deletePoint(idx) {
                if (idx === undefined || idx >= points.length) return;
                junctionPoints.delete(idx);
                if (selectedPoint === idx) selectedPoint = null;
                for (let c of circles) {
                    if (c.anchors) {
                        c.anchors = c.anchors.filter(a => a.idx !== idx);
                    }
                }
                removeAllConnections(idx);
                if (currentPolyline) {
                    currentPolyline = currentPolyline.filter(i => i !== idx);
                    if (currentPolyline.length === 0) currentPolyline = null;
                }
                for (let i = circles.length - 1; i >= 0; i--) {
                    if (circles[i].centerIdx === idx || circles[i].radiusIdx === idx || circles[i].endAngleIdx === idx)
                        circles.splice(i, 1);
                }
                for (let i = ellipses.length - 1; i >= 0; i--) {
                    if (ellipses[i].centerIdx === idx || ellipses[i].radXIdx === idx || ellipses[i].radYIdx === idx)
                        ellipses.splice(i, 1);
                }
                for (let i = dimensions.length - 1; i >= 0; i--) {
                    if (dimensions[i].p1Idx === idx || dimensions[i].p2Idx === idx) dimensions.splice(i, 1);
                }
                points.splice(idx, 1);
                const upd = o => o > idx ? o - 1 : o;
                const newAdj = new Map();
                for (let [i, nbrs] of adjacency) {
                    const ni = upd(i);
                    if (ni === idx) continue;
                    const s = new Set();
                    for (let n of nbrs) { const nn = upd(n); if (nn !== idx) s.add(nn); }
                    if (s.size) newAdj.set(ni, s);
                }
                adjacency.clear();
                for (let [k, v] of newAdj) adjacency.set(k, v);
                if (currentPolyline) {
                    currentPolyline = currentPolyline.map(upd).filter(i => i >= 0);
                    if (!currentPolyline.length) currentPolyline = null;
                }
                circles.forEach(c => {
                    c.centerIdx = upd(c.centerIdx);
                    c.radiusIdx = upd(c.radiusIdx);
                    if (c.endAngleIdx !== undefined) c.endAngleIdx = upd(c.endAngleIdx);
                    if (c.anchors) {
                        c.anchors = c.anchors.map(a => ({ idx: upd(a.idx), angle: a.angle })).filter(a => a.idx >= 0);
                    }
                });
                ellipses.forEach(e => { e.centerIdx = upd(e.centerIdx);
                    e.radXIdx = upd(e.radXIdx);
                    e.radYIdx = upd(e.radYIdx); });
                dimensions.forEach(d => { d.p1Idx = upd(d.p1Idx);
                    d.p2Idx = upd(d.p2Idx); });
                polygons.forEach(p => p.indices = p.indices.map(upd).filter(i => i >= 0));
                freeformPaths.forEach(f => {
                    f.points = f.points.map(p => ({ ...p }));
                });
            }

            function clearAll() {
                points.length = 0;
                adjacency.clear();
                currentPolyline = null;
                polygons.length = 0;
                circles.length = 0;
                ellipses.length = 0;
                dimensions.length = 0;
                annotations.length = 0;
                freeformPaths.length = 0;
                currentFreeform = null;
                circleStep = 0;
                circleTemp = {};
                dimStep = 0;
                dimP1 = null;
                dimP2 = null;
                textStep = 0;
                textAnchor = null;
                textPosition = null;
                rectCorner = null;
                ngonCenter = null;
                ellipseStep = 0;
                ellipseTemp = {};
                letterCounter = 0;
            }

            function closeCurrentPolyline() {
                if (!currentPolyline || currentPolyline.length < 3) return;
                addConnection(currentPolyline[0], currentPolyline[currentPolyline.length - 1]);
                polygons.push({ indices: [...currentPolyline] });
                currentPolyline = null;
            }

            // ── Split ──
            function findClosestSegment(px, py, hitRadius = 12) {
                let best = null;
                const drawn = new Set();
                for (let [i, nbrs] of adjacency) {
                    const p1 = points[i];
                    if (!p1) continue;
                    for (let j of nbrs) {
                        const key = i < j ? `${i}-${j}` : `${j}-${i}`;
                        if (drawn.has(key)) continue;
                        drawn.add(key);
                        const p2 = points[j];
                        if (!p2) continue;
                        const res = pointToSegmentDist(px, py, p1, p2);
                        if (res.dist <= hitRadius && (!best || res.dist < best.dist)) {
                            best = { i, j, proj: res.proj, dist: res.dist };
                        }
                    }
                }
                return best;
            }

            function splitSegment(seg) {
                removeConnection(seg.i, seg.j);
                const snapped = snapAll(seg.proj);
                const newIdx = points.length;
                points.push({ x: snapped.x, y: snapped.y, letter: nextLetter() });
                addConnection(newIdx, seg.i);
                addConnection(newIdx, seg.j);
                if (currentPolyline) {
                    for (let k = 0; k < currentPolyline.length; k++) {
                        const a = currentPolyline[k],
                            b = currentPolyline[(k + 1) % currentPolyline.length];
                        if ((a === seg.i && b === seg.j) || (a === seg.j && b === seg.i)) {
                            currentPolyline.splice(k + 1, 0, newIdx);
                            break;
                        }
                    }
                }
            }

            function findClosestCircle(px, py) {
                let best = null;
                const threshold = 14;
                for (let ci = 0; ci < circles.length; ci++) {
                    const c = circles[ci];
                    const center = points[c.centerIdx],
                        radPt = points[c.radiusIdx];
                    if (!center || !radPt) continue;
                    const r = dist(center, radPt);
                    const d = dist({ x: px, y: py }, center);
                    const diff = Math.abs(d - r);
                    if (diff < threshold && (!best || diff < best.diff)) {
                        let onArc = true;
                        if (c.endAngleIdx !== undefined) {
                            const endPt = points[c.endAngleIdx];
                            if (endPt) {
                                const startAng = Math.atan2(radPt.y - center.y, radPt.x - center.x);
                                const endAng = Math.atan2(endPt.y - center.y, endPt.x - center.x);
                                let ang = Math.atan2(py - center.y, px - center.x);
                                let delta = endAng - startAng;
                                if (delta < 0) delta += 2 * Math.PI;
                                let a = ang - startAng;
                                if (a < 0) a += 2 * Math.PI;
                                onArc = a <= delta || Math.abs(a - delta) < 0.01 || Math.abs(a) < 0.01;
                            }
                        }
                        if (onArc) {
                            const angle = Math.atan2(py - center.y, px - center.x);
                            const proj = { x: center.x + r * Math.cos(angle), y: center.y + r * Math.sin(angle) };
                            best = { circleIdx: ci, circle: c, proj, diff, angle };
                        }
                    }
                }
                return best;
            }

            function splitCircleAtPoint(circleIdx, proj, angle) {
                const c = circles[circleIdx];
                if (!c) return;
                const snapped = snapAll(proj);
                const newIdx = points.length;
                points.push({ x: snapped.x, y: snapped.y, letter: nextLetter() });
                addConnection(newIdx, c.centerIdx);
                addCircleAnchor(circleIdx, newIdx, angle);
                if (c.endAngleIdx !== undefined) {
                    const endPt = points[c.endAngleIdx];
                    const center = points[c.centerIdx];
                    const radPt = points[c.radiusIdx];
                    if (center && radPt && endPt) {
                        const newCircle = {
                            centerIdx: c.centerIdx,
                            radiusIdx: c.radiusIdx,
                            endAngleIdx: newIdx,
                            anchors: []
                        };
                        c.endAngleIdx = newIdx;
                        circles.push(newCircle);
                        addConnection(newIdx, c.centerIdx);
                    }
                }
                updateCircleAnchors(circleIdx);
            }

            // ── Shapes ──
            function createRectangle(p1, p2) {
                const corners = [p1, { x: p2.x, y: p1.y }, p2, { x: p1.x, y: p2.y }];
                const indices = corners.map(c => addPoint(c.x, c.y, false));
                for (let i = 0; i < 4; i++) addConnection(indices[i], indices[(i + 1) % 4]);
                polygons.push({ indices });
            }

            function createRegularPolygon(center, radiusPt, sides) {
                const r = dist(center, radiusPt);
                const startAngle = Math.atan2(radiusPt.y - center.y, radiusPt.x - center.x);
                const indices = [];
                for (let i = 0; i < sides; i++) {
                    const ang = startAngle + (2 * Math.PI * i) / sides;
                    indices.push(addPoint(center.x + Math.cos(ang) * r, center.y + Math.sin(ang) * r, false));
                }
                for (let i = 0; i < sides; i++) addConnection(indices[i], indices[(i + 1) % sides]);
                polygons.push({ indices });
            }

            function createEllipse(centerIdx, radXIdx, radYIdx) {
                ellipses.push({ centerIdx, radXIdx, radYIdx });
            }

            function finalizeFullCircle(centerIdx, radiusIdx) {
                const c = { centerIdx, radiusIdx, anchors: [] };
                circles.push(c);
                addConnection(centerIdx, radiusIdx);
            }

            function finalizeArc(centerIdx, radiusIdx, endIdx) {
                const c = { centerIdx, radiusIdx, endAngleIdx: endIdx, anchors: [] };
                circles.push(c);
                addConnection(centerIdx, radiusIdx);
                addConnection(centerIdx, endIdx);
            }

            // ── Move ──
            function moveAllGeometry(dx, dy) {
                if (dx === 0 && dy === 0) return;
                for (let p of points) {
                    p.x += dx;
                    p.y += dy;
                }
                for (let a of annotations) {
                    a.x += dx;
                    a.y += dy;
                }
                for (let d of dimensions) {
                    if (d.offsetPoint) {
                        d.offsetPoint.x += dx;
                        d.offsetPoint.y += dy;
                    }
                }
                for (let f of freeformPaths) {
                    for (let p of f.points) {
                        p.x += dx;
                        p.y += dy;
                    }
                }
            }

            // ── Resize ──
            function resizeCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                canvas.style.width = rect.width + 'px';
                canvas.style.height = rect.height + 'px';
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
            }
            window.addEventListener('resize', () => { resizeCanvas();
                render(); });

            function updateZoomIndicator() {
                zoomIndicator.textContent = Math.round(zoom * 100) + '%';
            }

            // ── Render ──
            function render() {
                const w = canvas.width / (Math.min(window.devicePixelRatio || 1, 2));
                const h = canvas.height / (Math.min(window.devicePixelRatio || 1, 2));
                ctx.clearRect(0, 0, w, h);
                renderToContext(ctx, w, h, false);
                updateInfoPanel();
                updateStatusBar();
            }

            function renderToContext(context, width, height, skipGrid) {
                // Workspace background is always light
                context.fillStyle = '#f1f5f9';
                context.fillRect(0, 0, width, height);

                if (!skipGrid) drawGrid(context, width, height);
                drawFreeformPaths(context);
                drawAllEdges(context);
                drawEllipses(context);
                drawCircles(context);
                if (showDistances) drawDistanceLabels(context);
                if (showAngles) drawAllAngles(context);
                drawDimensions(context);
                drawAnnotations(context);
                if (showPerimeterArea) drawPerimeterAreaLabels(context);
                drawPoints(context);
                if (toolMode === 'circle' && circleStep === 1) drawCircleRadiusPreview(context);
                if (toolMode === 'dimension' && dimStep === 2) drawDimPreview(context);
                if (toolMode === 'text' && textStep > 0) drawTextConnectorPreview(context);
                if (toolMode === 'split') highlightNearestSegment(context);
                if (toolMode === 'delete') highlightDeleteTarget(context);
                if (showAlignmentGuides) drawAlignmentGuides(context);
                if (currentFreeform && currentFreeform.points.length > 0) drawFreeformPreview(context);
            }

            // ── Grid (light workspace) ──
            function drawGrid(context, w, h) {
                const topLeft = screenToWorld(0, 0);
                const bottomRight = screenToWorld(w, h);
                const xStart = Math.floor(topLeft.x / MAJOR_GRID) * MAJOR_GRID;
                const yStart = Math.floor(topLeft.y / MAJOR_GRID) * MAJOR_GRID;
                const xEnd = Math.ceil(bottomRight.x / MAJOR_GRID) * MAJOR_GRID;
                const yEnd = Math.ceil(bottomRight.y / MAJOR_GRID) * MAJOR_GRID;

                if (gridStyle === 'lines') {
                    const minorColor = 'rgba(200,200,200,0.5)';
                    const majorColor = 'rgba(160,160,160,0.7)';
                    context.lineWidth = gridMinorWidth;
                    for (let x = xStart - MAJOR_GRID; x <= xEnd + MAJOR_GRID; x += MINOR_GRID) {
                        if (x % MAJOR_GRID === 0) continue;
                        const sx = (x - viewX) * zoom;
                        if (sx < -10 || sx > w + 10) continue;
                        context.strokeStyle = minorColor;
                        context.beginPath();
                        context.moveTo(sx, 0);
                        context.lineTo(sx, h);
                        context.stroke();
                    }
                    for (let y = yStart - MAJOR_GRID; y <= yEnd + MAJOR_GRID; y += MINOR_GRID) {
                        if (y % MAJOR_GRID === 0) continue;
                        const sy = (y - viewY) * zoom;
                        if (sy < -10 || sy > h + 10) continue;
                        context.strokeStyle = minorColor;
                        context.beginPath();
                        context.moveTo(0, sy);
                        context.lineTo(w, sy);
                        context.stroke();
                    }

                    context.lineWidth = gridMediumWidth;
                    context.setLineDash([5, 4]);
                    for (let x = xStart - MAJOR_GRID; x <= xEnd + MAJOR_GRID; x += MINOR_GRID * 2) {
                        if (x % MAJOR_GRID === 0) continue;
                        const sx = (x - viewX) * zoom;
                        if (sx < -10 || sx > w + 10) continue;
                        context.strokeStyle = majorColor;
                        context.beginPath();
                        context.moveTo(sx, 0);
                        context.lineTo(sx, h);
                        context.stroke();
                    }
                    for (let y = yStart - MAJOR_GRID; y <= yEnd + MAJOR_GRID; y += MINOR_GRID * 2) {
                        if (y % MAJOR_GRID === 0) continue;
                        const sy = (y - viewY) * zoom;
                        if (sy < -10 || sy > h + 10) continue;
                        context.strokeStyle = majorColor;
                        context.beginPath();
                        context.moveTo(0, sy);
                        context.lineTo(w, sy);
                        context.stroke();
                    }

                    context.setLineDash([]);
                    context.lineWidth = gridMajorWidth;
                    for (let x = xStart - MAJOR_GRID; x <= xEnd + MAJOR_GRID; x += MAJOR_GRID) {
                        const sx = (x - viewX) * zoom;
                        if (sx < -10 || sx > w + 10) continue;
                        context.strokeStyle = majorColor;
                        context.beginPath();
                        context.moveTo(sx, 0);
                        context.lineTo(sx, h);
                        context.stroke();
                    }
                    for (let y = yStart - MAJOR_GRID; y <= yEnd + MAJOR_GRID; y += MAJOR_GRID) {
                        const sy = (y - viewY) * zoom;
                        if (sy < -10 || sy > h + 10) continue;
                        context.strokeStyle = majorColor;
                        context.beginPath();
                        context.moveTo(0, sy);
                        context.lineTo(w, sy);
                        context.stroke();
                    }
                } else if (gridStyle === 'dots') {
                    const minorColor = 'rgba(180,180,180,0.4)';
                    const majorColor = 'rgba(140,140,140,0.6)';
                    for (let x = xStart - MAJOR_GRID; x <= xEnd + MAJOR_GRID; x += MINOR_GRID) {
                        for (let y = yStart - MAJOR_GRID; y <= yEnd + MAJOR_GRID; y += MINOR_GRID) {
                            const sx = (x - viewX) * zoom,
                                sy = (y - viewY) * zoom;
                            if (sx < -5 || sx > w + 5 || sy < -5 || sy > h + 5) continue;
                            if (x % MAJOR_GRID === 0 && y % MAJOR_GRID === 0) {
                                context.fillStyle = majorColor;
                                context.beginPath();
                                context.arc(sx, sy, 2.5 * Math.min(zoom, 1.5), 0, 2 * Math.PI);
                                context.fill();
                            } else {
                                context.fillStyle = minorColor;
                                context.beginPath();
                                context.arc(sx, sy, 1.2 * Math.min(zoom, 1.5), 0, 2 * Math.PI);
                                context.fill();
                            }
                        }
                    }
                } else if (gridStyle === 'isometric') {
                    context.strokeStyle = 'rgba(180,180,180,0.5)';
                    context.lineWidth = 0.8;
                    const step = MAJOR_GRID;
                    const half = Math.max(h, w) * 2;
                    for (let i = -half; i < half + step; i += step) {
                        const sx1 = (i - viewX) * zoom,
                            sy1 = (-viewY) * zoom;
                        const sx2 = (i + half - viewX) * zoom,
                            sy2 = (half - viewY) * zoom;
                        context.beginPath();
                        context.moveTo(sx1, sy1);
                        context.lineTo(sx2, sy2);
                        context.stroke();
                        const sx3 = (i - viewX) * zoom,
                            sy3 = (-viewY) * zoom;
                        const sx4 = (i - half - viewX) * zoom,
                            sy4 = (half - viewY) * zoom;
                        context.beginPath();
                        context.moveTo(sx3, sy3);
                        context.lineTo(sx4, sy4);
                        context.stroke();
                    }
                }
            }

            // ── Drawing helpers ──
            function drawFreeformPaths(context) {
                for (let f of freeformPaths) {
                    if (f.points.length < 2) continue;
                    context.beginPath();
                    context.moveTo((f.points[0].x - viewX) * zoom, (f.points[0].y - viewY) * zoom);
                    for (let i = 1; i < f.points.length; i++) {
                        context.lineTo((f.points[i].x - viewX) * zoom, (f.points[i].y - viewY) * zoom);
                    }
                    if (f.closed && f.points.length > 2) {
                        context.closePath();
                    }
                    context.strokeStyle = lineColor;
                    context.lineWidth = lineWidthVal;
                    context.setLineDash(lineDash);
                    context.stroke();
                    context.setLineDash([]);
                    if (f.closed && f.points.length > 2) {
                        context.fillStyle = 'rgba(139,111,192,0.06)';
                        context.fill();
                    }
                }
            }

            function drawFreeformPreview(context) {
                if (!currentFreeform || currentFreeform.points.length < 2) return;
                const pts = currentFreeform.points;
                context.beginPath();
                context.moveTo((pts[0].x - viewX) * zoom, (pts[0].y - viewY) * zoom);
                for (let i = 1; i < pts.length; i++) {
                    context.lineTo((pts[i].x - viewX) * zoom, (pts[i].y - viewY) * zoom);
                }
                context.strokeStyle = '#e07b4c';
                context.lineWidth = lineWidthVal + 1;
                context.setLineDash([4, 4]);
                context.stroke();
                context.setLineDash([]);
            }

            function drawAllEdges(context) {
                const drawn = new Set();
                for (let [i, nbrs] of adjacency) {
                    const p1 = points[i];
                    if (!p1) continue;
                    for (let j of nbrs) {
                        const key = i < j ? `${i}-${j}` : `${j}-${i}`;
                        if (drawn.has(key)) continue;
                        drawn.add(key);
                        const p2 = points[j];
                        if (!p2) continue;
                        context.beginPath();
                        context.moveTo((p1.x - viewX) * zoom, (p1.y - viewY) * zoom);
                        context.lineTo((p2.x - viewX) * zoom, (p2.y - viewY) * zoom);
                        context.strokeStyle = lineColor;
                        context.lineWidth = lineWidthVal;
                        context.setLineDash(lineDash);
                        context.stroke();
                        context.setLineDash([]);
                    }
                }
            }

            function drawCircles(context) {
                for (let c of circles) {
                    const center = points[c.centerIdx],
                        radPt = points[c.radiusIdx];
                    if (!center || !radPt) continue;
                    const r = dist(center, radPt);
                    const cx = (center.x - viewX) * zoom,
                        cy = (center.y - viewY) * zoom;
                    const radius = r * zoom;
                    const startAngle = Math.atan2(radPt.y - center.y, radPt.x - center.x);
                    let endAngle = startAngle + 2 * Math.PI;
                    let hasArc = (c.endAngleIdx !== undefined && points[c.endAngleIdx]);
                    if (hasArc) {
                        const endPt = points[c.endAngleIdx];
                        endAngle = Math.atan2(endPt.y - center.y, endPt.x - center.x);
                        let delta = endAngle - startAngle;
                        if (delta < 0) delta += 2 * Math.PI;
                        endAngle = startAngle + delta;
                    }
                    context.beginPath();
                    context.arc(cx, cy, radius, 0, 2 * Math.PI);
                    context.strokeStyle = '#8b6fc0';
                    context.lineWidth = 2.2;
                    context.setLineDash(hasArc ? [6, 4] : []);
                    context.stroke();
                    context.setLineDash([]);
                    if (c.anchors) {
                        for (let a of c.anchors) {
                            const p = points[a.idx];
                            if (p) {
                                context.beginPath();
                                context.moveTo(cx, cy);
                                context.lineTo((p.x - viewX) * zoom, (p.y - viewY) * zoom);
                                context.strokeStyle = '#8b6fc0';
                                context.lineWidth = 1.2;
                                context.setLineDash([3, 3]);
                                context.stroke();
                                context.setLineDash([]);
                            }
                        }
                    }
                    context.beginPath();
                    context.moveTo(cx, cy);
                    context.lineTo((radPt.x - viewX) * zoom, (radPt.y - viewY) * zoom);
                    context.strokeStyle = '#8b6fc0';
                    context.lineWidth = 1.5;
                    context.stroke();
                    if (hasArc) {
                        const endPt = points[c.endAngleIdx];
                        const ex = (endPt.x - viewX) * zoom,
                            ey = (endPt.y - viewY) * zoom;
                        context.beginPath();
                        context.moveTo(cx, cy);
                        context.lineTo(ex, ey);
                        context.stroke();
                        context.beginPath();
                        context.moveTo((radPt.x - viewX) * zoom, (radPt.y - viewY) * zoom);
                        context.lineTo(ex, ey);
                        context.strokeStyle = '#b39ddb';
                        context.lineWidth = 2;
                        context.setLineDash([4, 3]);
                        context.stroke();
                        context.setLineDash([]);
                        context.beginPath();
                        context.moveTo(cx, cy);
                        context.arc(cx, cy, radius, startAngle, endAngle);
                        context.closePath();
                        context.fillStyle = 'rgba(139,111,192,0.08)';
